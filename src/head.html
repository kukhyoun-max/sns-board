<title>전주대 SNS 성과 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 구성: 브리핑 → 콘텐츠 전략 → 제작·홍보대사 → 입시 시즌 → 타 대학 → 콘텐츠 탐색 → 데이터 추출 (상단 텍스트 탭) · 콘텐츠 상세는 전체 화면 패널 · 색은 전주대 UI 컬러 */
:root {
  --bg: #ffffff;
  --plane: #f2f4f6;
  --tile: #f9fafb;
  --fg: #191f28;
  --sub: #4e5968;
  --muted: #4e5968; /* 2026-10-22 회색 하나로(토스 grey700, 대비 7.1:1) · 위계는 회색 대신 크기·굵기로 */
  --line: #e5e8eb;
  /* 전주대학교 UI 컬러 — 메인 JJ 블루 #0078AD, 서브 골드 #CAAE65 · 퍼플 #8F7EAB · 그린 #83B093 · 코랄 #D1906A */
  --jj: #0078ad;
  --navy: #005494;
  --up: #0078ad;
  --up-soft: #e4f1f8;
  --down: #c2410c; /* 시안: 선명한 주황(흰 바탕 5.2:1) */
  --down-soft: #fff1ea;
  --ok: #087f5b;
  --ok-soft: #e6f7f0;
  --ai: #6f5f9e;
  --ai-soft: #efecf6;
  /* --coral은 --down과 같은 hex라 칩·분류에 쓰면 하락으로 읽힘 → 쓰지 않음(경고 문구는 --sub + 선 아이콘) */
  --coral: #c2410c;
  --coral-soft: #fff1ea;
  --down-bar: #f26b2a; /* 넓은 막대 면용 하락 주황(글자용 --down은 면에서 갈색처럼 보임) */
  /* 분류 전용 팔레트(상태색·채널색과 겹치지 않음, 갈색·주황 없음) */
  --cat-1: #0078ad; --cat-2: #005494; --cat-3: #7b61c9; --cat-4: #087f5b; --cat-5: #2aa198; --cat-6: #4e5968; --cat-7: #9aa4b1; --cat-8: #7fb3cf; --cat-9: #b9a6e8;
  --ws: #0f766e; --ws-soft: #e6f4f1; /* 근로장학생 칩(제작 주체 = 분류색) */
  /* 시안: 상태색은 계열색과 다른 hex. 빨강은 수집 실패 같은 경보에만 */
  --st-danger: #da1e28;
  --st-danger-soft: #fdecee;
  --ad: rgba(0, 120, 173, .4); /* 광고 계열 = 브랜드 블루 40% + 외곽선(인스타 색과 분리) */
  --r-lg: 16px; --r-md: 12px; --r-sm: 6px;
  /* 채널 배지의 흰 글자 대비 4.5:1 이상이 되도록 UI 컬러를 한 단계 진하게 */
  --ch-ig: #d6336c; /* 시안: 인스타 로즈 */
  --ch-yt: #1864ab;
  --ch-hong: #0ca678; /* 시안: 인스타와 명도 차 1.48 */
  /* 시안: 타 대학은 맥락이라 회색 단계 + 선 모양(실선·[6,3]·[2,2])으로 구분 */
  --ch-b1: #4e5968;
  --ch-b2: #6b7684;
  --ch-b3: #8b95a1;
  /* 흰 글자 배지는 선보다 진한 값(4.5:1) */
  --chb-hong: #087f5b;
  --chb-bench: #4e5968;
  /* 글자용 토큰(2026-10-24 UI·UX 점검 1~4번): 선·막대·면은 위 색 그대로, 회색 카드(#f2f4f6) 위 글자만 한 단계 진하게(4.5:1 이상) */
  --up-tx: #0072a6; --jj-tx: #0072a6; --cht-ig: #c2255c; --cht-hong: #087f5b;
  --on-jj: #fff; /* 파랑·빨강 면 위 글자 */
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  /* 글자 크기 단계 — 화면의 모든 글자는 이 8단계만 쓴다(최소 13px, 본문 16px) */
  --fs-tag: 14px;   /* 배지·태그·그래프 축(2026-10-22 13→14: 13px은 「안 읽어도 되는 글」 크기) */
  --fs-xs: 15px;    /* 주석·표 머리·보조 정보(2026-10-22 14→15) */
  --fs-sm: 15px;    /* 버튼·보조 본문 */
  --fs-md: 16px;    /* 본문·목록 제목 */
  --fs-lg: 18px;    /* 소제목·강조 */
  --fs-xl: 22px;    /* 섹션 제목·탭 */
  --fs-2xl: 28px;   /* 카드 큰 숫자 */
  --fs-3xl: 34px;   /* 상세 대표 숫자 */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17171c; --plane: #101013; --tile: #202027; --fg: #f2f3f5; --sub: #c3c8cf; --muted: #aab1ba; --line: #2c2c35;
    --up: #4fb0dd; --up-soft: #12293a; --down: #ff8a5c; --down-soft: #3a2118; --ok: #38d9a9; --ok-soft: #12302a; --ai: #ab9dd6; --ai-soft: #252036; --coral: #ff8a5c; --coral-soft: #3a2118; --jj: #4fb0dd; --navy: #6fa3d6;
    --ch-ig: #f06595; --ch-yt: #74a9e8; --ch-hong: #38d9a9; --ch-b1: #c3c8cf; --ch-b2: #9aa4b1; --ch-b3: #7d8590; --chb-hong: #38d9a9; --chb-bench: #9aa4b1; --st-danger: #ff6b72; --st-danger-soft: #3a1a1d; --ad: rgba(79, 176, 221, .4);
    --down-bar: #ff8a5c; --cat-1: #4fb0dd; --cat-2: #6fa3d6; --cat-3: #ab9dd6; --cat-4: #38d9a9; --cat-5: #5fd3c6; --cat-6: #c3c8cf; --cat-7: #7d8590; --cat-8: #9ccbe3; --cat-9: #d0c4f0; --ws: #5fd3c6; --ws-soft: #12302e;
    color-scheme: dark;
    --up-tx: #4fb0dd; --jj-tx: #4fb0dd; --cht-ig: #f06595; --cht-hong: #38d9a9; --on-jj: #17171c;
    --badge-fg: #17171c;
  }
}
:root[data-theme="dark"] {
  --bg: #17171c; --plane: #101013; --tile: #202027; --fg: #f2f3f5; --sub: #c3c8cf; --muted: #aab1ba; --line: #2c2c35;
  --up: #4fb0dd; --up-soft: #12293a; --down: #ff8a5c; --down-soft: #3a2118; --ok: #38d9a9; --ok-soft: #12302a; --ai: #ab9dd6; --ai-soft: #252036; --coral: #ff8a5c; --coral-soft: #3a2118; --jj: #4fb0dd; --navy: #6fa3d6;
  --ch-ig: #f06595; --ch-yt: #74a9e8; --ch-hong: #38d9a9; --ch-b1: #c3c8cf; --ch-b2: #9aa4b1; --ch-b3: #7d8590; --chb-hong: #38d9a9; --chb-bench: #9aa4b1; --st-danger: #ff6b72; --st-danger-soft: #3a1a1d; --ad: rgba(79, 176, 221, .4);
  --down-bar: #ff8a5c; --cat-1: #4fb0dd; --cat-2: #6fa3d6; --cat-3: #ab9dd6; --cat-4: #38d9a9; --cat-5: #5fd3c6; --cat-6: #c3c8cf; --cat-7: #7d8590; --cat-8: #9ccbe3; --cat-9: #d0c4f0; --ws: #5fd3c6; --ws-soft: #12302e;
  color-scheme: dark;
  --up-tx: #4fb0dd; --jj-tx: #4fb0dd; --cht-ig: #f06595; --cht-hong: #38d9a9; --on-jj: #17171c;
  --badge-fg: #17171c;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--plane); color: var(--fg); font-family: var(--font); font-size: var(--fs-md); line-height: 1.6; -webkit-font-smoothing: antialiased;
  /* 한국어는 단어 중간에서 줄을 바꾸지 않는다(긴 URL·영문만 필요할 때 끊음) */
  word-break: keep-all; overflow-wrap: anywhere; }
h1, h2, h3 { line-height: 1.3; text-wrap: balance; }
small { font-size: max(var(--fs-tag), .85em); } /* 브라우저 기본(83%)으로 13px 아래로 내려가지 않게 */
.seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }

p, li { text-wrap: pretty; }
/* 숫자·버튼·배지는 한 줄로 */
.num, .chip, .tag, .chb, .seg button, .tg2, .btn, .adtg, .wk-v, td.n, th { white-space: nowrap; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--jj); outline-offset: 2px; }
.up { color: var(--up-tx); } .down { color: var(--down); } .flat { color: var(--muted); }

.app { max-width: 1080px; margin: 0 auto; background: var(--bg); min-height: 100vh; }
.sec { background: var(--bg); padding: 24px clamp(16px, 4vw, 32px); }
.gap { height: 12px; background: var(--plane); }

/* 상단 탭 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); padding: 14px clamp(16px, 4vw, 32px) 0; display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.top::-webkit-scrollbar { display: none; }
.tt { background: none; border: 0; padding: 4px 0 12px; min-width: 44px; text-align: center; font-size: var(--fs-xl); font-weight: 700; color: #8b95a1; cursor: pointer; white-space: nowrap; letter-spacing: -0.02em; }
.tt[aria-selected="true"] { color: var(--fg); }
.status { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 16px clamp(16px, 4vw, 32px) 4px; background: var(--bg); }
.status .st { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--sub); font-size: var(--fs-sm); }
.status .st span { white-space: nowrap; }
.status .st span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 2px; }
.status .st span.live::before { background: var(--ok); }
.seg { display: inline-flex; background: var(--plane); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: var(--fs-sm); color: var(--muted); cursor: pointer; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* 지수 카드 */
.idx { display: flex; gap: 12px; overflow-x: auto; padding: 14px clamp(16px, 4vw, 32px) 20px; background: var(--bg); scroll-snap-type: x mandatory; scrollbar-width: none; }
.idx::-webkit-scrollbar { display: none; }
.ic { flex: 0 0 240px; scroll-snap-align: start; background: var(--tile); border-radius: var(--r-lg); padding: 18px 18px 16px; border: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.ic:hover { background: var(--plane); }
.ic .nm { font-size: var(--fs-sm); font-weight: 600; color: var(--sub); }
.ic .cp { font-size: var(--fs-xs); color: var(--muted); }
.ic canvas { width: 100% !important; height: 64px !important; margin: 8px 0 6px; }
.ic .v { font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.ic .d { font-size: var(--fs-md); font-weight: 600; }

/* 한 줄 요약 */
.brief { padding: 4px clamp(16px, 4vw, 32px) 24px; background: var(--bg); }
.brief .lb { font-size: var(--fs-md); font-weight: 700; color: var(--ai); }
.brief .lb small { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: var(--fs-sm); }
.brief button { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; background: none; border: 0; padding: 6px 0 0; text-align: left; font-size: var(--fs-lg); font-weight: 700; letter-spacing: -0.02em; cursor: pointer; }
.brief ul { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.brief li { font-size: var(--fs-md); color: var(--sub); padding-left: 14px; position: relative; }
.brief li::before { content: ""; position: absolute; left: 0; top: 10px; width: 5px; height: 5px; border-radius: 50%; background: var(--ai); }
.chev { color: var(--muted); font-size: var(--fs-xl); flex: none; transition: transform .15s; }

/* 섹션 머리 */
.sh { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.sh h2 { margin: 0; font-size: var(--fs-xl); font-weight: 700; letter-spacing: -0.02em; }
.sh p { margin: 2px 0 0; font-size: var(--fs-sm); color: var(--muted); }

/* 분류 칩 */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: none; padding: 9px 14px; border-radius: 12px; font-size: var(--fs-md); font-weight: 600; color: var(--sub); cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--plane); color: var(--fg); }
.chip b { font-weight: 600; margin-left: 4px; }

/* 트리맵 */
.more { display: block; width: 100%; margin-top: 14px; border: 0; background: none; color: var(--sub); font-size: var(--fs-md); padding: 10px; cursor: pointer; }

/* 순위 목록 */
.rank { list-style: none; margin: 0; padding: 0; }
/* 순위 행: 제목이 폭을 다 쓰도록 태그는 날짜 줄 아래로 */
.rk { display: grid; grid-template-columns: 28px minmax(0, 1fr); align-items: center; column-gap: 14px; row-gap: 6px; padding: 12px 8px 12px 0; cursor: pointer; border-radius: 12px; }
.rk:hover { background: var(--tile); }
.rk .no { font-size: var(--fs-lg); font-weight: 700; color: var(--sub); text-align: center; }
.av { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: var(--fs-xs); letter-spacing: -0.02em; flex: none; }
.rk .t { min-width: 0; }
.rk .t b { display: block; font-size: var(--fs-md); font-weight: 600; margin-bottom: 2px; }
.rk .t span { font-size: var(--fs-sm); color: var(--muted); }
.rk .t span em { font-style: normal; font-weight: 600; }
.rk .tg { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-start; }
.rk .tg:empty { display: none; }

/* 태그 */
.tag { display: inline-flex; align-items: center; font-size: var(--fs-tag); font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--plane); color: var(--sub); white-space: nowrap; }
.tag.p-amb { background: var(--ok-soft); color: var(--ok); }
.tag.p-ad { background: transparent; color: var(--jj); box-shadow: inset 0 0 0 1px var(--ad); } /* 광고 = 블루 외곽선(하락 주황 아님) */
.tag.p-own { background: var(--up-soft); color: var(--navy); }
.tag.p-ugc { background: var(--ai-soft); color: var(--ai); }
.tag.p-col { background: var(--down-soft); color: var(--down); }
/* 채널 배너 */
.chb { display: inline-flex; align-items: center; flex: none; font-size: var(--fs-tag); font-weight: 700; letter-spacing: -0.01em; line-height: 1; padding: 4px 7px; border-radius: 5px; color: var(--badge-fg, #fff); background: var(--c); margin-right: 7px; vertical-align: 2px; }
.ln { display: flex; align-items: center; min-width: 0; }
.ln > .tx { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rk .t .ln .chb { color: var(--badge-fg, #fff); font-size: var(--fs-tag); }
.rk .t .ln .tx { color: var(--fg); font-size: var(--fs-md); }

/* 분석 표 */
.ana { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; }
@media (max-width: 860px) { .ana { grid-template-columns: minmax(0, 1fr); } }
.ana h3 { margin: 0 0 10px; font-size: var(--fs-lg); font-weight: 700; }
.bars { display: flex; flex-direction: column; gap: 4px; }
.br { display: grid; grid-template-columns: 150px minmax(0, 1fr) 64px; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 8px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.br:hover { background: var(--tile); }
.br .l { font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.br .l small { display: block; font-size: var(--fs-tag); color: var(--muted); font-weight: 400; white-space: normal; line-height: 1.5; }
.br .v em { display: block; font-style: normal; font-size: var(--fs-tag); font-weight: 400; color: var(--muted); }
.br .tr { height: 22px; background: var(--tile); border-radius: 6px; position: relative; overflow: hidden; }
.br .tr i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
.br .tr .mid { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); opacity: .35; }
.br .v { font-size: var(--fs-sm); font-weight: 700; text-align: right; }
.note { font-size: var(--fs-xs); color: var(--muted); margin: 10px 0 0; }

/* 표 */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: var(--fs-sm); }
th, td { padding: 11px 8px; border-bottom: 1px solid var(--line); text-align: left; }
th { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; white-space: nowrap; }
th button { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font-weight: 600; width: 100%; text-align: inherit; }
th button[data-dir]::after { content: " ↓"; color: var(--jj-tx); }
th button[data-dir="asc"]::after { content: " ↑"; }
td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
/* 누를 수 있는 줄만 손가락 커서·hover(2026-10-24 점검 11번, app.js KB_SEL과 같은 대상) */
tbody tr.click, tbody tr[data-i], tbody tr[data-s] { cursor: pointer; }
tbody tr.click:hover, tbody tr[data-i]:hover, tbody tr[data-s]:hover { background: var(--tile); }
td.tt2 { max-width: 420px; }

/* 상세 패널 */
.detail { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; }
.dwrap { max-width: 760px; margin: 0 auto; padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.dh { position: sticky; top: 0; z-index: 2; background: var(--bg); display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; }
.dh button { width: 44px; height: 44px; border: 0; background: none; font-size: var(--fs-2xl); cursor: pointer; border-radius: 12px; }
.dh button:hover { background: var(--tile); }
.dh .ctr { text-align: center; min-width: 0; }
.dh .ctr small { display: block; font-size: var(--fs-xs); color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dh .ctr b { font-size: var(--fs-md); font-weight: 700; }
.dtabs { display: flex; gap: 22px; padding: 0 20px; border-bottom: 1px solid var(--line); position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); background: var(--bg); z-index: 2; }
.dtabs button { border: 0; background: none; padding: 10px 0 12px; font-size: var(--fs-lg); font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; }
.dtabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }
.dsec { padding: 22px 20px; }
.dtitle { font-size: var(--fs-xl); font-weight: 700; letter-spacing: -0.02em; line-height: 1.4; margin: 0 0 10px; }
.dtitle .chb { font-size: var(--fs-tag); padding: 5px 8px; }
.dbig { font-size: var(--fs-3xl); font-weight: 700; letter-spacing: -0.02em; }
.dbig small { display: block; margin: 4px 0 0; font-size: var(--fs-sm); font-weight: 700; line-height: 1.5; white-space: normal; letter-spacing: 0; }
.dtags { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; }
.cmp { position: relative; height: 230px; margin-top: 16px; }
.dper { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
.dper span { font-size: var(--fs-sm); color: var(--muted); padding: 6px 12px; border-radius: 10px; }
.dper span.on { background: var(--plane); color: var(--fg); font-weight: 700; }
.why .lb { color: var(--ai); font-weight: 700; font-size: var(--fs-md); display: flex; justify-content: space-between; }
.why .lb small { color: var(--muted); font-weight: 400; font-size: var(--fs-sm); }
.why p { margin: 8px 0 0; font-size: var(--fs-lg); font-weight: 600; letter-spacing: -0.01em; line-height: 1.5; }
.sig h3 { margin: 0 0 4px; font-size: var(--fs-xl); font-weight: 700; }
.sig .h { font-size: var(--fs-sm); color: var(--muted); margin-bottom: 14px; }
.sg { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 0; }
.sg .k { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: var(--fs-md); }
.sg .k.good { background: var(--up-soft); color: var(--up); }
.sg .k.bad { background: var(--down-soft); color: var(--down); }
.sg .k.info { background: var(--plane); color: var(--sub); }
.sg b { font-size: var(--fs-lg); font-weight: 600; display: block; letter-spacing: -0.01em; color: var(--fg); }
.sg span span { display: block; }
.sg span { font-size: var(--fs-sm); color: var(--muted); }
.mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; }
.mgrid div { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-md); gap: 10px; }
.mgrid div:nth-child(odd) { margin-right: 14px; }
.mgrid span { color: var(--sub); }
.mgrid b { font-weight: 700; font-variant-numeric: tabular-nums; }
.caption { white-space: pre-wrap; font-size: var(--fs-md); color: var(--sub); background: var(--tile); border-radius: 14px; padding: 14px 16px; margin: 0; }
.cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.cta a, .cta span { display: block; max-width: 720px; margin: 0 auto; text-align: center; padding: 16px; border-radius: 16px; font-size: var(--fs-lg); font-weight: 700; text-decoration: none; }
.cta a { background: var(--jj); color: var(--on-jj); }
.cta span { background: var(--plane); color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: var(--fs-md); }
@media (max-width: 560px) {
  .tt { font-size: var(--fs-xl); }
  .rk { grid-template-columns: 22px minmax(0, 1fr); column-gap: 10px; }
  .av { width: 42px; height: 42px; }

  .mgrid { grid-template-columns: minmax(0, 1fr); }
  .mgrid div:nth-child(odd) { margin-right: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
