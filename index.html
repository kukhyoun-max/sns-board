<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>전주대 SNS 성과 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* 구성: 브리핑 → 콘텐츠 전략 → 제작·홍보대사 → 입시 시즌 → 타 대학 → 콘텐츠 탐색 → 데이터 추출 (상단 텍스트 탭) · 콘텐츠 상세는 전체 화면 패널 · 색은 전주대 UI 컬러 */
:root {
  --bg: #ffffff;
  --plane: #f2f4f6;
  --tile: #f9fafb;
  --fg: #191f28;
  --sub: #4e5968;
  --muted: #5f6b78; /* 글자 대비 4.5:1 이상(이전 #8b95a1은 3.0:1) */
  --line: #e5e8eb;
  /* 전주대학교 UI 컬러 — 메인 JJ 블루 #0078AD, 서브 골드 #CAAE65 · 퍼플 #8F7EAB · 그린 #83B093 · 코랄 #D1906A */
  --jj: #0078ad;
  --navy: #005494;
  --up: #0078ad;
  --up-soft: #e4f1f8;
  --down: #c2410c; /* 시안: 선명한 주황(흰 바탕 5.2:1) */
  --down-soft: #fff1ea;
  --ok: #087f5b;
  --ok-soft: #e6f7f0;
  --ai: #6f5f9e;
  --ai-soft: #efecf6;
  --coral: #c2410c;
  --coral-soft: #fff1ea;
  /* 시안: 상태색은 계열색과 다른 hex. 빨강은 수집 실패 같은 경보에만 */
  --st-danger: #da1e28;
  --st-danger-soft: #fdecee;
  --ad: rgba(0, 120, 173, .4); /* 광고 계열 = 브랜드 블루 40% + 외곽선(인스타 색과 분리) */
  --r-lg: 16px; --r-md: 12px; --r-sm: 6px;
  /* 채널 배지의 흰 글자 대비 4.5:1 이상이 되도록 UI 컬러를 한 단계 진하게 */
  --ch-ig: #d6336c; /* 시안: 인스타 로즈 */
  --ch-yt: #1864ab;
  --ch-hong: #0ca678; /* 시안: 인스타와 명도 차 1.48 */
  /* 시안: 타 대학은 맥락이라 회색 단계 + 선 모양(실선·[6,3]·[2,2])으로 구분 */
  --ch-b1: #4e5968;
  --ch-b2: #6b7684;
  --ch-b3: #8b95a1;
  /* 흰 글자 배지는 선보다 진한 값(4.5:1) */
  --chb-hong: #087f5b;
  --chb-bench: #4e5968;
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  /* 글자 크기 단계 — 화면의 모든 글자는 이 8단계만 쓴다(최소 13px, 본문 16px) */
  --fs-tag: 13px;   /* 배지·태그·그래프 축 */
  --fs-xs: 14px;    /* 주석·표 머리·보조 정보 */
  --fs-sm: 15px;    /* 버튼·보조 본문 */
  --fs-md: 16px;    /* 본문·목록 제목 */
  --fs-lg: 18px;    /* 소제목·강조 */
  --fs-xl: 22px;    /* 섹션 제목·탭 */
  --fs-2xl: 28px;   /* 카드 큰 숫자 */
  --fs-3xl: 34px;   /* 상세 대표 숫자 */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17171c; --plane: #101013; --tile: #202027; --fg: #f2f3f5; --sub: #c3c8cf; --muted: #8b929c; --line: #2c2c35;
    --up: #4fb0dd; --up-soft: #12293a; --down: #ff8a5c; --down-soft: #3a2118; --ok: #38d9a9; --ok-soft: #12302a; --ai: #ab9dd6; --ai-soft: #252036; --coral: #ff8a5c; --coral-soft: #3a2118; --jj: #4fb0dd; --navy: #6fa3d6;
    --ch-ig: #f06595; --ch-yt: #74a9e8; --ch-hong: #38d9a9; --ch-b1: #c3c8cf; --ch-b2: #9aa4b1; --ch-b3: #7d8590; --chb-hong: #38d9a9; --chb-bench: #9aa4b1; --st-danger: #ff6b72; --st-danger-soft: #3a1a1d; --ad: rgba(79, 176, 221, .4);
    color-scheme: dark;
    --badge-fg: #17171c;
  }
}
:root[data-theme="dark"] {
  --bg: #17171c; --plane: #101013; --tile: #202027; --fg: #f2f3f5; --sub: #c3c8cf; --muted: #8b929c; --line: #2c2c35;
  --up: #4fb0dd; --up-soft: #12293a; --down: #ff8a5c; --down-soft: #3a2118; --ok: #38d9a9; --ok-soft: #12302a; --ai: #ab9dd6; --ai-soft: #252036; --coral: #ff8a5c; --coral-soft: #3a2118; --jj: #4fb0dd; --navy: #6fa3d6;
  --ch-ig: #f06595; --ch-yt: #74a9e8; --ch-hong: #38d9a9; --ch-b1: #c3c8cf; --ch-b2: #9aa4b1; --ch-b3: #7d8590; --chb-hong: #38d9a9; --chb-bench: #9aa4b1; --st-danger: #ff6b72; --st-danger-soft: #3a1a1d; --ad: rgba(79, 176, 221, .4);
  color-scheme: dark;
  --badge-fg: #17171c;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--plane); color: var(--fg); font-family: var(--font); font-size: var(--fs-md); line-height: 1.6; -webkit-font-smoothing: antialiased;
  /* 한국어는 단어 중간에서 줄을 바꾸지 않는다(긴 URL·영문만 필요할 때 끊음) */
  word-break: keep-all; overflow-wrap: anywhere; }
h1, h2, h3 { line-height: 1.3; text-wrap: balance; }
small { font-size: max(var(--fs-tag), .85em); } /* 브라우저 기본(83%)으로 13px 아래로 내려가지 않게 */
.seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }

p, li { text-wrap: pretty; }
/* 숫자·버튼·배지는 한 줄로 */
.num, .chip, .tag, .chb, .seg button, .tg2, .btn, .adtg, .wk-v, td.n, th { white-space: nowrap; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--jj); outline-offset: 2px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }

.app { max-width: 1080px; margin: 0 auto; background: var(--bg); min-height: 100vh; }
.sec { background: var(--bg); padding: 24px clamp(16px, 4vw, 32px); }
.gap { height: 12px; background: var(--plane); }

/* 상단 탭 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); padding: 14px clamp(16px, 4vw, 32px) 0; display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.top::-webkit-scrollbar { display: none; }
.tt { background: none; border: 0; padding: 4px 0 12px; font-size: var(--fs-xl); font-weight: 700; color: #8b95a1; cursor: pointer; white-space: nowrap; letter-spacing: -0.02em; }
.tt[aria-selected="true"] { color: var(--fg); }
.status { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 16px clamp(16px, 4vw, 32px) 4px; background: var(--bg); }
.status .st { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--sub); font-size: var(--fs-sm); }
.status .st span { white-space: nowrap; }
.status .st span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 2px; }
.status .st span.live::before { background: var(--ok); }
.seg { display: inline-flex; background: var(--plane); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: var(--fs-sm); color: var(--muted); cursor: pointer; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* 지수 카드 */
.idx { display: flex; gap: 12px; overflow-x: auto; padding: 14px clamp(16px, 4vw, 32px) 20px; background: var(--bg); scroll-snap-type: x mandatory; scrollbar-width: none; }
.idx::-webkit-scrollbar { display: none; }
.ic { flex: 0 0 240px; scroll-snap-align: start; background: var(--tile); border-radius: var(--r-lg); padding: 18px 18px 16px; border: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.ic:hover { background: var(--plane); }
.ic .nm { font-size: var(--fs-sm); font-weight: 600; color: var(--sub); }
.ic .cp { font-size: var(--fs-xs); color: var(--muted); }
.ic canvas { width: 100% !important; height: 64px !important; margin: 8px 0 6px; }
.ic .v { font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.ic .d { font-size: var(--fs-md); font-weight: 600; }

/* 한 줄 요약 */
.brief { padding: 4px clamp(16px, 4vw, 32px) 24px; background: var(--bg); }
.brief .lb { font-size: var(--fs-md); font-weight: 700; color: var(--ai); }
.brief .lb small { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: var(--fs-sm); }
.brief button { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; background: none; border: 0; padding: 6px 0 0; text-align: left; font-size: var(--fs-lg); font-weight: 700; letter-spacing: -0.02em; cursor: pointer; }
.brief ul { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.brief li { font-size: var(--fs-md); color: var(--sub); padding-left: 14px; position: relative; }
.brief li::before { content: ""; position: absolute; left: 0; top: 10px; width: 5px; height: 5px; border-radius: 50%; background: var(--ai); }
.chev { color: var(--muted); font-size: var(--fs-xl); flex: none; transition: transform .15s; }

/* 섹션 머리 */
.sh { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.sh h2 { margin: 0; font-size: var(--fs-xl); font-weight: 700; letter-spacing: -0.02em; }
.sh p { margin: 2px 0 0; font-size: var(--fs-sm); color: var(--muted); }

/* 분류 칩 */
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: none; padding: 9px 14px; border-radius: 12px; font-size: var(--fs-md); font-weight: 600; color: var(--sub); cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--plane); color: var(--fg); }
.chip b { font-weight: 600; margin-left: 4px; }

/* 트리맵 */
.tree { position: relative; height: 380px; border-radius: 8px; overflow: hidden; }
.tm { position: absolute; border: 2px solid var(--bg); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4px 6px; color: #fff; cursor: pointer; overflow: hidden; }
.tm:hover { filter: brightness(1.08); }
.tm .a { font-size: var(--fs-md); font-weight: 700; line-height: 1.3; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tm .b { font-size: var(--fs-sm); font-weight: 400; opacity: .95; }
.tm.s .a { font-size: var(--fs-tag); }
.tm.s .b { font-size: var(--fs-tag); }
.tm.xs .b { display: none; }
.legend { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: var(--fs-xs); color: var(--muted); gap: 10px; flex-wrap: wrap; }
.scale { display: flex; gap: 2px; align-items: center; }
.scale i { width: 22px; height: 10px; border-radius: 2px; display: inline-block; }
.more { display: block; width: 100%; margin-top: 14px; border: 0; background: none; color: var(--sub); font-size: var(--fs-md); padding: 10px; cursor: pointer; }

/* 순위 목록 */
.rank { list-style: none; margin: 0; padding: 0; }
/* 순위 행: 제목이 폭을 다 쓰도록 태그는 날짜 줄 아래로 */
.rk { display: grid; grid-template-columns: 28px minmax(0, 1fr); align-items: center; column-gap: 14px; row-gap: 6px; padding: 12px 8px 12px 0; cursor: pointer; border-radius: 12px; }
.rk:hover { background: var(--tile); }
.rk .no { font-size: var(--fs-lg); font-weight: 700; color: var(--sub); text-align: center; }
.av { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: var(--fs-xs); letter-spacing: -0.02em; flex: none; }
.rk .t { min-width: 0; }
.rk .t b { display: block; font-size: var(--fs-md); font-weight: 600; margin-bottom: 2px; }
.rk .t span { font-size: var(--fs-sm); color: var(--muted); }
.rk .t span em { font-style: normal; font-weight: 600; }
.rk .tg { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-start; }
.rk .tg:empty { display: none; }

/* 태그 */
.tag { display: inline-flex; align-items: center; font-size: var(--fs-tag); font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--plane); color: var(--sub); white-space: nowrap; }
.tag.p-amb { background: var(--ok-soft); color: var(--ok); }
.tag.p-ad { background: var(--coral-soft); color: var(--coral); }
.tag.p-own { background: var(--up-soft); color: var(--navy); }
.tag.p-ugc { background: var(--ai-soft); color: var(--ai); }
.tag.p-col { background: var(--down-soft); color: var(--down); }
/* 채널 배너 */
.chb { display: inline-flex; align-items: center; flex: none; font-size: var(--fs-tag); font-weight: 700; letter-spacing: -0.01em; line-height: 1; padding: 4px 7px; border-radius: 5px; color: var(--badge-fg, #fff); background: var(--c); margin-right: 7px; vertical-align: 2px; }
.ln { display: flex; align-items: center; min-width: 0; }
.ln > .tx { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rk .t .ln .chb { color: var(--badge-fg, #fff); font-size: var(--fs-tag); }
.rk .t .ln .tx { color: var(--fg); font-size: var(--fs-md); }

/* 분석 표 */
.ana { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; }
@media (max-width: 860px) { .ana { grid-template-columns: minmax(0, 1fr); } }
.ana h3 { margin: 0 0 10px; font-size: var(--fs-lg); font-weight: 700; }
.bars { display: flex; flex-direction: column; gap: 4px; }
.br { display: grid; grid-template-columns: 150px minmax(0, 1fr) 64px; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 8px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.br:hover { background: var(--tile); }
.br .l { font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.br .l small { display: block; font-size: var(--fs-tag); color: var(--muted); font-weight: 400; }
.br .tr { height: 22px; background: var(--tile); border-radius: 6px; position: relative; overflow: hidden; }
.br .tr i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
.br .tr .mid { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); opacity: .35; }
.br .v { font-size: var(--fs-sm); font-weight: 700; text-align: right; }
.note { font-size: var(--fs-xs); color: var(--muted); margin: 10px 0 0; }

/* 표 */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: var(--fs-sm); }
th, td { padding: 11px 8px; border-bottom: 1px solid var(--line); text-align: left; }
th { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; white-space: nowrap; }
th button { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font-weight: 600; }
th button[data-dir]::after { content: " ↓"; color: var(--jj); }
th button[data-dir="asc"]::after { content: " ↑"; }
td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--tile); }
td.tt2 { max-width: 420px; }

/* 상세 패널 */
.detail { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; }
.dwrap { max-width: 760px; margin: 0 auto; padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.dh { position: sticky; top: 0; z-index: 2; background: var(--bg); display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; }
.dh button { width: 44px; height: 44px; border: 0; background: none; font-size: var(--fs-2xl); cursor: pointer; border-radius: 12px; }
.dh button:hover { background: var(--tile); }
.dh .ctr { text-align: center; min-width: 0; }
.dh .ctr small { display: block; font-size: var(--fs-xs); color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dh .ctr b { font-size: var(--fs-md); font-weight: 700; }
.dtabs { display: flex; gap: 22px; padding: 0 20px; border-bottom: 1px solid var(--line); position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); background: var(--bg); z-index: 2; }
.dtabs button { border: 0; background: none; padding: 10px 0 12px; font-size: var(--fs-lg); font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; }
.dtabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }
.dsec { padding: 22px 20px; }
.dtitle { font-size: var(--fs-xl); font-weight: 700; letter-spacing: -0.02em; line-height: 1.4; margin: 0 0 10px; }
.dtitle .chb { font-size: var(--fs-tag); padding: 5px 8px; }
.dbig { font-size: var(--fs-3xl); font-weight: 700; letter-spacing: -0.02em; }
.dbig small { font-size: var(--fs-lg); font-weight: 700; margin-left: 8px; }
.dtags { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
.cmp { position: relative; height: 230px; margin-top: 16px; }
.dper { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
.dper span { font-size: var(--fs-sm); color: var(--muted); padding: 6px 12px; border-radius: 10px; }
.dper span.on { background: var(--plane); color: var(--fg); font-weight: 700; }
.why .lb { color: var(--ai); font-weight: 700; font-size: var(--fs-md); display: flex; justify-content: space-between; }
.why .lb small { color: var(--muted); font-weight: 400; font-size: var(--fs-sm); }
.why p { margin: 8px 0 0; font-size: var(--fs-lg); font-weight: 600; letter-spacing: -0.01em; line-height: 1.5; }
.sig h3 { margin: 0 0 4px; font-size: var(--fs-xl); font-weight: 700; }
.sig .h { font-size: var(--fs-sm); color: var(--muted); margin-bottom: 14px; }
.sg { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 0; }
.sg .k { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: var(--fs-md); }
.sg .k.good { background: var(--up-soft); color: var(--up); }
.sg .k.bad { background: var(--coral-soft); color: var(--coral); }
.sg .k.info { background: var(--plane); color: var(--sub); }
.sg b { font-size: var(--fs-lg); font-weight: 600; display: block; letter-spacing: -0.01em; color: var(--fg); }
.sg span span { display: block; }
.sg span { font-size: var(--fs-sm); color: var(--muted); }
.mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; }
.mgrid div { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-md); gap: 10px; }
.mgrid div:nth-child(odd) { margin-right: 14px; }
.mgrid span { color: var(--sub); }
.mgrid b { font-weight: 700; font-variant-numeric: tabular-nums; }
.caption { white-space: pre-wrap; font-size: var(--fs-md); color: var(--sub); background: var(--tile); border-radius: 14px; padding: 14px 16px; margin: 0; }
.cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" integrity="sha384-dug+JxfBvklEQdJ4AYuBBAIScUz0bVN73xpy273gcAwHjb3qI0fXmuYNaNfdyYJG" crossorigin="anonymous"></script>
<script>
(function () {
  // ───────── 기본값 ─────────
  const OWN = ['인스타그램', '유튜브', 'hong._.video'];
  const CH_VAR = { '인스타그램': '--ch-ig', '유튜브': '--ch-yt', 'hong._.video': '--ch-hong' };
  const CH_BADGE = { '인스타그램': '인스타', '유튜브': '유튜브', 'hong._.video': 'hong', 'jbnu1947': '전북대', 'wonkwang_univ': '원광대', 'woosukuni': '우석대' };
  const PROD_CLASS = { '홍보대사': 'p-amb', '광고': 'p-ad', '자체 제작': 'p-own', '학생 크리에이터': 'p-ugc', '학과·기관 협업': 'p-col', '근로장학생': 'p-ws' };
  const PRODS = ['자체 제작', '홍보대사', '근로장학생', '학생 크리에이터', '학과·기관 협업'];
  const RANGES = [['30', '1달'], ['90', '3달'], ['365', '1년'], ['all', '전체']];
  const MN = ['조회', '좋아요', '댓글', '공유', '저장'];
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  const HIT = 1.5; // 히트 = 평소(같은 채널·같은 형식 최근 1년 중앙값, 형식 표본이 적으면 채널 중앙값)의 1.5배 이상
  const MIN_N = 5; // 표본 적음 기준 — 이보다 적은 그룹은 결론·순위에서 뺀다
  const VIEWS = [['brief', '홈'], ['strategy', '전략'], ['maker', '제작·사람'], ['season', '입시'], ['ads', '광고'], ['explore', '탐색'], ['export', '추출']];
  const TABS = ['전체', '인스타그램', '유튜브', 'hong._.video', '타 대학'];
  const ICONS = {
    brief: '<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/>',
    strategy: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
    maker: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6c2.4.1 4 1.7 4.5 4.4"/>',
    season: '<path d="M2.5 9 12 4.5 21.5 9 12 13.5z"/><path d="M6.5 11v4.5c1.5 1.6 3.4 2.5 5.5 2.5s4-.9 5.5-2.5V11"/><path d="M21.5 9v5"/>',
    ads: '<path d="M4 10v4a1 1 0 0 0 1 1h2l5 4V5L7 9H5a1 1 0 0 0-1 1z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18.5 7a7 7 0 0 1 0 10"/>',
    explore: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',
    export: '<path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4.5 19.5h15"/>',
  };
  const STORE = 'jj-sns-board-v6';
  const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  const XLSX_SRI = 'sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw';
  let D = null, charts = {};
  const S = { ads: false, view: 'brief', ch: '전체', range: '365', trendCh: '인스타그램', g: null, rankBy: 'views', sort: null, rankShown: 10, tblShown: 30, mx: null, person: null, roleF: '전체', season: null, psort: 'n' };

  const $ = id => document.getElementById(id);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const fmt = n => (n == null || isNaN(n)) ? '–' : Math.round(n).toLocaleString('ko-KR');
  const fmtK = n => {
    if (n == null || isNaN(n)) return '–';
    const a = Math.abs(n);
    if (a >= 1e8) return (n / 1e8).toFixed(1).replace(/\.0$/, '') + '억';
    if (a >= 1e4) return (n / 1e4).toFixed(a >= 1e5 ? 0 : 1).replace(/\.0$/, '') + '만';
    return Math.round(n).toLocaleString('ko-KR');
  };
  const pct = v => (v == null || isNaN(v)) ? '–' : (v * 100).toFixed(1) + '%';
  const pctA = v => (v == null || isNaN(v)) ? '–' : (v * 100).toFixed(Math.abs(v) < 0.01 ? 2 : 1) + '%';
  const pct0 = v => (v == null || isNaN(v)) ? '–' : Math.round(v * 100) + '%';
  const xf = v => (v == null || isNaN(v)) ? '–' : v.toFixed(v > 0 && v < 0.1 ? 2 : 1) + '배';
  const sgn = v => (v > 0 ? '+' : '');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5);
  const median = a => { const s = a.filter(v => v != null && !isNaN(v)).sort((x, y) => x - y); if (!s.length) return null; const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const sum = a => a.reduce((s, v) => s + (v == null || isNaN(v) ? 0 : v), 0);
  const mean = a => { const f = a.filter(v => v != null && !isNaN(v)); return f.length ? sum(f) / f.length : null; };
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify({ view: S.view, ch: S.ch, range: S.range, trendCh: S.trendCh, ads: S.ads })); } catch (e) {} };
  const load = () => { try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; } };
  const mdLabel = d => (+d.slice(5, 7)) + '월 ' + (+d.slice(8, 10)) + '일';
  const md2 = d => (+d.slice(5, 7)) + '/' + (+d.slice(8, 10));
  const dot = d => d.slice(2).replace(/-/g, '.');
  const toast = msg => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); };

  // ───────── 값 ─────────
  // it.P: 「인스타_과거기록」 탭의 한 번짜리 기록값 (기록일 없음, it.x = 1)
  const last0 = it => { for (let i = it.h.length - 1; i >= 0; i--) if (it.h[i]) return it.h[i]; return it.P || null; };
  // 유튜브는 전체 기간 값(it.L: 조회·좋아요·댓글·공유)이 있으면 그걸 누적 수치로 사용
  const last = it => { const b = last0(it); if (!it.L) return b; return [it.L[0], it.L[1] != null ? it.L[1] : b && b[1], it.L[2] != null ? it.L[2] : b && b[2], it.L[3] != null ? it.L[3] : b && b[3], b ? b[4] : null]; };
  const val = (it, m) => { const v = last(it); return v ? v[m] : null; };
  const weekly = () => D.dates.length > 1;
  const incAt = (it, i, m) => {
    if (i <= 0 || !it.h[i]) return null;
    const cur = it.h[i][m]; if (cur == null) return null;
    const prev = it.h[i - 1];
    // 직전 기록에 없던 게시물: 직전 기록일 이후(당일 포함) 게시물이거나 이번에 처음 수집된 게시물이면 이번 값 전체가 증가분
    if (!prev) { if (it.d >= D.dates[i - 1]) return cur; for (let j = 0; j < i - 1; j++) if (it.h[j]) return null; return cur; }
    return prev[m] == null ? null : cur - prev[m];
  };
  const inc = (it, m) => incAt(it, D.dates.length - 1, m);
  const engagement = it => { const v = last(it); if (!v || !(it.r > 0)) return null; return ((v[1] || 0) + (v[2] || 0) + (v[3] || 0) + (v[4] || 0)) / it.r; };
  const completion = it => (it.a > 0 && it.l > 0) ? Math.min(it.a / it.l, 1) : null;
  const likeRate = it => { const v = last(it); return v && v[0] > 0 ? (v[1] || 0) / v[0] : null; };
  const quality = it => it.c === '인스타그램' ? engagement(it) : it.c === '유튜브' ? completion(it) : likeRate(it);
  const qName = ch => ch === '인스타그램' ? '참여율' : ch === '유튜브' ? '시청 완료율' : '좋아요율';
  const mainM = ch => OWN.includes(ch) ? 0 : 1;
  const mainVal = it => val(it, mainM(it.c));
  const isBench = ch => !OWN.includes(ch);
  const chColor = ch => {
    if (CH_VAR[ch]) return css(CH_VAR[ch]);
    const b = benchNames();
    return css(['--ch-b1', '--ch-b2', '--ch-b3'][Math.max(0, b.indexOf(ch)) % 3]);
  };
  const benchNames = () => D.channels.filter(c => c.bench).map(c => c.name);
  const chName = ch => CH_BADGE[ch] || ch;
  // 시안: 증감은 색 + 기호 + 숫자. ±3% 이내는 회색 "비슷해요"
  const FLAT = 0.03;
  const dCls = d => Math.abs(d) < FLAT ? 'flat' : d >= 0 ? 'up' : 'down';
  const dTxt = (d, sp, dig) => Math.abs(d) < FLAT ? '비슷해요' : d >= 1 ? '▲' + (sp ? ' ' : '') + (1 + d).toFixed(1) + '배' : (d >= 0 ? '▲' : '▼') + (sp ? ' ' : '') + Math.abs(dig ? Math.round(d * 1000) / 10 : Math.round(d * 100)) + '%';
  const fmtType = t => t === '1분 이하' ? '쇼츠(1분 이하)' : t;

  // 채널 기준값(최근 1년 중앙값, 광고·스토리 제외) — 성과 지수 = 콘텐츠 값 ÷ 기준값
  const BASE = {};
  function baseOf(ch, m) {
    m = m == null ? mainM(ch) : m;
    const k = ch + '|' + m;
    if (BASE[k]) return BASE[k];
    const its = D.items.filter(it => it.c === ch && it.t !== '스토리' && !it.ad && !it.x && !(it.c === '인스타그램' && it.d < '2024-12-27') && it.d >= addDays(D.updated, -365));
    // 기준값이 0·없음이면(원광대 좋아요 0 수집 등) 1로 대체하지 않고 비교 불가로 둔다
    const bv = median(its.map(it => val(it, m)));
    BASE[k] = { v: bv > 0 ? bv : null, q: median(its.map(quality)) };
    return BASE[k];
  }
  // 과거 기록(it.x)은 기록 시점 값이라 지금 기준값과 비교하지 않음
  // 형식별 기준값: 같은 채널·같은 형식 최근 1년 게시물이 BASE_T_MIN개 이상이면 그 중앙값, 아니면 채널 기준값
  // (캐러셀 조회는 슬라이드 넘김 중복, 쇼츠는 반복 재생으로 조회가 크게 나와 채널 하나의 기준으로 비교하면 히트가 그쪽으로 쏠림)
  const BASE_T_MIN = 15;
  function baseFor(it, m) {
    m = m == null ? mainM(it.c) : m;
    const k = it.c + '|' + m + '|t:' + it.t;
    if (BASE[k]) return BASE[k];
    const its = D.items.filter(x => x.c === it.c && x.t === it.t && x.t !== '스토리' && !x.ad && !x.x && x.d >= addDays(D.updated, -365));
    const bv = its.length >= BASE_T_MIN ? median(its.map(x => val(x, m))) : null;
    BASE[k] = bv > 0 ? { v: bv, by: '형식', n: its.length, q: median(its.map(quality)) } : Object.assign({ by: '채널' }, baseOf(it.c, m));
    return BASE[k];
  }
  // 인스타 자동 수집 시작(2024-12-27) 전 게시물은 값이 26-01-01 기록에 고정돼 있어 지수 계산에서 뺀다
  const frozen = it => it.c === '인스타그램' && it.d < '2024-12-27';
  const ratio = it => { if (it.x || frozen(it)) return null; const v = mainVal(it), b = baseFor(it).v; return v == null || !b ? null : v / b; };
  const likeRatio = it => { if (it.x || frozen(it)) return null; const v = val(it, 1), b = baseFor(it, 1).v; return v == null || !b ? null : v / b; };
  // 경과일 편향: 게시 AGE_MIN일 전 게시물은 조회가 덜 쌓여(첫 기록이 현재 값의 인스타 약 0.8, 유튜브 약 0.5) 히트·부진 판정과 히트율에서 뺀다
  const AGE_MIN = 14;
  const young = it => daysBetween(it.d, D.updated) < AGE_MIN;
  const judged = it => ratio(it) != null && !young(it);
  const isHit = it => { const r = ratio(it); return r != null && !young(it) && r >= HIT; };
  const hitRate = L => { const f = L.filter(judged); return f.length ? f.filter(isHit).length / f.length : null; };

  // ───────── 제목·배너 ─────────
  function title(s) {
    const lines = String(s || '').split(/[⠀ㅤᅟ]|\n+|\s{3,}| - - /).map(x => x.replace(/[|｜【】\[\]#]/g, ' ').replace(/\s+/g, ' ').trim().replace(/^[^\p{L}\p{N}]+/u, '')).filter(Boolean);
    return lines[0] || '(캡션 없음)';
  }
  function badge(ch) { return '<span class="chb" style="--c:' + (ch === 'hong._.video' ? css('--chb-hong') : isBench(ch) ? css('--chb-bench') : chColor(ch)) + '">' + esc(chName(ch)) + '</span>'; }
  // 콘텐츠 표기: [채널] 유형 · 제목
  const TYPE_SHORT = { '릴스/영상': '릴스', '1분 이하': '쇼츠', '1~3분': '1~3분', '3~10분': '3~10분', '10분 초과': '10분+', '캐러셀': '캐러셀', '이미지': '이미지', '릴스': '릴스', '스토리': '스토리' };
  const typeShort = t => TYPE_SHORT[t] || t || '';
  function line(it) { const ty = typeShort(it.t); return '<span class="ln">' + badge(it.c) + (ty ? '<span class="ty">' + esc(ty) + '</span>' : '') + '<span class="tx">' + esc(title(it.n)) + '</span></span>'; }
  const ptag = p => '<span class="tag ' + (PROD_CLASS[p] || '') + '">' + esc(p) + '</span>';
  const histTag = it => it.x ? '<span class="tag" title="엑셀로 기록하던 시기의 값(기록 당시 수치)">과거 기록</span>' : '';
  const glab = it => it.g + (it.s ? ' · ' + it.s : '');
  const adtag = it => it.ad ? '<span class="tag p-ad" title="' + esc(it.ad.s === '패턴' ? '광고 리포트 이후 영상 · 조회 패턴으로 추정' : it.ad.x && !it.ad.k.length && !it.ad.mk ? it.ad.x + ' (캠페인 정보 없음)' : it.ad.mk && !it.ad.k.length ? '메타 광고(게시물 홍보): ' + it.ad.mk.map(metaLabel).join(', ') : '구글애즈 캠페인 연결(' + it.ad.s + '): ' + it.ad.k.join(', ')) + '">광고' + (it.ad.s === '확인' ? '' : ' 추정') + '</span>' : '';

  // ───────── 필터 ─────────
  const since = () => S.range === 'all' ? '' : addDays(D.updated, -Number(S.range));
  function pool(o) {
    o = o || {};
    const f = o.since !== undefined ? o.since : since();
    const u = o.until || '9999';
    const chs = o.channels || OWN;
    return D.items.filter(it => chs.includes(it.c) && it.t !== '스토리' && (!f || it.d >= f) && it.d <= u && (o.ads || S.ads || !it.ad) && (!o.g || it.g === o.g) && (!o.gs || it.s === o.gs));
  }
  function groupBy(L, key) {
    const g = {};
    L.forEach(it => { const k = typeof key === 'function' ? key(it) : it[key]; (g[k] = g[k] || []).push(it); });
    return Object.entries(g).map(([k, arr]) => ({ k, n: arr.length, idx: median(arr.filter(it => !young(it)).map(ratio)), few: arr.length < MIN_N, v: median(arr.map(mainVal)), q: median(arr.map(quality)), hit: hitRate(arr), arr }));
  }

  // ───────── 공통 조각 ─────────
  const secOpen = (h, p, right) => '<div class="gap"></div><section class="sec"><div class="sh"><div><h2>' + h + '</h2>' + (p ? '<p>' + p + '</p>' : '') + '</div>' + (right || '') + '</div>';
  const secClose = '</section>';
  function rankRows(L, opt) {
    opt = opt || {};
    return L.map((it, i) => {
      const r = it.ad ? null : ratio(it), d = r == null ? null : r - 1;
      const yg = !it.ad && r != null && young(it);
      const right = opt.right ? opt.right(it) : '<span class="num">' + fmtK(mainVal(it)) + '</span> <em class="' + (it.ad || yg ? 'flat' : d >= 0 ? 'up' : 'down') + '"' + (yg ? ' title="게시 ' + AGE_MIN + '일 전이라 조회가 아직 쌓이는 중이에요"' : '') + '>' + (it.ad ? '광고' : r == null ? '' : yg ? '조회 모이는 중' : xf(r)) + '</em>';
      return '<li class="rk" tabindex="0" data-i="' + i + '"><span class="no">' + (i + 1) + '</span>' +
        '<span class="t"><b>' + line(it) + '</b><span>' + right + ' · ' + esc(dot(it.d)) + '</span></span>' +
        '<span class="tg"><span class="tag">' + esc(glab(it)) + '</span>' + ptag(it.p) + adtag(it) + histTag(it) + '</span></li>';
    }).join('') || '<li class="empty">조건에 맞는 콘텐츠가 없어요.</li>';
  }
  function wireRank(el, L) {
    if (!el) return;
    el.querySelectorAll('.rk').forEach(li => {
      const go = () => openDetail(L[+li.dataset.i]);
      li.addEventListener('click', go); li.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    });
  }
  // 순위 정렬: 표본 적음·계산 불가 그룹은 맨 아래
  const rankIdx = r => (r.idx == null || r.few || (r.n != null && r.n < MIN_N)) ? -Infinity : r.idx;
  const byIdx = (a, b) => { const x = rankIdx(a), y = rankIdx(b); return x === y ? (b.n || 0) - (a.n || 0) : y - x; };
  function bars(el, rows, fmtSub, onClick) {
    const box = $(el); if (!box) return;
    const mx = Math.min(4, Math.max(2, ...rows.map(r => r.idx || 0)));
    box.innerHTML = rows.map(r => {
      const na = r.idx == null, few = na || r.few || (r.n != null && r.n < MIN_N);
      const d = na ? 0 : r.idx - 1, col = few ? css('--line') : d >= 0 ? css('--up') : css('--down');

  const CH_ALIAS = { '인스타': '인스타그램', '인스타그램': '인스타그램', 'instagram': '인스타그램', '유튜브': '유튜브', 'youtube': '유튜브', 'hong': 'hong._.video', '홍비디오': 'hong._.video', 'hong._.video': 'hong._.video' };

  // 1) 처방 카드
  function prescribe(chs) {

    const hbCh = {}; chs.forEach(c => { hbCh[c] = hitRate(L.filter(it => it.c === c)) || 0; });

    combos.forEach(r => { const p = r.k.split('|'); r.c = p[0]; r.g = p[1]; r.t = p[2]; r.recent = r.arr.filter(it => it.d >= s60).length; r.exp = r.n * 60 / 365; r.hb = hbCh[r.c]; });
    const more = combos.filter(r => r.idx >= 1.25 && (r.hit || 0) >= r.hb && r.recent <= Math.max(1, Math.floor(r.exp))).sort((a, b) => b.idx * (0.5 + (b.hit || 0)) - a.idx * (0.5 + (a.hit || 0))).slice(0, 3);
    const less = combos.filter(r => r.idx <= 0.8 && r.recent >= Math.max(3, Math.ceil(r.exp * 1.2))).sort((a, b) => a.idx - b.idx).slice(0, 2);
    less.forEach(r => { r.alt = combos.filter(x => x.c === r.c && x.g === r.g && x.t !== r.t && x.n >= MIN_N && x.idx > Math.max(1, r.idx * 1.3)).sort((a, b) => b.idx - a.idx)[0] || null; });

  function rulesFor(ch) {

    const out = [];

      const L1 = pool({ channels: [ch], since: addDays(D.updated, -365) });
      const byT = groupBy(L1, 't');
      // 인스타는 형식 비교를 도달로 한다(캐러셀 조회는 슬라이드 넘김 중복 집계)
      const igR = ch === '인스타그램', rBase = igR ? median(L1.filter(it => it.r > 0).map(it => it.r)) : null;
      const types = [...new Set(L6.map(it => it.t))];
      const rows = types.map(t => {
        const per = L6.filter(it => it.t === t).length / 6;
        const r = byT.find(x => x.k === t);
        const rr = igR && r ? r.arr.filter(it => it.r > 0).map(it => it.r) : null;
        const idx = igR ? (rr && rr.length >= 5 && rBase ? median(rr) / rBase : null) : (r && r.n >= 5 ? r.idx : null);
        const basis = igR ? '도달 기준 평소의 ' : '평소의 ';
        let rec = Math.round(per);
        let why = '최근 6달 월평균 유지' + (r && r.n < 5 ? ' (게시물이 적어 참고용)' : '');
        if (idx != null && idx >= 1.2) { rec = Math.max(rec + 1, Math.round(per * 1.3)); why = basis + xf(idx) + ' · 늘리기'; }
        else if (idx != null && idx <= 0.8 && rec > 0) { rec = Math.max(0, Math.min(rec - 1, Math.round(per * 0.7))); why = basis + xf(idx) + ' · 줄이기'; }
        return { t, per, rec, why, idx };
      }).filter(r => r.per >= 0.3 || r.rec > 0).sort((a, b) => b.rec - a.rec);
      const past = D.items.filter(it => it.c === ch && it.t !== '스토리' && !it.ad && it.d.slice(5, 7) === mm && it.d.slice(0, 4) < ny && ratio(it) != null);
      const topics = groupBy(past, 'g').filter(r => r.n >= MIN_N && r.idx >= 1.1).sort(byIdx).slice(0, 4);
      const yrs = [...new Set(past.map(it => it.d.slice(0, 4)))].sort();
      const best = past.slice().sort((a, b) => ratio(b) - ratio(a)).slice(0, 3);
      return { ch, nm, rows, topics, yrs, best };
    });
  }
  function planHtml(P) {
    if (!P.length) return '';
    const m = +P[0].nm.slice(5, 7);
    return '<div class="pls">' + P.map(p => '<div class="pl"><div class="rl-h">' + badge(p.ch) + '<small>' + m + '월 권장 · 합계 ' + sum(p.rows.map(r => r.rec)) + '개</small></div>' +
      '<table class="tbl compact"><thead><tr><th>형식</th><th class="n">최근 월평균</th><th class="n">권장</th><th>근거</th></tr></thead><tbody>' +
      p.rows.map(r => '<tr><td>' + esc(fmtType(r.t)) + '</td><td class="n">' + r.per.toFixed(1) + '</td><td class="n"><b>' + r.rec + '</b></td><td class="' + (r.idx == null ? '' : r.idx >= 1.2 ? 'hi' : r.idx <= 0.8 ? 'lo' : '') + '">' + esc(r.why) + '</td></tr>').join('') + '</tbody></table>' +
      (p.topics.length ? '<div class="pl-t"><b>지난 ' + m + '월에 잘 된 주제</b> <small>(' + p.yrs.join('·') + '년)</small><div class="chips">' + p.topics.map(t => '<span class="chip" aria-pressed="true">' + esc(t.k) + ' ' + xf(t.idx) + '</span>').join('') + '</div></div>' : '<p class="note">' + (p.yrs.length ? '지난 ' + m + '월(' + p.yrs.join('·') + '년)에는 평소보다 뚜렷하게 잘 된 주제가 없었어요.' : '지난 ' + m + '월 데이터가 없어요.') + '</p>') +
      (p.best.length ? '<p class="note">참고: ' + p.best.map(it => esc(title(it.n)) + ' (' + dot(it.d) + ', ' + xf(ratio(it)) + ')').join(' · ') + '</p>' : '') + '</div>').join('') + '</div>' +
      '<div style="margin-top:12px"><button type="button" class="btn" id="planCopy">회의용으로 복사</button> <span class="hint">권장 수량·주제를 글로 복사해요</span></div>';
  }
  function planText(P) {

      (p.topics.length ? '\n- 지난 ' + m + '월 잘 된 주제: ' + p.topics.map(t => t.k + '(' + xf(t.idx) + ')').join(', ') : '')).join('\n\n');
  }

  // 4) 실행 기록 (스냅샷 시트 「전략 기록」)
  function scoreStrat(s) {
    const c = chKey(s.ch);
    const chs = c ? [c] : OWN;
    const to = s.to && s.to >= s.from ? s.to : D.updated;
    const match = it => chs.includes(it.c) && it.t !== '스토리' && !it.ad && (!s.g || String(it.g).includes(s.g)) && (!s.t || typeShort(it.t) === s.t || it.t === s.t || fmtType(it.t) === s.t) && (!s.kw || String(it.n || '').toLowerCase().includes(String(s.kw).toLowerCase()));
    const L = D.items.filter(it => match(it) && it.d >= s.from && it.d <= to);
    const len = Math.max(14, daysBetween(s.from, to));
    const B = D.items.filter(it => match(it) && it.d >= addDays(s.from, -len) && it.d < s.from);
    const m = median(L.map(ratio)), mb = median(B.map(ratio));
    const running = to >= D.updated && (!s.to || s.to >= D.updated);
    let v = ['info', '데이터 대기'];
    if (L.length >= 3 && m != null) v = m >= 1.2 && (mb == null || m >= mb * 1.1) ? ['good', '효과 있음'] : m <= 0.9 ? ['bad', '효과 약함'] : ['info', '보통'];
    else if (L.length) v = ['info', '게시 ' + L.length + '개 · 판단 보류'];
    return { L, B, m, mb, hit: hitRate(L), v, running, chs };
  }
  function stratHtml() {
    const ST = (D.strat || []).filter(s => s.from && s.what);
    if (!ST.length) return '<div class="wait"><b>시도한 전략의 효과를 자동으로 채점해요.</b><br>스냅샷 시트 <b>「전략 기록」</b> 탭에 시작일 · 종료일 · 채널 · 분류 · 형식 · 제목 키워드 · 시도 내용을 한 줄씩 적으면, 해당 기간 게시물이 평소보다 얼마나 나왔는지와 직전 같은 기간 대비를 여기서 보여줘요.<br><small class="hint">예) 2026-10-14 · 2026-11-30 · 인스타 · 학과 소개 · 릴스 · (비움) · 학과 소개를 릴스로 주 1회</small></div>';
    const rows = ST.slice().sort((a, b) => a.from < b.from ? 1 : -1).map((s, i) => {
      const r = scoreStrat(s);
      return '<tr class="click" data-si="' + i + '"><td class="w"><b>' + esc(s.what) + '</b><br><small class="hint">' + [s.ch ? chName(chKey(s.ch) || s.ch) : '전체', s.g, s.t, s.kw ? '“' + s.kw + '”' : ''].filter(Boolean).map(esc).join(' · ') + '</small></td><td>' + dot(s.from) + ' ~ ' + (s.to ? dot(s.to) : '') + (r.running ? ' <span class="tag p-own">진행 중</span>' : '') + '</td><td class="n">' + r.L.length + '</td><td class="n"><b>' + xf(r.m) + '</b></td><td class="n">' + xf(r.mb) + '</td><td class="n">' + pct0(r.hit) + '</td><td><span class="tag ' + (r.v[0] === 'good' ? 'p-own' : r.v[0] === 'bad' ? 'p-ad' : '') + '">' + esc(r.v[1]) + '</span></td></tr>';
    });
    return '<div class="tw"><table class="tbl" id="stTbl"><thead><tr><th>시도</th><th>기간</th><th class="n">게시</th><th class="n">평소 대비</th><th class="n">직전 같은 기간</th><th class="n">잘 된 비율</th><th>판정</th></tr></thead><tbody>' + rows.join('') + '</tbody></table></div><p class="note">조건(채널·분류·형식·키워드)에 맞는 게시물만 모아 평소 대비(중간값)를 봐요 · 3개 이상 쌓이면 판정해요 · 줄을 누르면 해당 게시물이 나와요</p><div id="stList"></div>';
  }

  // 5) 이번 달 목표 (스냅샷 시트 「채널 목표」)
  const GOAL_M = { '게시 수': 'n', '게시물': 'n', '조회수': 'views', '조회': 'views', '히트율': 'hit', '잘 된 비율': 'hit', '평균 조회': 'avg', '팔로워 순증': 'fol', '구독 순증': 'fol', '팔로워': 'fol' };
  function goalActual(ch, metric, ym) {
    const L = D.items.filter(it => it.c === ch && it.t !== '스토리' && it.d.slice(0, 7) === ym && (S.ads || !it.ad));
    if (metric === 'n') return L.length;
    if (metric === 'views') return sum(L.map(it => val(it, 0)));
    if (metric === 'avg') return L.length ? sum(L.map(it => val(it, 0))) / L.length : null;
    if (metric === 'hit') { const h = hitRate(L); return h == null ? null : h * 100; }
    if (metric === 'fol') {
      const a = (D.acct || []).filter(x => x.ch === ch).sort((x, y) => x.d < y.d ? -1 : 1);
      if (ch === '유튜브') return sum(a.filter(x => x.d.slice(0, 7) === ym).map(x => (x.m['Gained subscribers'] || 0) - (x.m['Lost subscribers'] || 0)));
      const inM = a.filter(x => x.d.slice(0, 7) === ym && x.m['Profile followers'] != null), before = a.filter(x => x.d.slice(0, 7) < ym && x.m['Profile followers'] != null).pop();
      const first = before || inM[0], lastA = inM[inM.length - 1];
      return first && lastA && first !== lastA ? lastA.m['Profile followers'] - first.m['Profile followers'] : null;
    }
    return null;
  }
  function goalsHtml() {
    const ym = D.updated.slice(0, 7);
    const G = (D.goals || []).filter(g => g.target != null && chKey(g.ch) && GOAL_M[g.metric] && (!g.ym || g.ym === ym));
    if (!G.length) return '';
    const dim = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 0)).getUTCDate(), day = +D.updated.slice(8, 10);
    const pace = day / dim;
    return '<div class="gls">' + G.map(g => {
      const c = chKey(g.ch), mk = GOAL_M[g.metric], a = goalActual(c, mk, ym);
      const r = a == null ? null : a / g.target;
      const paced = ['n', 'views', 'fol'].includes(mk);
      const ok = r == null ? null : paced ? r >= pace * 0.95 : r >= 0.95;
      const f = mk === 'hit' ? (v => v == null ? '–' : Math.round(v) + '%') : mk === 'views' || mk === 'avg' ? fmtK : fmt;
      return '<div class="gl"><div class="gl-h">' + badge(c) + esc(g.metric) + '</div><div class="gl-v"><b>' + f(a) + '</b> / ' + f(g.target) + '</div><div class="pbar wide"><i style="width:' + Math.min(100, (r || 0) * 100) + '%;background:' + (ok == null ? 'var(--muted)' : ok ? 'var(--jj)' : 'var(--coral)') + '"></i>' + (paced ? '<em style="left:' + (pace * 100) + '%"></em>' : '') + '</div><small class="' + (ok ? 'up' : 'down') + '">' + (r == null ? '데이터 없음' : pct0(r) + (paced ? ' · 오늘까지 기대 ' + pct0(pace) : '') + (ok ? ' · 순조로워요' : ' · 속도를 올려야 해요')) + '</small>' + (g.memo ? '<small class="hint">' + esc(g.memo) + '</small>' : '') + '</div>';
    }).join('') + '</div><p class="note">' + (+ym.slice(5, 7)) + '월 · ' + day + '일 기록 기준 · 목표는 스냅샷 시트 「채널 목표」 탭에서 바꿀 수 있어요 · 조회는 이번 달 올린 게시물의 현재 누적이에요</p>';
  }

  // 6) 롱테일 — 오래된 게시물이 최근에 얼마나 컸나
  function longtail(ch) {
    const ri = D.dates.map((d, i) => i).filter(i => hasRec(ch, i));
    if (ri.length < 2) return null;
    const iL = ri[ri.length - 1];
    const i0 = ri.find(i => D.dates[i] >= addDays(D.updated, -200));
    if (i0 == null || i0 === iL) return null;
    const its = D.items.filter(it => it.c === ch && it.t !== '스토리' && (S.ads || !it.ad) && it.h[iL] && it.h[i0] && it.h[iL][0] != null && it.h[i0][0] != null);
    const g = new Map(its.map(it => [it, Math.max(0, it.h[iL][0] - it.h[i0][0])]));
    const tot = sum([...g.values()]);
    const old = its.filter(it => daysBetween(it.d, D.dates[i0]) > 365);
    const oldSum = sum(old.map(it => g.get(it)));
    const top = old.filter(it => g.get(it) > 0).sort((a, b) => g.get(b) - g.get(a)).slice(0, 10);
    return { ch, from: D.dates[i0], to: D.dates[iL], days: daysBetween(D.dates[i0], D.dates[iL]), tot, oldSum, n: old.length, top, g };
  }
  function longtailHtml(chs) {
    const R = ownIn(chs).map(longtail).filter(r => r && r.top.length);
    if (!R.length) return '<div class="wait">기록이 2회 이상 쌓인 채널이 없어요.</div>';
    return R.map(r => '<div class="lt"><div class="rl-h">' + badge(r.ch) + '<small>' + dot(r.from) + ' → ' + dot(r.to) + ' (' + r.days + '일)</small></div>' +
      '<p class="lt-s">이 기간 늘어난 조회 <b>' + fmtK(r.tot) + '</b> 중 <b>' + pct0(r.tot ? r.oldSum / r.tot : null) + '</b>가 게시 1년이 넘은 콘텐츠에서 나왔어요.</p>' +
      '<ol class="rank" id="lt_' + esc(r.ch).replace(/\W/g, '') + '">' + rankRows(r.top, { right: it => '<span class="num">+' + fmtK(r.g.get(it)) + '</span> 늘어남' }) + '</ol></div>').join('') +
      '<p class="note">오래돼도 계속 보이는 콘텐츠는 검색·추천으로 소비되는 중이에요. 설명란·고정 댓글에 최신 링크(입학처·최근 영상)를 달고, 같은 주제의 새 버전을 만들 후보예요.</p>';
  }

  // 7) 수명 곡선 — 게시 후 1달·3달·6달에 현재 누적의 몇 %까지 왔나
  const LIFE_AGES = [[30, '1달'], [90, '3달'], [180, '6달']];
  const lifeGroup = it => it.c === '유튜브' ? (it.t === '1분 이하' ? '쇼츠' : '긴 영상') : typeShort(it.t) === '릴스' ? '릴스' : typeShort(it.t) || '기타';
  function lifeCurve(chs) {
    const G = {};
    D.items.filter(it => chs.includes(it.c) && it.t !== '스토리' && !it.ad).forEach(it => {
      const pts = [[0, 0]];
      it.h.forEach((x, i) => { if (x && x[0] != null) { const a = daysBetween(it.d, D.dates[i]); if (a >= 0) pts.push([a, x[0]]); } });
      if (pts.length < 3) return;
      const fin = pts[pts.length - 1];
      if (!(fin[1] > 0)) return;
      const key = (chs.length > 1 ? chName(it.c) + ' ' : '') + lifeGroup(it);
      LIFE_AGES.forEach(([A], j) => {
        if (fin[0] < A * 1.3) return;
        const near = pts.some(p => p[0] > 0 && p[0] >= A * 0.5 && p[0] <= A * 1.6);
        if (!near) return;
        let k = pts.findIndex(p => p[0] >= A); if (k < 1) return;
        const [a0, v0] = pts[k - 1], [a1, v1] = pts[k];
        const v = a1 === a0 ? v1 : v0 + (v1 - v0) * (A - a0) / (a1 - a0);
        ((G[key] = G[key] || [[], [], []])[j]).push(Math.min(1, Math.max(0, v / fin[1])));
      });
    });
    return Object.entries(G).map(([k, arr]) => ({ k, med: arr.map(a => a.length >= 4 ? median(a) : null), n: arr.map(a => a.length) })).filter(r => r.med.some(x => x != null));
  }

  function viewStrategy() {
    const chs = viewChannels(), ch = chs.length === 1 ? chs[0] : null, L = pool({ channels: chs });
    const types = Object.entries(L.reduce((o, it) => { o[it.t] = (o[it.t] || 0) + 1; return o; }, {})).sort((a, b) => b[1] - a[1]).map(x => x[0]);
    const order = ['릴스', '캐러셀', '이미지', '1분 이하', '1~3분', '3~10분', '10분 초과', '릴스/영상'];
    types.sort((a, b) => order.indexOf(a) - order.indexOf(b));
    const MXB = S.mxBy === 'p' ? 'p' : 'g'; // 개편 1단계: 형식 × 분류 / 형식 × 제작
    const cats = groupBy(L, MXB).sort((a, b) => b.n - a.n);
    const hb = hitRate(L);
    const cell = arr => {
      if (!arr.length) return { cls: 'none', html: '·' };
      const hr = hitRate(arr);
      if (arr.length < MIN_N) return { cls: 'few', html: '<b>' + pct0(hr) + '</b><small>' + arr.length + '개</small>' };
      const a = Math.min(1, (hr || 0) / 0.6);
      const bg = 'rgba(0,120,173,' + (0.08 + a * 0.82).toFixed(2) + ')';
      return { cls: '', style: 'background:' + bg + ';color:' + (a > 0.45 ? '#fff' : 'var(--fg)'), html: '<b>' + pct0(hr) + '</b><small>' + arr.length + '개</small>' };
    };
    let mx = '<div class="tw"><table class="mx"><thead><tr><th class="r">' + (MXB === 'p' ? '제작' : '분류') + '</th>' + types.map(t => '<th>' + esc(fmtType(t)) + '</th>').join('') + '<th>전체</th></tr></thead><tbody>';
    cats.forEach(r => {
      mx += '<tr><th class="r">' + esc(r.k) + '</th>' + types.map(t => { const arr = r.arr.filter(it => it.t === t); const c = cell(arr); const key = r.k + '|' + t; return '<td class="' + c.cls + (S.mx === key ? ' sel' : '') + '" data-k="' + esc(key) + '" style="' + (c.style || '') + '">' + c.html + '</td>'; }).join('') +
        '<td class="tot"><b>' + pct0(r.hit) + '</b><small>' + r.n + '개</small></td></tr>';
    });
    mx += '<tr><th class="r">전체</th>' + types.map(t => { const arr = L.filter(it => it.t === t); return '<td class="tot"><b>' + pct0(hitRate(arr)) + '</b><small>' + arr.length + '개</small></td>'; }).join('') + '<td class="tot"><b>' + pct0(hb) + '</b><small>' + L.length + '개</small></td></tr></tbody></table></div>' +
      '<div class="mxleg"><span><i style="background:rgba(0,120,173,.9)"></i>잘 된 비율 높음</span><span><i style="background:rgba(0,120,173,.15)"></i>낮음</span><span><i style="background:var(--tile)"></i>게시물 ' + MIN_N + '개 미만(참고용)</span><span>칸을 누르면 해당 콘텐츠가 아래에 나와요</span></div>';
    let sel = '';
    if (S.mx) {
      const [g, t] = S.mx.split('|');
      const arr = L.filter(it => it[MXB] === g && it.t === t).sort((a, b) => (ratio(b) || 0) - (ratio(a) || 0));
      sel = '<div style="margin-top:16px"><h3 class="sub">' + esc(g) + ' × ' + esc(fmtType(t)) + ' — ' + arr.length + '개</h3><ol class="rank" id="mxList">' + rankRows(arr.slice(0, 20)) + '</ol></div>';
    }
    const own = ownIn(chs).length > 0;
    const RX = own ? prescribe(ownIn(chs)) : null, PLAN = own ? nextPlan(chs) : null;
    let top = '';

  // ═════════ 4. 입시 시즌 ═════════
  function seasons() {
    const ds = D.items.map(it => it.d).sort();
    const y0 = +ds[0].slice(0, 4), y1 = +D.updated.slice(0, 4);
    const out = [];
    for (let y = Math.max(y0, y1 - 3); y <= y1; y++) {
      out.push({ id: y + '수시', label: (y + 1) + '학년도 수시 (' + y + '.8~9월)', from: y + '-08-01', to: y + '-09-30' });
      out.push({ id: y + '정시', label: (y + 1) + '학년도 정시 (' + y + '.12~' + (y + 1) + '.1월)', from: y + '-12-01', to: (y + 1) + '-01-31' });
    }
    return out.filter(s => s.from <= D.updated && s.to >= ds[0]).reverse();
  }
  function seasonStats(s) {
    const L = pool({ channels: viewChannels(), since: s.from, until: s.to, ads: true });
    const org = L.filter(it => !it.ad), ad = L.filter(it => !!it.ad);
    const adm = org.filter(it => it.g === '입시·모집');
    const rws = (D.ads && D.ads.rows) || [];
    const daily = (D.ads && D.ads.daily) || [];
    const cost = rws.length ? sum(rws.filter(x => x[1] >= s.from && x[1] <= s.to).map(x => x[2])) : sum(daily.filter(x => x[0] >= s.from && x[0] <= s.to).map(x => x[1]));
    const covered = D.ads && D.ads.end >= s.from;
    const camps = ((D.ads && D.ads.camps) || []).filter(c => c.from <= s.to && c.to >= s.from);
    return { L, org, ad, adm, cost, covered, camps, orgV: sum(org.map(it => val(it, 0))), adV: sum(ad.map(it => val(it, 0))), idx: median(org.map(ratio)), hit: hitRate(org), admIdx: median(adm.map(ratio)) };
  }
  function viewSeason() {

      '<div class="kpis">' +
      '<div class="kpi"><div class="l">시즌 게시물</div><div class="v">' + st.org.length + '<small style="font-size:var(--fs-lg);color:var(--muted);font-weight:700">개</small></div><div class="s">입시·모집 콘텐츠 <b>' + st.adm.length + '개</b>' + (st.admIdx == null ? '' : ' · 평소의 ' + xf(st.admIdx)) + '</div></div>' +
      '<div class="kpi"><div class="l">자연 조회 (광고 제외)</div><div class="v">' + fmtK(st.orgV) + '</div><div class="s">게시물당 평소의 <b>' + xf(st.idx) + '</b> · 잘 된 비율 ' + pct0(st.hit) + '</div></div>' +
      '<div class="kpi"><div class="l">광고 (구글애즈 계정 전체)</div><div class="v">' + (st.covered ? fmtK(st.cost) + '<small style="font-size:var(--fs-lg);color:var(--muted);font-weight:700">원</small>' : '–') + '</div><div class="s">' + (st.covered ? '캠페인 ' + st.camps.length + '개 · ' + (st.ad.length ? '광고 영상 <b>' + st.ad.length + '개</b> 조회 ' + fmtK(st.adV) : '연결된 광고 영상 없음') + (st.adV ? ' · 조회 1회당 <b>' + fmt(st.cost / st.adV) + '원</b>' : '') : '광고 리포트가 ' + dot(D.ads ? D.ads.end : '') + '까지라 이 시즌 광고비는 아직 없어요 · 광고 영상 ' + st.ad.length + '개(조회 패턴 추정) 조회 ' + fmtK(st.adV)) + '</div></div>' +
      '</div></section>';
    html += secOpen('주별 게시 콘텐츠 조회', '주마다 올린 콘텐츠의 현재 누적 조회 · 광고 영상과 나머지를 나눠 보여줘요') + '<div class="chart tall"><canvas id="seaChart"></canvas></div>' + secClose;
    const admSorted = st.adm.slice().sort((a, b) => (ratio(b) || 0) - (ratio(a) || 0));
    const topSorted = st.org.slice().sort((a, b) => (ratio(b) || 0) - (ratio(a) || 0)).slice(0, 8);

      '<div><h3>시즌 중 가장 잘 된 콘텐츠</h3><p class="d">분류와 관계없이 · 광고 제외</p><ol class="rank" id="sTop">' + rankRows(topSorted) + '</ol></div></div>' + secClose;
    // 시즌 비교
    html += secOpen('시즌별 비교', '최근 시즌은 조회가 쌓인 기간이 짧아 적게 보일 수 있어요') +
      '<div class="tw"><table class="tbl"><thead><tr><th>시즌</th><th class="n">게시</th><th class="n">입시 콘텐츠</th><th class="n">자연 조회</th><th class="n">광고 조회</th><th class="n">광고비</th><th class="n">게시물당 평소 대비</th><th class="n">잘 된 비율</th></tr></thead><tbody>' +
      ss.map(x => { const t = seasonStats(x); const cn = covNote(viewChannels(), x.from); return '<tr class="click' + (x.id === s.id ? ' on' : '') + '" data-s="' + x.id + '"><td>' + esc(x.label) + (cn ? ' <span class="tag p-ad" title="' + esc(cn) + '">일부</span>' : '') + '</td><td class="n">' + t.org.length + '</td><td class="n">' + t.adm.length + '</td><td class="n">' + fmtK(t.orgV) + '</td><td class="n">' + fmtK(t.adV) + '</td><td class="n">' + (t.covered ? fmtK(t.cost) : '–') + '</td><td class="n">' + xf(t.idx) + '</td><td class="n">' + pct0(t.hit) + '</td></tr>'; }).join('') +
      '</tbody></table></div><p class="note">「일부」는 원본 수집 범위 밖 기간이 섞인 시즌이에요(유튜브는 ' + dot(covFrom('유튜브') || '') + ' 이후 조회만, 인스타는 ' + dot(covFrom('인스타그램') || '') + ' 이후 게시물만) · 광고비 = 구글애즈 리포트의 그 기간 집행 비용(동영상·디스플레이 전체, ' + dot(D.ads ? D.ads.end : '') + '까지) · 광고 조회 = 캠페인에 연결된 유튜브 영상의 조회</p>' + secClose;
    $('view').innerHTML = html;
    $('seasonSel').addEventListener('change', e => { S.season = e.target.value; viewSeason(); });
    $('view').querySelectorAll('tr[data-s]').forEach(tr => tr.addEventListener('click', () => { S.season = tr.dataset.s; viewSeason(); window.scrollTo({ top: 0 }); }));
    wireRank($('sAdm'), admSorted); wireRank($('sTop'), topSorted);
    // 주별 차트
    const weeks = []; let w = s.from; while (w <= s.to) { weeks.push(w); w = addDays(w, 7); }
    const wk = d => weeks.filter(x => x <= d).pop();

    const ad = weeks.map(x => sum(st.ad.filter(it => wk(it.d) === x).map(it => val(it, 0))));
    const cnt = weeks.map(x => st.org.filter(it => wk(it.d) === x).length);

  // ═════════ 광고 (구글애즈) ═════════
  // D.ads: { end, camps:[{n,from,to,imp,cost,clk,videos,conf}], rows:[[캠페인번호, 날짜, 비용, 노출, 클릭]], plans:[{n,from,to,budget,goal,videos,memo}] }
  const vidOf = u => { const m = /(?:v=|youtu\.be\/|shorts\/)([\w-]{11})/.exec(u || ''); return m ? m[1] : ''; };
  function adRows() {
    const A = D.ads || {};
    if (A.rows && A.rows.length) return A.rows;
    return [];
  }
  function adVideosOf(c) {
    // 캠페인에 연결된 영상(대시보드 콘텐츠)
    return D.items.filter(it => it.ad && it.ad.k && it.ad.k.includes(c.n));
  }
  function adStats(camps, from, to) {

    const set = new Set(camps.map(c => idx[c.n]));
    let cost = 0, imp = 0, clk = 0;
    if (rows.length) rows.forEach(r => { if (set.has(r[0]) && r[1] >= from && r[1] <= to) { cost += r[2]; imp += r[3]; clk += r[4]; } });
    else camps.forEach(c => { cost += c.cost; imp += c.imp; clk += c.clk; });
    return { cost, imp, clk, ctr: imp ? clk / imp : null, cpm: imp ? cost / imp * 1000 : null, cpc: clk ? cost / clk : null };
  }
  const won = v => v == null || isNaN(v) ? '–' : fmtK(v) + '원';
  const wonF = v => v == null || isNaN(v) ? '–' : fmt(v) + '원';
  const wonL = v => { if (v == null || isNaN(v)) return '–'; const e = Math.floor(v / 1e8), m = Math.round((v % 1e8) / 1e4); return e ? e + '억' + (m ? ' ' + fmt(m) + '만' : '') + '원' : fmt(m) + '만원'; };
  function viewAds() {

  }

  const META_RT = { post_engagement: '게시물 참여', link_click: '링크 클릭', visit_instagram_profile: '프로필 방문', video_view: '영상 조회', landing_page_view: '랜딩 페이지 조회', reach: '도달' };

  function heat(d) {
    const up = [[120, 182, 214], [52, 148, 196], [0, 120, 173], [0, 84, 148]];
    const dn = [[206, 184, 120], [190, 162, 88], [170, 138, 58], [140, 110, 36]];

  }
  function squarify(nodes, x, y, w, h) {
    const total = nodes.reduce((s, n) => s + n.w, 0), scale = (w * h) / total;
    const items = nodes.map(n => ({ it: n.it, a: n.w * scale }));
    const out = []; let rect = { x, y, w, h }, row = [];
    const worst = (r, side) => { const s = r.reduce((t, n) => t + n.a, 0); const mx = Math.max(...r.map(n => n.a)), mn = Math.min(...r.map(n => n.a)); return Math.max(side * side * mx / (s * s), (s * s) / (side * side * mn)); };
    const layout = r => {
      const s = r.reduce((t, n) => t + n.a, 0);
      if (rect.w >= rect.h) { const cw = s / rect.h; let cy = rect.y; r.forEach(n => { const ch = n.a / cw; out.push({ it: n.it, x: Math.round(rect.x), y: Math.round(cy), w: Math.round(cw), h: Math.round(ch) }); cy += ch; }); rect = { x: rect.x + cw, y: rect.y, w: rect.w - cw, h: rect.h }; }
      else { const ch = s / rect.w; let cx = rect.x; r.forEach(n => { const cw = n.a / ch; out.push({ it: n.it, x: Math.round(cx), y: Math.round(rect.y), w: Math.round(cw), h: Math.round(ch) }); cx += cw; }); rect = { x: rect.x, y: rect.y + ch, w: rect.w, h: rect.h - ch }; }
    };
    items.forEach(n => { const side = Math.min(rect.w, rect.h); if (!row.length || worst(row.concat(n), side) <= worst(row, side)) row.push(n); else { layout(row); row = [n]; } });
    if (row.length) layout(row);
    return out;
  }

  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (S.view === 'explore') renderTrend(); }, 150); });

  // 채널별 기록 여부 · 메타 광고(인스타 게시물 홍보) 연결
  const hasRec = (c, i) => !!(D.rec && D.rec[c] && D.rec[c][i]);
  // 광고 캠페인이 일별 리포트가 아니라 「광고 추가 입력」의 합계에서 온 것이면 표시
  const manTag = c => c && c.manual ? ' <span class="tag p-col" title="' + esc(c.manual) + '">합계 입력</span>' : '';
  // 마지막 기록이 원본 미갱신이면 그 구간 증가분은 0이 아니라 '셀 수 없음'
  const staleAt = (c, i) => i === D.dates.length - 1 && !!(D.stale && D.stale[c]);
  function staleHtml(chs) {
    const s = chs.filter(c => D.stale && D.stale[c]), a = chs.filter(c => D.acctStale && D.acctStale[c]);
    if (!s.length && !a.length) return '';
    const d = (D.stale[s[0]] || D.acctStale[a[0]]);
    return '<div class="callout warn">원본 데이터가 갱신되지 않은 채널이 있어요: ' +
      (s.length ? '<b>' + s.map(chName).join(' · ') + '</b> 게시물 값' : '') + (s.length && a.length ? ', ' : '') + (a.length ? '<b>' + a.map(chName).join(' · ') + '</b> 계정 지표' : '') +
      '<small>' + mdLabel(d.d0) + ' → ' + mdLabel(d.d1) + ' 두 기록의 값이 모두 같아요. 이 기간 증가는 0이 아니라 셀 수 없어서 합계에서 뺐어요. Supermetrics 예약 갱신을 확인해 주세요.</small></div>';
  }
  const nz = x => String(x || '').replace(/(\.\.\.|…)\s*$/, '').replace(/[\s⠀.]+/g, '');
  const metaLabel = n => { const m = /^(?:Instagram (?:게시물|post)|게시물):\s*"?([\s\S]*?)"?$/i.exec(n || ''); return (m ? m[1] : n || '').split('\n')[0].replace(/(\.\.\.|…)$/, '').trim() || n; };
  function prep() {
    if (D.items.some(it => it.L)) { D.coverage = D.coverage || {}; D.coverage['유튜브'] = '2012-01-01'; }
    const igMin = D.items.filter(it => it.c === '인스타그램').map(it => it.d).sort()[0];
    if (igMin && D.coverage && D.coverage['인스타그램'] && igMin < D.coverage['인스타그램']) D.coverage['인스타그램'] = igMin.slice(0, 7) + '-01';
    // 제목을 잘라 저장하면서 반쪽 난 이모지(짝 없는 서로게이트)와 대체 문자 정리
    D.items.forEach(it => { if (typeof it.n === 'string') it.n = it.n.replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]|\uFFFD/g, ''); });
    D.rec = {};
    D.items.forEach(it => { const r = D.rec[it.c] = D.rec[it.c] || D.dates.map(() => false); it.h.forEach((x, i) => { if (x) r[i] = true; }); });
    // 원본 미갱신 감지: 최근 두 기록에 모두 있는 게시물(5개 이상)의 조회·좋아요가 하나도 안 바뀌었으면 원본이 갱신되지 않은 것
    D.stale = {};
    const ni = D.dates.length - 1;
    if (ni >= 1) Object.keys(D.rec).forEach(c => {
      if (!hasRec(c, ni) || !hasRec(c, ni - 1)) return;
      const both = D.items.filter(it => it.c === c && it.h[ni] && it.h[ni - 1]);
      const changed = both.filter(it => it.h[ni][0] !== it.h[ni - 1][0] || it.h[ni][1] !== it.h[ni - 1][1]).length;
      if (both.length >= 5 && !changed) D.stale[c] = { n: both.length, d0: D.dates[ni - 1], d1: D.dates[ni] };
    });
    // 서버가 기록 때 계산한 원본 갱신 정보(fresh: {채널: {changed, total, latest, prev, d}})가 있으면 그것을 우선
    if (D.fresh && typeof D.fresh === 'object') Object.entries(D.fresh).forEach(([c, f]) => {
      if (!f || f.total == null) return;
      if (f.prev && D.dates.indexOf(f.prev) < 0) return; // 비교 상대가 지워진 임시 기록(화~일)이면 남아 있는 직전 기록과 직접 비교한 결과를 씀
      if (f.total >= 5 && !f.changed) D.stale[c] = { n: f.total, d0: f.prev || D.dates[ni - 1], d1: f.d || D.dates[ni] };
      else delete D.stale[c];
    });
    D.acctStale = {};
    const byCh = {};
    (D.acct || []).forEach(x => (byCh[x.ch] = byCh[x.ch] || []).push(x));
    Object.entries(byCh).forEach(([c, a]) => { a.sort((x, y) => x.d < y.d ? -1 : 1); const p = a[a.length - 2], q = a[a.length - 1]; if (p && q && p.d !== q.d && JSON.stringify(p.m) === JSON.stringify(q.m)) D.acctStale[c] = { d0: p.d, d1: q.d }; });
    const M = (D.ads && D.ads.meta) || [];
    const ig = D.items.filter(it => it.c === '인스타그램').map(it => [it, nz(it.n)]);
    M.forEach(c => {
      c.posts = [];
      // 메타 내보내기 이름: 「Instagram 게시물: 캡션…」 · 「Instagram post: 캡션…」 · 「게시물: "캡션"」
      const m = /^(?:Instagram (?:게시물|post)|게시물):\s*"?([\s\S]*?)"?$/i.exec(c.n || ''); if (!m) return;
      const key = nz(m[1]).slice(0, 30); if (key.length < 8) return;
      const end = /^\d{4}-\d{2}-\d{2}$/.test(c.end) ? c.end : '9999-12-31';
      const hits = ig.filter(([it, n]) => n.length >= 8 && it.d <= end && n.startsWith(key.slice(0, Math.min(key.length, n.length)))).map(x => x[0]);
      // 캡션 앞부분이 같은 시리즈 게시물이면 캠페인 종료일 직전에 올린 게시물 하나만
      const pick = hits.length > 1 ? [hits.sort((a, b) => a.d < b.d ? 1 : -1)[0]] : hits;
      pick.forEach(it => {
        c.posts.push(it);
        it.ad = it.ad || { s: '확인', k: [] };
        it.ad.mk = it.ad.mk || [];
        if (!it.ad.mk.includes(c.n)) it.ad.mk.push(c.n);
      });
    });
    // 서버가 「광고 매핑」 탭으로 붙인 메타 캠페인(트래픽 광고 등)도 캠페인별 게시물에 넣음
    D.items.forEach(it => { if (it.ad && it.ad.mk) it.ad.mk.forEach(n => M.filter(c => c.n === n).forEach(c => { if (!c.posts.includes(it)) c.posts.push(it); })); });
  }
  function boot(data) {
    D = data;
    prep();
    const sv = load(); if (sv) Object.assign(S, sv);
    if (!VIEWS.some(v => v[0] === S.view)) S.view = 'brief';
    buildChrome(); render();
    const rer = () => { render(); };
    try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rer); } catch (e) {}
    new MutationObserver(rer).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  }
  // 로딩: 기다리는 동안 안내, 30초 넘으면 다시 시도 버튼(늦게 도착하면 그대로 그림). 차트 라이브러리 실패와 데이터 실패를 구분
  let booted = false, slowT = null;
  const retry = () => { location.reload(); };
  const fail = (why) => {
    if (booted) return;
    $('st1').textContent = why === 'chart' ? '차트 도구를 불러오지 못했어요' : '데이터를 불러오지 못했어요';
    msgView(why === 'chart' ? '차트 도구(Chart.js)를 불러오지 못했어요' : '데이터를 불러오지 못했어요',
      why === 'chart' ? '학교 네트워크에서 외부 스크립트(cdn.jsdelivr.net)가 막혔을 수 있어요. 다른 네트워크에서 열거나 잠시 후 다시 시도해 주세요.' : why === 'slow' ? '데이터 응답이 30초 넘게 오지 않아요. 보통 15초 안팎 걸려요. 계속 기다리거나 다시 시도해 주세요.' : 'Apps Script 웹앱 응답에 문제가 있어요. 잠시 후 다시 시도해 주세요.',
      ['다시 시도', retry]);
  };
  const start = d => { if (booted) return; clearTimeout(slowT); if (!window.Chart) { fail('chart'); return; } try { booted = true; boot(d); } catch (e) { booted = false; console.error(e); fail(); } };
  msgView('데이터를 불러오는 중이에요', '보통 15초 안팎 걸려요. 전체 기록(약 1MB)을 받고 있어요.');
  slowT = setTimeout(() => fail('slow'), 30000);
  if (window.SNS_API_URL) {
    window.__sbData = start;
    const sc = document.createElement('script'); sc.src = window.SNS_API_URL + '?callback=__sbData&t=' + Date.now(); sc.onerror = () => { clearTimeout(slowT); fail(); }; document.body.appendChild(sc);
  } else {
    fetch('./data.json', { cache: 'no-store' }).then(r => r.json()).then(start).catch(e => { console.error(e); clearTimeout(slowT); fail(); });
  }
})();
</script>
