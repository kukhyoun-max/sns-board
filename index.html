<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>전주대 SNS 성과 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* 구성: 브리핑 → 콘텐츠 전략 → 제작·홍보대사 → 입시 시즌 → 타 대학 → 콘텐츠 탐색 → 데이터 추출 (상단 텍스트 탭) · 콘텐츠 상세는 전체 화면 패널 · 색은 전주대 UI 컬러 */
:root {
  --bg: #ffffff;
  --plane: #f2f4f6;
  --tile: #f9fafb;
  --fg: #191f28;
  --sub: #4e5968;
  --muted: #4e5968; /* 2026-10-22 회색 하나로(토스 grey700, 대비 7.1:1) · 위계는 회색 대신 크기·굵기로 */
  --line: #e5e8eb;
  /* 전주대학교 UI 컬러 — 메인 JJ 블루 #0078AD, 서브 골드 #CAAE65 · 퍼플 #8F7EAB · 그린 #83B093 · 코랄 #D1906A */
  --jj: #0078ad;
  --navy: #005494;
  --up: #0078ad;
  --up-soft: #e4f1f8;
  --down: #c2410c; /* 시안: 선명한 주황(흰 바탕 5.2:1) */
  --down-soft: #fff1ea;
  --ok: #087f5b;
  --ok-soft: #e6f7f0;
  --ai: #6f5f9e;
  --ai-soft: #efecf6;
  /* --coral은 --down과 같은 hex라 칩·분류에 쓰면 하락으로 읽힘 → 쓰지 않음(경고 문구는 --sub + 선 아이콘) */
  --coral: #c2410c;
  --coral-soft: #fff1ea;
  --down-bar: #f26b2a; /* 넓은 막대 면용 하락 주황(글자용 --down은 면에서 갈색처럼 보임) */
  /* 분류 전용 팔레트(상태색·채널색과 겹치지 않음, 갈색·주황 없음) */
  --cat-1: #0078ad; --cat-2: #005494; --cat-3: #7b61c9; --cat-4: #087f5b; --cat-5: #2aa198; --cat-6: #4e5968; --cat-7: #9aa4b1; --cat-8: #7fb3cf; --cat-9: #b9a6e8;
  --ws: #0f766e; --ws-soft: #e6f4f1; /* 근로장학생 칩(제작 주체 = 분류색) */
  /* 시안: 상태색은 계열색과 다른 hex. 빨강은 수집 실패 같은 경보에만 */
  --st-danger: #da1e28;
  --st-danger-soft: #fdecee;
  --ad: rgba(0, 120, 173, .4); /* 광고 계열 = 브랜드 블루 40% + 외곽선(인스타 색과 분리) */
  --r-lg: 16px; --r-md: 12px; --r-sm: 6px;
  /* 채널 배지의 흰 글자 대비 4.5:1 이상이 되도록 UI 컬러를 한 단계 진하게 */
  --ch-ig: #d6336c; /* 시안: 인스타 로즈 */
  --ch-yt: #1864ab;
  --ch-hong: #0ca678; /* 시안: 인스타와 명도 차 1.48 */
  /* 시안: 타 대학은 맥락이라 회색 단계 + 선 모양(실선·[6,3]·[2,2])으로 구분 */
  --ch-b1: #4e5968;
  --ch-b2: #6b7684;
  --ch-b3: #8b95a1;
  /* 흰 글자 배지는 선보다 진한 값(4.5:1) */
  --chb-hong: #087f5b;
  --chb-bench: #4e5968;
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  /* 글자 크기 단계 — 화면의 모든 글자는 이 8단계만 쓴다(최소 13px, 본문 16px) */
  --fs-tag: 14px;   /* 배지·태그·그래프 축(2026-10-22 13→14: 13px은 「안 읽어도 되는 글」 크기) */
  --fs-xs: 15px;    /* 주석·표 머리·보조 정보(2026-10-22 14→15) */
  --fs-sm: 15px;    /* 버튼·보조 본문 */
  --fs-md: 16px;    /* 본문·목록 제목 */
  --fs-lg: 18px;    /* 소제목·강조 */
  --fs-xl: 22px;    /* 섹션 제목·탭 */
  --fs-2xl: 28px;   /* 카드 큰 숫자 */
  --fs-3xl: 34px;   /* 상세 대표 숫자 */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17171c; --plane: #101013; --tile: #202027; --fg: #f2f3f5; --sub: #c3c8cf; --muted: #aab1ba; --line: #2c2c35;
    --up: #4fb0dd; --up-soft: #12293a; --down: #ff8a5c; --down-soft: #3a2118; --ok: #38d9a9; --ok-soft: #12302a; --ai: #ab9dd6; --ai-soft: #252036; --coral: #ff8a5c; --coral-soft: #3a2118; --jj: #4fb0dd; --navy: #6fa3d6;
    --ch-ig: #f06595; --ch-yt: #74a9e8; --ch-hong: #38d9a9; --ch-b1: #c3c8cf; --ch-b2: #9aa4b1; --ch-b3: #7d8590; --chb-hong: #38d9a9; --chb-bench: #9aa4b1; --st-danger: #ff6b72; --st-danger-soft: #3a1a1d; --ad: rgba(79, 176, 221, .4);
    --down-bar: #ff8a5c; --cat-1: #4fb0dd; --cat-2: #6fa3d6; --cat-3: #ab9dd6; --cat-4: #38d9a9; --cat-5: #5fd3c6; --cat-6: #c3c8cf; --cat-7: #7d8590; --cat-8: #9ccbe3; --cat-9: #d0c4f0; --ws: #5fd3c6; --ws-soft: #12302e;
    color-scheme: dark;
    --badge-fg: #17171c;
  }
}
:root[data-theme="dark"] {
  --bg: #17171c; --plane: #101013; --tile: #202027; --fg: #f2f3f5; --sub: #c3c8cf; --muted: #aab1ba; --line: #2c2c35;
  --up: #4fb0dd; --up-soft: #12293a; --down: #ff8a5c; --down-soft: #3a2118; --ok: #38d9a9; --ok-soft: #12302a; --ai: #ab9dd6; --ai-soft: #252036; --coral: #ff8a5c; --coral-soft: #3a2118; --jj: #4fb0dd; --navy: #6fa3d6;
  --ch-ig: #f06595; --ch-yt: #74a9e8; --ch-hong: #38d9a9; --ch-b1: #c3c8cf; --ch-b2: #9aa4b1; --ch-b3: #7d8590; --chb-hong: #38d9a9; --chb-bench: #9aa4b1; --st-danger: #ff6b72; --st-danger-soft: #3a1a1d; --ad: rgba(79, 176, 221, .4);
  --down-bar: #ff8a5c; --cat-1: #4fb0dd; --cat-2: #6fa3d6; --cat-3: #ab9dd6; --cat-4: #38d9a9; --cat-5: #5fd3c6; --cat-6: #c3c8cf; --cat-7: #7d8590; --cat-8: #9ccbe3; --cat-9: #d0c4f0; --ws: #5fd3c6; --ws-soft: #12302e;
  color-scheme: dark;
  --badge-fg: #17171c;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--plane); color: var(--fg); font-family: var(--font); font-size: var(--fs-md); line-height: 1.6; -webkit-font-smoothing: antialiased;
  /* 한국어는 단어 중간에서 줄을 바꾸지 않는다(긴 URL·영문만 필요할 때 끊음) */
  word-break: keep-all; overflow-wrap: anywhere; }
h1, h2, h3 { line-height: 1.3; text-wrap: balance; }
small { font-size: max(var(--fs-tag), .85em); } /* 브라우저 기본(83%)으로 13px 아래로 내려가지 않게 */
.seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }

p, li { text-wrap: pretty; }
/* 숫자·버튼·배지는 한 줄로 */
.num, .chip, .tag, .chb, .seg button, .tg2, .btn, .adtg, .wk-v, td.n, th { white-space: nowrap; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--jj); outline-offset: 2px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }

.app { max-width: 1080px; margin: 0 auto; background: var(--bg); min-height: 100vh; }
.sec { background: var(--bg); padding: 24px clamp(16px, 4vw, 32px); }
.gap { height: 12px; background: var(--plane); }

/* 상단 탭 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); padding: 14px clamp(16px, 4vw, 32px) 0; display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.top::-webkit-scrollbar { display: none; }
.tt { background: none; border: 0; padding: 4px 0 12px; font-size: var(--fs-xl); font-weight: 700; color: #8b95a1; cursor: pointer; white-space: nowrap; letter-spacing: -0.02em; }
.tt[aria-selected="true"] { color: var(--fg); }
.status { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 16px clamp(16px, 4vw, 32px) 4px; background: var(--bg); }
.status .st { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--sub); font-size: var(--fs-sm); }
.status .st span { white-space: nowrap; }
.status .st span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 2px; }
.status .st span.live::before { background: var(--ok); }
.seg { display: inline-flex; background: var(--plane); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: var(--fs-sm); color: var(--muted); cursor: pointer; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* 지수 카드 */
.idx { display: flex; gap: 12px; overflow-x: auto; padding: 14px clamp(16px, 4vw, 32px) 20px; background: var(--bg); scroll-snap-type: x mandatory; scrollbar-width: none; }
.idx::-webkit-scrollbar { display: none; }
.ic { flex: 0 0 240px; scroll-snap-align: start; background: var(--tile); border-radius: var(--r-lg); padding: 18px 18px 16px; border: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.ic:hover { background: var(--plane); }
.ic .nm { font-size: var(--fs-sm); font-weight: 600; color: var(--sub); }
.ic .cp { font-size: var(--fs-xs); color: var(--muted); }
.ic canvas { width: 100% !important; height: 64px !important; margin: 8px 0 6px; }
.ic .v { font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.ic .d { font-size: var(--fs-md); font-weight: 600; }

/* 한 줄 요약 */
.brief { padding: 4px clamp(16px, 4vw, 32px) 24px; background: var(--bg); }
.brief .lb { font-size: var(--fs-md); font-weight: 700; color: var(--ai); }
.brief .lb small { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: var(--fs-sm); }
.brief button { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; background: none; border: 0; padding: 6px 0 0; text-align: left; font-size: var(--fs-lg); font-weight: 700; letter-spacing: -0.02em; cursor: pointer; }
.brief ul { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.brief li { font-size: var(--fs-md); color: var(--sub); padding-left: 14px; position: relative; }
.brief li::before { content: ""; position: absolute; left: 0; top: 10px; width: 5px; height: 5px; border-radius: 50%; background: var(--ai); }
.chev { color: var(--muted); font-size: var(--fs-xl); flex: none; transition: transform .15s; }

/* 섹션 머리 */
.sh { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.sh h2 { margin: 0; font-size: var(--fs-xl); font-weight: 700; letter-spacing: -0.02em; }
.sh p { margin: 2px 0 0; font-size: var(--fs-sm); color: var(--muted); }

/* 분류 칩 */
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: none; padding: 9px 14px; border-radius: 12px; font-size: var(--fs-md); font-weight: 600; color: var(--sub); cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--plane); color: var(--fg); }
.chip b { font-weight: 600; margin-left: 4px; }

/* 트리맵 */
.tree { position: relative; height: 380px; border-radius: 8px; overflow: hidden; }
.tm { position: absolute; border: 2px solid var(--bg); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4px 6px; color: #fff; cursor: pointer; overflow: hidden; }
.tm:hover { filter: brightness(1.08); }
.tm .a { font-size: var(--fs-md); font-weight: 700; line-height: 1.3; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tm .b { font-size: var(--fs-sm); font-weight: 400; opacity: .95; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tm.s .a { font-size: var(--fs-tag); }
.tm.s .b { font-size: var(--fs-tag); }
.tm.xs .b { display: none; }
.legend { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: var(--fs-xs); color: var(--muted); gap: 10px; flex-wrap: wrap; }
.scale { display: flex; gap: 2px; align-items: center; }
.scale i { width: 22px; height: 10px; border-radius: 2px; display: inline-block; }
.more { display: block; width: 100%; margin-top: 14px; border: 0; background: none; color: var(--sub); font-size: var(--fs-md); padding: 10px; cursor: pointer; }

/* 순위 목록 */
.rank { list-style: none; margin: 0; padding: 0; }
/* 순위 행: 제목이 폭을 다 쓰도록 태그는 날짜 줄 아래로 */
.rk { display: grid; grid-template-columns: 28px minmax(0, 1fr); align-items: center; column-gap: 14px; row-gap: 6px; padding: 12px 8px 12px 0; cursor: pointer; border-radius: 12px; }
.rk:hover { background: var(--tile); }
.rk .no { font-size: var(--fs-lg); font-weight: 700; color: var(--sub); text-align: center; }
.av { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: var(--fs-xs); letter-spacing: -0.02em; flex: none; }
.rk .t { min-width: 0; }
.rk .t b { display: block; font-size: var(--fs-md); font-weight: 600; margin-bottom: 2px; }
.rk .t span { font-size: var(--fs-sm); color: var(--muted); }
.rk .t span em { font-style: normal; font-weight: 600; }
.rk .tg { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-start; }
.rk .tg:empty { display: none; }

/* 태그 */
.tag { display: inline-flex; align-items: center; font-size: var(--fs-tag); font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--plane); color: var(--sub); white-space: nowrap; }
.tag.p-amb { background: var(--ok-soft); color: var(--ok); }
.tag.p-ad { background: transparent; color: var(--jj); box-shadow: inset 0 0 0 1px var(--ad); } /* 광고 = 블루 외곽선(하락 주황 아님) */
.tag.p-own { background: var(--up-soft); color: var(--navy); }
.tag.p-ugc { background: var(--ai-soft); color: var(--ai); }
.tag.p-col { background: var(--down-soft); color: var(--down); }
/* 채널 배너 */
.chb { display: inline-flex; align-items: center; flex: none; font-size: var(--fs-tag); font-weight: 700; letter-spacing: -0.01em; line-height: 1; padding: 4px 7px; border-radius: 5px; color: var(--badge-fg, #fff); background: var(--c); margin-right: 7px; vertical-align: 2px; }
.ln { display: flex; align-items: center; min-width: 0; }
.ln > .tx { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rk .t .ln .chb { color: var(--badge-fg, #fff); font-size: var(--fs-tag); }
.rk .t .ln .tx { color: var(--fg); font-size: var(--fs-md); }

/* 분석 표 */
.ana { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; }
@media (max-width: 860px) { .ana { grid-template-columns: minmax(0, 1fr); } }
.ana h3 { margin: 0 0 10px; font-size: var(--fs-lg); font-weight: 700; }
.bars { display: flex; flex-direction: column; gap: 4px; }
.br { display: grid; grid-template-columns: 150px minmax(0, 1fr) 64px; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 8px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.br:hover { background: var(--tile); }
.br .l { font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.br .l small { display: block; font-size: var(--fs-tag); color: var(--muted); font-weight: 400; white-space: normal; line-height: 1.5; }
.br .v em { display: block; font-style: normal; font-size: var(--fs-tag); font-weight: 400; color: var(--muted); }
.br .tr { height: 22px; background: var(--tile); border-radius: 6px; position: relative; overflow: hidden; }
.br .tr i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
.br .tr .mid { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); opacity: .35; }
.br .v { font-size: var(--fs-sm); font-weight: 700; text-align: right; }
.note { font-size: var(--fs-xs); color: var(--muted); margin: 10px 0 0; }

/* 표 */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: var(--fs-sm); }
th, td { padding: 11px 8px; border-bottom: 1px solid var(--line); text-align: left; }
th { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; white-space: nowrap; }
th button { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font-weight: 600; }
th button[data-dir]::after { content: " ↓"; color: var(--jj); }
th button[data-dir="asc"]::after { content: " ↑"; }
td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--tile); }
td.tt2 { max-width: 420px; }

/* 상세 패널 */
.detail { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; }
.dwrap { max-width: 760px; margin: 0 auto; padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.dh { position: sticky; top: 0; z-index: 2; background: var(--bg); display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; }
.dh button { width: 44px; height: 44px; border: 0; background: none; font-size: var(--fs-2xl); cursor: pointer; border-radius: 12px; }
.dh button:hover { background: var(--tile); }
.dh .ctr { text-align: center; min-width: 0; }
.dh .ctr small { display: block; font-size: var(--fs-xs); color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dh .ctr b { font-size: var(--fs-md); font-weight: 700; }
.dtabs { display: flex; gap: 22px; padding: 0 20px; border-bottom: 1px solid var(--line); position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); background: var(--bg); z-index: 2; }
.dtabs button { border: 0; background: none; padding: 10px 0 12px; font-size: var(--fs-lg); font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; }
.dtabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }
.dsec { padding: 22px 20px; }
.dtitle { font-size: var(--fs-xl); font-weight: 700; letter-spacing: -0.02em; line-height: 1.4; margin: 0 0 10px; }
.dtitle .chb { font-size: var(--fs-tag); padding: 5px 8px; }
.dbig { font-size: var(--fs-3xl); font-weight: 700; letter-spacing: -0.02em; }
.dbig small { display: block; margin: 4px 0 0; font-size: var(--fs-sm); font-weight: 700; line-height: 1.5; white-space: normal; letter-spacing: 0; }

/* 분류 칩: 세부 분류 줄 */

/* ── 홈 개편 (2026-10) ── */
.mu { color: var(--muted); }
.warn { color: var(--sub); } /* 데이터 상태 안내: 하락색 대신 중립 + 선 아이콘 */
.sh h2 + p, .sh p { line-height: 1.55; }
h3 small { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; margin-left: 4px; }
/* ① 이번 주 현황 */
.wk-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.wk-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.wk-card { background: var(--tile); border-radius: var(--r-lg); padding: 18px 18px 16px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

.wk-card.wide .wk-h, .wk-card.wide .wk-v, .wk-card.wide .wk-s { grid-column: 1; }
.wk-card.wide .wk-bar, .wk-card.wide .wk-l, .wk-card.wide .wk-f { grid-column: 2; }
.wk-card.wide .wk-bar { grid-row: 1 / span 2; align-self: end; }
.wk-card.wide .wk-l { grid-row: 3; }

.wk-h { font-size: var(--fs-md); font-weight: 700; color: var(--sub); display: flex; align-items: center; gap: 6px; }
.wk-v { font-size: var(--fs-3xl); font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }

.wk-bar i { display: block; height: 100%; }
.wk-l { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-xs); color: var(--sub); }
.wk-l i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 1px; }
.wk-l b { color: var(--fg); margin-left: 2px; }
.wk-f { font-size: var(--fs-xs); color: var(--muted); border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
.wk-f b { color: var(--fg); }
.wk-lists { margin-top: 26px; }
/* ② 추이 */
.tr-ctl { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; margin-bottom: 14px; }
.tr-ctl .chips { margin: 0; }
.tr-ctl .chip { padding: 6px 12px; border-radius: 8px; font-size: var(--fs-sm); } /* 기간·단위 선택(.seg)과 같은 크기 */
.tr-pu { display: flex; gap: 8px; flex-wrap: wrap; }
.tr-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tr-grid.one { grid-template-columns: minmax(0, 1fr); }
.tr-card { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 16px 12px; min-width: 0; }

.tr-h .chb { align-self: center; }
.tr-v { font-size: var(--fs-xl); font-weight: 700; letter-spacing: -0.02em; margin-left: auto; }
.tr-d { font-size: var(--fs-xs); font-weight: 700; }
.tr-cap { font-size: var(--fs-tag); color: var(--muted); text-align: right; }
.tr-chart { position: relative; height: 170px; margin-top: 6px; }
.tr-grid.one .tr-chart { height: 240px; }
.tr-top { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 8px; align-items: center; font-size: var(--fs-tag); color: var(--muted); }
.tr-top > span { margin-right: 2px; font-weight: 600; }
.tr-top button { border: 0; background: var(--plane); border-radius: 8px; padding: 4px 8px; font-size: var(--fs-tag); color: var(--sub); cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-top button b { color: var(--up); }
.tr-top button:hover { background: var(--line); }
/* ③ 타 대학 비교 */
.bc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.bc-b { background: var(--tile); border-radius: var(--r-lg); padding: 16px 16px 10px; min-width: 0; }
.bc-b h3 { margin: 0 0 8px; font-size: var(--fs-md); font-weight: 700; color: var(--sub); }

.bc-v { font-size: var(--fs-sm); font-weight: 700; min-width: 56px; text-align: right; }

.bc-r.ours .bc-v { color: var(--fg); }
.bc-r:not(.ours) { opacity: .92; }
/* 직접 골라 보기 */
.adv { background: var(--bg); }
.adv > .adv-h { width: 100%; border: 0; background: none; font: inherit; color: inherit; text-align: left; -webkit-tap-highlight-color: transparent; touch-action: manipulation; scroll-margin-top: 110px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px clamp(16px, 4vw, 32px); }
.adv > .adv-h b { display: block; font-size: var(--fs-lg); font-weight: 700; }
.adv > .adv-h small { font-size: var(--fs-xs); color: var(--muted); }
.adv.open > .adv-h .chev { transform: rotate(90deg); }
.adv.open > .adv-h { border-bottom: 1px solid var(--line); }
@media (max-width: 760px) {
  .tr-grid, .bc-grid { grid-template-columns: minmax(0, 1fr); }

  .wk-card.wide .wk-bar { align-self: stretch; }
  /* 모바일: 채널 카드를 옆으로 넘기지 않고 세로로 쌓는다(오른쪽 카드가 잘려 보이지 않게) */
  .wk-row { grid-template-columns: minmax(0, 1fr); }
  .wk-v { font-size: var(--fs-2xl); }
  .tr-ctl { align-items: stretch; }

}
.bc-r.ours .bc-v { font-weight: 700; }

.tr-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tr-l { font-size: var(--fs-md); font-weight: 700; align-self: center; }
.tr-lg { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: var(--fs-tag); color: var(--sub); margin-top: 4px; }
.tr-lg i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.tr-lg small { color: var(--muted); }
@media (max-width: 760px) { .tr-grid.two { grid-template-columns: minmax(0, 1fr); } }
.dy { margin-top: 22px; }
.dy-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
.dy-h h3 { margin: 0; font-size: var(--fs-lg); font-weight: 700; }
.dy-h .chips { margin: 0; }
.dy-chart { position: relative; height: 200px; margin-top: 8px; }
.tr-empty { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: var(--fs-sm); background: var(--tile); border-radius: 12px; }

/* 홈 맨 위: 핵심 숫자 한 줄 + 자동 요약 */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi-t { background: var(--tile); border-radius: 16px; padding: 16px 18px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.kpi-l { font-size: var(--fs-xs); font-weight: 600; color: var(--sub); }
.kpi-v { font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; white-space: nowrap; }
.kpi-s { font-size: var(--fs-xs); color: var(--muted); }
.kpi-s .up, .kpi-s .down, .kpi-s .warn { font-weight: 600; }
.sumry { margin: 16px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.sumry li { position: relative; padding-left: 16px; font-size: var(--fs-md); color: var(--fg); line-height: 1.6; }
.sumry li::before { content: ""; position: absolute; left: 2px; top: 11px; width: 6px; height: 6px; border-radius: 50%; background: var(--jj); }
.sumry b { font-weight: 700; }
.top-sec .callout { margin-top: 16px; }
@media (max-width: 560px) { .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .kpi-t { padding: 14px; } .kpi-v { font-size: var(--fs-xl); } }
/* 한 칸을 넓게 쓰는 순위 목록은 PC에서 태그를 오른쪽에 */
@media (min-width: 861px) { .rank.wide .rk { grid-template-columns: 28px minmax(0, 1fr) auto; } .rank.wide .rk .tg { grid-column: auto; justify-content: flex-end; flex-wrap: nowrap; } }

/* ───── 시각 스타일 다듬기 ───── */
/* 상단 채널 탭: 선택한 탭에 밑줄 */
.tt { position: relative; }
.tt[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--fg); }
/* 섹션 머리 여백·제목 */
.sh { margin-bottom: 18px; }
/* 카드: 같은 모양(둥근 모서리 16px, 옅은 테두리) */
.kpi-t, .wk-card, .bc-b { border: 1px solid var(--line); background: var(--bg); border-radius: 16px; }
.tr-card { border-radius: 16px; }
.kpi-t:first-child { background: var(--up-soft); border-color: transparent; }
.kpi-t:first-child .kpi-l { color: var(--navy); }
/* 선택된 칩은 JJ 블루로 구분 */
.chip[aria-pressed="true"] { background: var(--up-soft); color: var(--navy); }
.more-chip { color: var(--muted); }
.more-chip::after { content: " ▾"; font-size: var(--fs-tag); }
.more-chip[aria-expanded="true"]::after { content: " ▴"; }
/* 그래프 패널의 '이 기간 히트'는 한 줄 */
.tr-top { flex-wrap: nowrap; overflow: hidden; }
.tr-top button { flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 맨 위 보고 버튼 */
.top-act { display: flex; gap: 8px; flex-wrap: wrap; }
/* 하단 메뉴: 글자 굵게, 선택한 메뉴는 JJ 블루 + 위쪽 표시 */
.bnav button { position: relative; font-weight: 600; color: var(--muted); }
.bnav button[aria-current="page"] { color: var(--jj); }
.bnav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--jj); }

/* ───── 인쇄·PDF: 조작 버튼·메뉴는 숨기고 흰 바탕, 카드가 페이지에서 잘리지 않게 ───── */
@media print {
  @page { size: A4; margin: 12mm; }
  :root { --plane: #fff; --tile: #fff; }
  body { background: #fff; }
  .top, .status .ctl, .bnav, .tr-ctl, .top-act, .more, #advBox, .adv, .seg, .chips, .detail, .toast { display: none !important; }
  .app { max-width: none; }
  .sec { padding: 10px 0; }
  .gap { height: 6px; }
  .kpi-t, .wk-card, .tr-card, .bc-b, .rk, .callout, tr { break-inside: avoid; }
  .sec h2 { break-after: avoid; }
  .kpi-row { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .wk-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tr-grid, .tr-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
.tr-top > span { flex: none; white-space: nowrap; }
.tr-top button { flex: 1 1 0; max-width: max-content; }

/* ───── 시안: 미감 다듬기 ───── */
/* 회색 바탕 위에 흰 섹션이 떠 있는 구조(TDS). PC에서는 섹션을 둥근 판으로 */
.app { background: transparent; }
.brand { display: flex; align-items: center; gap: 8px; padding: 18px clamp(16px, 4vw, 32px) 0; background: var(--bg); font-size: var(--fs-sm); color: var(--muted); letter-spacing: -0.01em; }
.brand b { color: var(--fg); font-weight: 800; }
.brand-mk { width: 18px; height: 18px; border-radius: 6px; background: var(--jj); box-shadow: inset -6px -6px 0 var(--navy); flex: none; }
.top { background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px); padding-top: 10px; }
.tt { color: var(--muted); transition: color .15s; }
.tt:hover { color: var(--sub); }
.tt[aria-selected="true"]::after { background: var(--jj); }
.sh h2 { font-weight: 800; letter-spacing: -0.03em; }
@media (min-width: 861px) {
  .app { padding: 0 16px; }
  .brand, .top, .status { border-radius: 0; }
  .brand { border-radius: 20px 20px 0 0; margin-top: 16px; }
  .status { border-radius: 0 0 20px 20px; padding-bottom: 16px; }
  .sec { border-radius: 20px; }
  .gap { background: transparent; height: 16px; }
}
/* 첫 KPI 하나만 브랜드 면으로 강조(강조는 한 군데) */
.kpi-t:first-child { background: linear-gradient(135deg, #0a86bf 0%, var(--navy) 100%); border-color: transparent; color: #fff; box-shadow: 0 10px 24px -12px rgba(0, 84, 148, .55); }
.kpi-t:first-child .kpi-l, .kpi-t:first-child .kpi-s, .kpi-t:first-child .kpi-s .up, .kpi-t:first-child .kpi-s .down, .kpi-t:first-child .kpi-s .flat { color: rgba(255, 255, 255, .88); }
.kpi-t:first-child .kpi-v { color: #fff; }
.kpi-v, .wk-v { letter-spacing: -0.03em; }
/* 카드: 옅은 테두리 + 손을 올리면 살짝 떠오름 */
.kpi-t, .wk-card, .tr-card, .bc-b { transition: box-shadow .2s, transform .2s, border-color .2s; }
.wk-card:hover, .tr-card:hover { border-color: transparent; box-shadow: 0 8px 28px -10px rgba(25, 31, 40, .18); }
/* 채널 카드: 채널색을 옅게 깐 머리 */
.wk-card[style*="--c"] { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 7%, var(--bg)) 0, var(--bg) 96px); }
.wk-bar { height: 8px; border-radius: 999px; }
.wk-l i { border-radius: 50%; }
/* 칩·세그먼트: 둥근 알약 */
.chip, .tr-ctl .chip { border-radius: 999px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg { border-radius: 999px; padding: 4px; }
.seg button { border-radius: 999px; }
.seg button[aria-pressed="true"] { box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 8px -2px rgba(0, 0, 0, .08); }
/* 요약 글머리: 브랜드 점 */
.sumry li::before { width: 7px; height: 7px; top: 10px; background: linear-gradient(135deg, var(--jj), var(--navy)); }
.callout { border-radius: var(--r-lg); }
/* 하단 탭: 반투명 + 선택 색 */
.bnav { background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px); }
@media (prefers-reduced-motion: reduce) { .kpi-t, .wk-card, .tr-card, .bc-b, .tt { transition: none; } }

/* ───── 개편 1단계 ───── */
/* KPI 스파크라인 */
.kspark { display: block; width: 100%; height: 28px; margin-top: 10px; overflow: visible; }
.kspark .l { fill: none; stroke: var(--jj); stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.kspark .a { fill: var(--jj); opacity: .1; }
.kpi-t:first-child .kspark .l { stroke: #fff; }
.kpi-t:first-child .kspark .a { fill: #fff; opacity: .16; }
/* 최근 게시물 속도 */
.race { margin-top: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px 12px; }
.race-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; margin-bottom: 4px; }
.race-h h3 { margin: 0; font-size: var(--fs-md); font-weight: 700; letter-spacing: -0.01em; }
.race-h span { font-size: var(--fs-tag); color: var(--muted); }
.race-l { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; }
.race-l li { padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; min-width: 0; display: flex; flex-direction: column; gap: 6px; border-radius: 4px; }
.race-l li:nth-child(-n+2) { border-top: 0; }
@media (hover: hover) { .race-l li:hover .race-t span:last-child { text-decoration: underline; text-underline-offset: 3px; } }
.race-t { display: flex; align-items: center; min-width: 0; font-size: var(--fs-sm); font-weight: 600; }
.race-t span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.race-b { display: flex; align-items: center; gap: 12px; }
.bl { position: relative; flex: 1; height: 8px; border-radius: 999px; background: var(--plane); }
.bl i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
.bl i.hit { background: linear-gradient(90deg, var(--jj), var(--navy)); }
.bl i.up { background: var(--jj); }
.bl i.down { background: var(--down); }
.bl em { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--muted); opacity: .55; }
.bl em.h, .race-k em.h { background: var(--fg); opacity: .8; }
.race-b b { font-size: var(--fs-sm); min-width: 84px; text-align: right; }
.race-l small { color: var(--muted); font-size: var(--fs-tag); }
.race-k { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--fs-tag); color: var(--muted); padding-top: 10px; border-top: 1px solid var(--line); }
.race-k span { display: inline-flex; align-items: center; gap: 6px; }
.race-k em { display: inline-block; width: 2px; height: 12px; border-radius: 1px; background: var(--muted); opacity: .55; }
@media (max-width: 560px) {
  .race { padding: 14px 14px 10px; }
  .race-l { grid-template-columns: minmax(0, 1fr); }
  .race-l li:nth-child(2) { border-top: 1px solid var(--line); }
}
/* KPI 카드: 정사각형(내용이 넘치면 세로로만 늘어남), 스파크라인은 바닥에 */
.kpi-row { grid-auto-rows: 1fr; } /* 모든 줄을 같은 높이로 */
.kpi-row .kpi-t { aspect-ratio: 1 / 1; }
.kpi-row .kpi-t .kspark { margin-top: auto; padding-top: 10px; box-sizing: content-box; }
.kpi-v small { font-size: .55em; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
.kpi-s { line-height: 1.5; }
.bl i.base { background: var(--muted); opacity: .45; }
@media (max-width: 560px) { .kpi-row .kpi-t { padding: 14px 14px 12px; } .kpi-row .kpi-s { font-size: var(--fs-tag); } .kpi-row .kspark { height: 24px; padding-top: 8px; } }
@media (max-width: 560px) { .kpi-row .kpi-t:last-child:nth-child(odd) { grid-column: 1 / -1; aspect-ratio: auto; } }

/* 상단 상태 줄: 왼쪽 「10/17 기준 · 지난 기록 10/12」 한 줄, 맨 오른쪽 「광고 포함」 버튼. 기간 선택은 아래 줄 */
.status { flex-wrap: wrap; gap: 8px 12px; padding-top: 12px; padding-bottom: 8px; }
.status .st { flex: 1 1 0; min-width: 0; flex-wrap: nowrap; gap: 0; font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.status .st span::before, .status .st span.live::before { display: none; }
.status .st span:empty { display: none; }
.status .st span + span:not(:empty)::before { display: inline; content: "·"; width: auto; height: auto; border-radius: 0; background: none; margin: 0 6px; vertical-align: 0; color: var(--muted); }
.status .st span.live { color: var(--sub); font-weight: 600; }
.status .ctl { flex: none; }
.status .st { order: 1; } .status .ctl { order: 2; }
.status::after { content: ""; order: 3; flex-basis: 100%; height: 0; } /* 줄바꿈: 기간 선택은 아래 줄 */
.status #rangeSeg { order: 4; }
.status:not(:has(#rangeSeg:not([hidden])))::after { display: none; }
.adtg, .adtg[aria-pressed="true"] { padding: 5px 12px; border-radius: 999px; font-size: var(--fs-tag); font-weight: 700; }
.adtg::before, .adtg::after { display: none; }
.adtg { color: var(--muted); background: var(--bg); border: 1px solid var(--line); }
.adtg[aria-pressed="true"] { color: #fff; background: var(--jj); border-color: var(--jj); }
/* 칩 줄: 위 상자와 붙지 않게 간격, 크기 한 단계 작게, 넘치면 오른쪽 끝을 흐리게(옆으로 밀면 더 있음) */
:where(.sec) * + .chips { margin-top: 14px; }
.chip { padding: 7px 14px; font-size: var(--fs-sm); }
.chips { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); padding-right: 28px; }
/* 광고 화면 매체 전환: 섹션 여백 안에 */
.pf-sec { padding-top: 12px; padding-bottom: 4px; }
.pf-sec .pfseg { margin: 0; border-radius: 999px; }
.pf-sec .pfseg button { border-radius: 999px; padding: 9px 8px; }
@media (min-width: 861px) { .pf-sec { margin-bottom: 16px; padding-bottom: 12px; } }
/* 선택한 칩: 진한 검정 대신 브랜드 옅은 면 */
.chip[aria-pressed="true"] { background: var(--up-soft); color: var(--navy); }

/* 알림: 맨 위 오른쪽 종(선 아이콘) + 펼침 패널 */
.brand { position: relative; z-index: 20; padding-top: 10px; }
.bell { margin-left: auto; width: 44px; height: 44px; border: 0; background: none; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: var(--sub); position: relative; cursor: pointer; flex: none; }
.bell:hover, .bell[aria-expanded="true"] { background: var(--plane); color: var(--fg); }
.bell svg { width: 22px; height: 22px; }
.bdg { position: absolute; top: 5px; right: 4px; min-width: 19px; height: 19px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: var(--st-danger); color: #fff; font-size: var(--fs-tag); font-weight: 700; line-height: 19px; text-align: center; box-shadow: 0 0 0 2px var(--bg); font-variant-numeric: tabular-nums; }
.ntf { position: absolute; right: clamp(16px, 4vw, 32px); top: calc(100% - 4px); width: min(360px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: 0 16px 40px -12px rgba(25, 31, 40, .3); padding: 6px 0; }
.ntf-h { padding: 8px 16px 10px; font-weight: 700; font-size: var(--fs-sm); color: var(--fg); }
.ntf ul { list-style: none; margin: 0; padding: 0; }
.ntf li { padding: 12px 16px; border-top: 1px solid var(--line); }
.ntf li b { display: block; font-size: var(--fs-sm); font-weight: 700; color: var(--fg); line-height: 1.45; }
.ntf li.new b::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--st-danger); margin-right: 7px; vertical-align: 2px; }
.ntf li p { margin: 4px 0 0; font-size: var(--fs-xs); color: var(--sub); line-height: 1.6; }
.ntf-e { margin: 0; padding: 4px 16px 12px; font-size: var(--fs-xs); color: var(--muted); }
@media print { .bell, .ntf { display: none !important; } }
/* 입시 시즌 카드: 휴대폰에서도 2칸, 홀수면 마지막 카드는 넓게 */
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .kpis > :last-child:nth-child(odd) { grid-column: 1 / -1; } .kpis .kpi { padding: 14px; } }
/* 왼쪽 위 제목 = 홈으로 + 새로고침 */
.brand-home { display: inline-flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; border-radius: 8px; min-height: 44px; }
.brand-home:hover b { color: var(--jj); }
/* 타 대학: 점유율 한 줄 결론 */
.lead-s { margin: 0 0 12px; font-size: var(--fs-md); line-height: 1.6; }
/* 홈 KPI: 짝수 개로 맞춤(홀수면 「가장 잘 된 게시물」 카드 추가) · PC는 4개면 4칸, 6개면 3칸 */
@media (min-width: 561px) { .kpi-row.n4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .kpi-row.n6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .kpi-row.n6 .kpi-t { aspect-ratio: auto; min-height: 168px; } }
.kpi-t.best { cursor: pointer; }
.kpi-t.best:hover { border-color: var(--jj); }
.kpi-t.best .bt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--sub); }
.kpi-t.best .chb { margin-right: 5px; }
/* 카드 설명: 숫자(1.5배 등) 가운데서 줄이 끊기지 않게 */
.kpi-s { overflow-wrap: break-word; word-break: keep-all; }
/* 홈 KPI: 카드 이름·설명은 무조건 한 줄(넘치면 …) */
.kpi-row .kpi-l, .kpi-row .kpi-s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-row .kpi-t.best .bt { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-line-clamp: unset; }

/* ───── 글줄 간격 다시 잡기(2026-10-18): 한글 본문 1.7, 보조 글 1.65, 덩어리 사이 간격 ───── */
body { line-height: 1.7; }
p, li, .note, .d, .sh p { line-height: 1.7; }
h2, h3 { line-height: 1.35; }
small { line-height: 1.6; }
.note { margin-top: 10px; }
.sumry { gap: 10px; }
.sumry li { line-height: 1.75; }
.callout, .wait { line-height: 1.75; }
.callout small, .wait small { display: block; margin-top: 6px; line-height: 1.65; }
/* 처방 카드: 본문·안내를 덩어리로 나눔 */
.rx { gap: 8px; padding: 18px; }
.rx-p { font-size: var(--fs-sm); color: var(--sub); line-height: 1.75; }
.rx-p b { color: var(--fg); }
.rx-n { display: block; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: var(--fs-xs); line-height: 1.65; }
.rx-l { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.rx-l li { min-width: 0; }
.rx-t { color: var(--fg); font-weight: 600; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rx-t .chb { margin-right: 6px; vertical-align: 1px; }
.rx-m { margin-top: 3px; font-size: var(--fs-xs); color: var(--muted); }
.rx-m b { color: var(--up); }
.rule-l li, .rules li { line-height: 1.7; }
/* 30일 최고 게시물: 이 게시물 · 우리 평균 · 타 대학 평균 막대 */
.cmp3 { margin-top: auto; padding-top: 10px; display: flex; flex-direction: column; gap: 5px; }
.c3r { display: grid; grid-template-columns: 5.2em minmax(0, 1fr) auto; align-items: center; gap: 6px; font-size: var(--fs-tag); line-height: 1.3; color: var(--muted); white-space: nowrap; }
.c3t { height: 6px; border-radius: 999px; background: var(--plane); overflow: hidden; }
.c3t i { display: block; height: 100%; border-radius: 999px; }
.c3r b { color: var(--fg); font-weight: 700; min-width: 2.6em; text-align: right; }
.c3r:first-child b { color: var(--up); }
/* 홈 요약: 덩어리 카드(머리 숫자 · 내역 칩 · 누르면 상세로 가는 게시물 줄) */
.sum2 { margin-top: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .sum2 { grid-template-columns: minmax(0, 1fr); } }
.s2 { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.s2-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: var(--fs-sm); font-weight: 700; color: var(--sub); }
.s2-h b { font-size: var(--fs-xl); color: var(--fg); letter-spacing: -0.02em; }
.s2-f { display: flex; flex-wrap: wrap; gap: 6px; }
.s2-f span { background: var(--tile); border-radius: 999px; padding: 4px 10px; font-size: var(--fs-xs); color: var(--sub); line-height: 1.5; }
.s2-f b { color: var(--fg); margin-left: 2px; }
.s2-r { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "l v" "t v"; column-gap: 12px; row-gap: 2px; align-items: center; text-align: left; width: 100%; border: 0; border-top: 1px solid var(--line); background: none; padding: 10px 0 0; font: inherit; cursor: pointer; color: inherit; }
.s2-l { grid-area: l; font-size: var(--fs-tag); color: var(--muted); font-weight: 600; }
.s2-t { grid-area: t; min-width: 0; font-size: var(--fs-sm); font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.5; }
.s2-t .chb { margin-right: 6px; }
.s2-r b { grid-area: v; font-size: var(--fs-md); white-space: nowrap; }
@media (hover: hover) { .s2-r:hover .s2-t { color: var(--jj); } }

/* ───── 덩어리 정리(2026-10-18): 용어 칩 · 분류 요약 행 · 편성 참고 목록 · 등급 칩 · 범례 ───── */
.defs { margin: 0 0 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.defs > div { background: var(--tile); border-radius: var(--r-md); padding: 10px 12px; min-width: 0; }
.defs dt { font-size: var(--fs-tag); font-weight: 700; color: var(--fg); }
.defs dd { margin: 2px 0 0; font-size: var(--fs-tag); color: var(--sub); line-height: 1.55; }
.defs > div[title] { cursor: help; }
.irs { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.ir { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
.ir-h { display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); }
.ir-g { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 420px) { .ir-g { grid-template-columns: minmax(0, 1fr); } }
.ir-c { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ir-l { font-size: var(--fs-tag); color: var(--muted); font-weight: 600; }
.ir-c > b { font-size: var(--fs-md); color: var(--fg); }
.ir-v { font-size: var(--fs-tag); color: var(--sub); }
.ir-v b { font-size: var(--fs-sm); }
.ir-f { display: flex; flex-wrap: wrap; gap: 6px; }
.ir-f span { background: var(--tile); border-radius: 999px; padding: 4px 10px; font-size: var(--fs-xs); color: var(--sub); }
.ir-f b { color: var(--fg); }
.ir-n { margin: 0; font-size: var(--fs-tag); color: var(--muted); line-height: 1.6; }
.pl-b { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.pl-bh { font-size: var(--fs-tag); font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.tiers { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 8px; }
.tiers b { font-size: var(--fs-tag); color: var(--sub); margin-right: 2px; }
.tiers span { font-size: var(--fs-tag); background: var(--tile); border-radius: 999px; padding: 2px 9px; color: var(--sub); white-space: nowrap; }
.lg { display: inline-flex; align-items: center; gap: 5px; margin-right: 10px; font-size: var(--fs-tag); color: var(--sub); }
.lg i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tw + .defs, table + .defs { margin-top: 14px; margin-bottom: 0; }

/* ───── 2026-10-18 점검 반영 ───── */
/* 본문 선 아이콘(이모지·✦·⚠ 대신) */
.lic { display: inline-block; vertical-align: -3px; flex: none; }
.warn .lic { vertical-align: -2px; }
/* 칩 색: 광고 = 블루 외곽선(head.html) · 불확실(추정·일부·광고 의심·비공개로 보임) = 회색 점선 · 데이터 경보 = 빨강 · 나쁨 판정 = 하락 주황 */
.tag.p-guess, .tag.p-ad.p-guess { background: var(--tile); color: var(--muted); box-shadow: none; border: 1px dashed var(--line); padding: 2px 7px; }
.tag.st-warn { background: var(--st-danger-soft); color: var(--st-danger); }
.tag.st-bad { background: var(--down-soft); color: var(--down); }
/* 30일 최고 게시물 비교 막대 머리 */
.c3h { font-size: var(--fs-tag); color: var(--muted); font-weight: 600; }
.cmp3 .c3h + .c3r b { color: var(--up); }
.kpi-v small { font-weight: 600; }
/* 연도별 표: 「진행 중」은 연도 아래 줄 */
.yl { display: block; font-size: var(--fs-tag); color: var(--muted); line-height: 1.3; font-weight: 600; }
/* 넓은 표: 오른쪽에 더 있으면 끝을 흐리게(옆으로 밀 수 있다는 표시) */
.tw:not(.end) { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
.chips.fade { -webkit-mask-image: linear-gradient(to right, #000 85%, transparent); mask-image: linear-gradient(to right, #000 85%, transparent); }
#rankTabs { flex-wrap: wrap; }
@media (max-width: 560px) {
  .bcat td { white-space: normal; min-width: 8em; line-height: 1.5; }
  /* 「이 기간 잘 된 게시물」 칩: 한 줄에 하나씩 전체 폭, 배수는 오른쪽 */
  .tr-top { flex-direction: column; align-items: stretch; gap: 6px; flex-wrap: nowrap; }
  .tr-top > span { margin: 0 0 2px; }
  .tr-top button { flex: none; max-width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 8px; }
}
/* 벤치마킹 기회: 기회 하나에 한 줄 + 게시 비중 막대 2개 */
.op-r { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
.op-s { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; font-size: var(--fs-xs); color: var(--sub); font-weight: 400; margin-top: 4px; }
.op-s > span { grid-row: span 2; }
.op-s i { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; display: block; }
.op-s em { display: block; height: 100%; background: var(--ch-b2); }
.op-s em.o { background: var(--ch-ig); }
.op-s small { margin: 0; font-size: var(--fs-tag); white-space: nowrap; }
/* 처방 카드 숫자 행 */
.rx-rows { display: flex; flex-direction: column; gap: 4px; }
.rx-rows > div { display: flex; justify-content: space-between; gap: 10px; }
.rx-rows b { white-space: nowrap; }
/* 잘 되는 조건: 이 조건 / 나머지 미니 막대 */
.rl-s { display: block; color: var(--muted); font-size: var(--fs-tag); }
.cmps { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.cmpb { display: grid; grid-template-columns: 84px minmax(0, 1fr) 92px; gap: 8px; align-items: center; font-size: var(--fs-tag); }
.cmpb .cl { color: var(--sub); white-space: nowrap; } .cmpb .cl small { color: var(--muted); }
.cmpb .ct { height: 8px; background: var(--tile); border-radius: 4px; overflow: hidden; }
.cmpb .ct i { display: block; height: 100%; background: var(--line); border-radius: 4px; }
.cmpb .ct i.up { background: var(--up); } .cmpb .ct i.down { background: var(--down-bar); }
.cmpb .cv { text-align: right; font-weight: 700; color: var(--fg); } .cmpb .cv small { display: block; font-weight: 400; color: var(--muted); }
.rl li em { white-space: nowrap; }
/* 편성 제안: 형식마다 한 줄(형식 · 판정 칩 · 월평균 → 권장) */
.plr-h { display: flex; justify-content: space-between; font-size: var(--fs-tag); color: var(--muted); font-weight: 600; padding: 6px 0; border-bottom: 1px solid var(--line); }
.plr { padding: 8px 0; border-bottom: 1px solid var(--line); }
.plr-m { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; font-size: var(--fs-sm); }
.plr-m b { font-weight: 700; }
.plr .vd { font-size: var(--fs-tag); font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--plane); color: var(--sub); white-space: nowrap; }
.plr .vd.up { background: var(--up-soft); color: var(--up); } .plr .vd.down { background: var(--down-soft); color: var(--down); }
.plr small { display: block; color: var(--muted); font-size: var(--fs-tag); margin-top: 2px; }
/* 오래돼도 크는 콘텐츠: 비율 막대 */
.lt-s2 { margin: 0 0 8px; }
.mbar { height: 8px; background: var(--tile); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.mbar i { display: block; height: 100%; background: var(--jj); border-radius: 4px; }
/* 전체 탭 콘텐츠 역할: 채널 바로가기 칩 */
.go-ch { flex-wrap: wrap; }
.go-ch .chip { background: var(--tile); display: inline-flex; align-items: center; gap: 2px; }
.go-ch .chip small { color: var(--muted); font-weight: 400; }
/* 시즌별 비교 첫 칸: 이름 / 기간 두 줄 */
.tbl td.sn { white-space: normal; min-width: 128px; line-height: 1.45; }
.tbl td.sn small { display: block; color: var(--muted); font-size: var(--fs-tag); }
.tbl th { line-height: 1.35; }
/* 트리맵: 좁은 네모는 숫자 두 줄, 아주 작은 네모는 색만 · 밝은 주황 위 글자는 진하게 */
.tm.narrow .b .r { display: block; }
.tm.xxs .a, .tm.xxs .b { display: none; }
.tm.lt { color: var(--fg); }
.lg-c { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.lg-c .chip { padding: 4px 10px; font-size: var(--fs-tag); cursor: default; }
/* 추출 칩 둘째 줄 */
.tg2 small.cs { display: block; font-size: var(--fs-tag); color: var(--muted); font-weight: 400; line-height: 1.2; }
/* 광고 카드 목록(좁은 화면) · 단가 칩 */
.adc .rk { grid-template-columns: 22px minmax(0, 1fr) auto; }
.adc .rk .tg { grid-column: 2 / -1; }
.adc .rv { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
.adc .rv small { font-size: var(--fs-tag); color: var(--muted); white-space: nowrap; }
.adc-open { list-style: none; padding: 0 0 8px 32px; }
.ad-chips { margin: 10px 0 0; flex-wrap: wrap; }
.ad-chips .chip { cursor: default; font-size: var(--fs-sm); padding: 6px 12px; }
/* 콘텐츠 역할 표: 좁게 */
.tbl.rt td small { font-size: var(--fs-tag); }
/* PC: 하단 탭을 가운데로 모음 */
@media (min-width: 861px) { .bnav .in { max-width: 640px; } }
.adc .rk .t b.ln { display: flex; min-width: 0; }
.adc .rk .t .tx { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--fg); }
.rl li .cmpb .cl small { display: inline; margin: 0; }
.rl li .cmpb .cv small { margin: 0; }
/* 상태 줄과 첫 섹션 사이: 경계선 없애고 간격 좁힘(휴대폰) */
@media (max-width: 860px) {
  .top { border-bottom: 0; }
  .status { padding-top: 6px; padding-bottom: 0; }
  .status + main > .sec:first-child { padding-top: 10px; }
}
/* 성과 진단: 근거 줄 + 비교 막대 */
.sg > div > span { display: block; font-size: var(--fs-sm); color: var(--muted); }
.sg .cmps { margin-top: 8px; }
.sg .cmpb { grid-template-columns: 120px minmax(0, 1fr) 56px; }
.sig > .note { margin-top: 10px; }
.cmp3.s2-c { margin-top: -4px; padding: 0 0 4px; }
.cmp3.dn .c3h + .c3r b { color: var(--down); }
.kpi-t.go { cursor: pointer; }
.kpi-t.go .kgo { float: right; margin-left: 6px; font-size: 1.2em; line-height: 1; opacity: .5; }
@media (hover: hover) { .kpi-t.go:hover { border-color: var(--jj); } .kpi-t.go:first-child:hover { border-color: transparent; box-shadow: 0 14px 28px -12px rgba(0, 84, 148, .7); } }
#wkBy { margin-top: 4px; }
.sg .k { text-align: center; line-height: 1.2; white-space: nowrap; }
/* 30일 최고 칸: 옆 칸과 같은 정사각형 유지 */
.kpi-row .kpi-t.best { min-height: 0; overflow: hidden; }
.kpi-t.best .cmp3 { gap: 3px; padding-top: 6px; }
/* 평소 비교 막대 하나: 채운 막대 = 이 게시물, 세로 눈금 = 평소 */
.c3k { display: flex; justify-content: space-between; gap: 8px; font-size: var(--fs-tag); line-height: 1.3; color: var(--muted); white-space: nowrap; }
.c3k b { font-weight: 700; color: var(--up); }
.cmp3.dn .c3k b { color: var(--down); }
.cmp3 .c3k .c3mk b { color: var(--fg); }
.c3mk::before { content: ""; display: inline-block; width: 2px; height: 10px; margin-right: 4px; vertical-align: -1px; background: var(--fg); border-radius: 1px; }
.c3x { position: relative; height: 8px; margin: 3px 0 4px; border-radius: 999px; background: var(--plane); }
.c3x i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--up); }
.cmp3.dn .c3x i { background: var(--down-bar); }
.c3x s { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--fg); border-radius: 1px; }
/* 접속 키 입력 화면 */
.gate-f { display: flex; gap: 8px; margin: 14px auto 6px; max-width: 420px; }
.gate-f .inp { flex: 1; min-width: 0; font-size: 16px; }
.gate small { display: block; min-height: 1.4em; }
/* API 분석 데이터(2026-10-20): 가로 비율 막대 · 기간 합계 줄 */
.pbl { display: flex; flex-direction: column; gap: 18px; margin: 6px 0 4px; }
.pb-h { display: flex; justify-content: space-between; gap: 12px; font-size: var(--fs-sm, 14px); line-height: 1.4; }
.pb-h > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
.pb-h > span:last-child { flex: none; display: flex; gap: 8px; align-items: baseline; }
.pb-h small { color: var(--muted); font-size: 12px; }
.pb-t { height: 8px; border-radius: 4px; background: var(--plane, #f2f4f6); overflow: hidden; margin-top: 6px; }
.pb-t i { display: block; height: 100%; border-radius: 4px; background: var(--up); }
.dp-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin: 4px 0 10px; }
.dp-top small { display: block; color: var(--muted); font-size: 13px; }
.dp-top b { display: block; font-size: 26px; font-weight: 800; line-height: 1.3; }
.dp-top span.up, .dp-top span.down, .dp-top span.flat { font-size: 13px; font-weight: 700; }
.wait.sm { padding: 18px; font-size: 14px; }
.mgrid small.mu { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 4px; }
/* 판정 칩(최근 게시물 · 밤 브리핑과 같은 단계, 2026-10-20) */
.race-t > .rt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
@media (hover: hover) { .race-l li:hover .race-t > .rt { text-decoration: underline; text-underline-offset: 3px; } }
.tier { flex: none; margin-left: 10px; padding: 3px 9px; border-radius: 999px; font-size: 13px; font-weight: 700; line-height: 1.5; white-space: nowrap; }
.tier.lo { background: var(--down-soft); color: var(--down); }
.tier.mid, .tier.na { background: var(--line); color: var(--muted); }
.tier.hi { background: var(--up-soft); color: var(--up); }
.tier.hi2 { background: var(--up); color: #fff; }
.tier.hi3 { background: linear-gradient(135deg, var(--jj), var(--navy)); color: #fff; }
/* 접은 칸(콘텐츠 목록 · 연도별 표 · 용어 뜻) */
details.fold { margin-top: 14px; border-top: 1px solid var(--line); }
details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 14px 0 2px; font-size: var(--fs-sm); font-weight: 700; color: var(--fg); }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary small { font-weight: 500; color: var(--muted); }
details.fold > summary::after { content: '›'; margin-left: auto; color: var(--muted); font-size: 18px; transition: transform .15s; }
details.fold[open] > summary::after { transform: rotate(90deg); }
details.fold[open] > summary { padding-bottom: 10px; }
/* 점검할 것: 채널마다 한 줄(분류 + 판정 칩) */
.irs .ir { flex-direction: row; align-items: flex-start; gap: 12px; padding: 12px 14px; }
.irs .ir > .bd, .irs .ir > span:first-child { flex: none; margin-top: 2px; }
.irs .ir-g { flex: 1; min-width: 0; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.irs .ir-c { flex-direction: row; align-items: center; gap: 8px; }
.irs .ir-c > b { flex: 1; min-width: 0; font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.irs .ir-c .ir-l { flex: none; width: 56px; }
.irs .ir-c .tier { margin-left: 0; }
.irs .ir-f { flex: 1; align-items: center; }
.irs .ir-f .ir-l { background: none; padding: 4px 0; font-size: var(--fs-tag); }
/* 누가 보나 · 팔로워는 누구인가: 구분마다 100% 막대 한 줄 */
.stk { padding: 12px 0; border-top: 1px solid var(--line); }
.stk:first-of-type { border-top: 0; }
.stk-n { display: block; font-size: var(--fs-sm); font-weight: 700; margin-bottom: 8px; }
.stk.one { display: flex; align-items: baseline; justify-content: space-between; }
.stk.one .stk-n { margin: 0; }
.stk.one span:last-child { font-size: var(--fs-sm); color: var(--sub); }
.stk-b { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--line); }
.stk-b i { display: block; height: 100%; min-width: 3px; }
.stk-l { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: var(--fs-xs); color: var(--sub); line-height: 1.7; }
.stk-l span { display: inline-flex; align-items: center; gap: 5px; }
.stk-l em { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.stk-l b { color: var(--fg); }
/* 최근 스토리: 한 줄 = 올린 때 · 조회 막대 · 조회 · 판정 칩 */
.stl { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.stl-r { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; font-size: var(--fs-sm); }
.stl-d { color: var(--sub); white-space: nowrap; font-size: var(--fs-xs); }
.stl-b { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.stl-b i { display: block; height: 100%; border-radius: 5px; }
.stl-r b { min-width: 44px; text-align: right; }
.stl-r .tier { margin-left: 0; font-size: 12px; padding: 2px 8px; }
#mTbl td:first-child { white-space: normal; min-width: 240px; } #mTbl td:first-child .tag { white-space: nowrap; margin-top: 4px; }
/* 탐색 네모 그림: 묶는 기준 */
.tm-by { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 12px; font-size: var(--fs-xs); }
.tm-by .seg { margin: 0; }
.tm-sel { font-size: var(--fs-sm); }
/* 오늘(2026-10-20): 홈 맨 위 지금 값. 강조 면은 아래 「이번 주」 첫 칸 하나만이라 여기 칸은 평범하게 */
.td-sec .kpi-row { margin-top: 2px; }
.td-sec .kpi-t:first-child { background: var(--bg); border: 1px solid var(--line); box-shadow: none; color: inherit; }
.td-sec .kpi-t:first-child .kpi-l { color: var(--sub); }
.td-sec .kpi-t:first-child .kpi-v { color: var(--fg); }
.td-sec .kpi-t:first-child .kpi-s, .td-sec .kpi-t:first-child .kpi-s .flat { color: var(--muted); }
.td-sec .kpi-t:first-child .kpi-s .up { color: var(--up); }
.td-sec .kpi-t:first-child .kpi-s .down { color: var(--down); }
.td-sec .race-l li small { color: var(--muted); font-size: var(--fs-tag); line-height: 1.6; }
.td-since { align-self: center; font-size: var(--fs-tag); color: var(--muted); white-space: nowrap; }
.dp-top span { display: block; font-size: 13px; color: var(--sub); margin-top: 2px; }
/* 댓글 목록(답 안 한 댓글 · 공감 많은 댓글) */
.cml { list-style: none; margin: 4px 0 0; padding: 0; }
.cml li { border-top: 1px solid var(--line); }
.cml li:first-child { border-top: 0; }
.cml li > a, .cml li { display: flex; flex-direction: column; gap: 2px; padding: 10px 0; color: inherit; text-decoration: none; min-width: 0; }
.cml li > a { padding: 0; }
.cml-t { font-size: var(--fs-sm); line-height: 1.6; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; }
.cml small { font-size: var(--fs-tag); color: var(--muted); }
@media (hover: hover) { .cml a:hover .cml-t { text-decoration: underline; text-underline-offset: 3px; } }
/* 오늘 칸 아래 그래프(2026-10-20 「밋밋하다」): 칸 바닥에 붙임 */
.td-sec .kspark, .td-sec .kbars { margin-top: auto; padding-top: 10px; }
.kbars { display: block; width: 100%; height: 38px; overflow: visible; }
.kbars rect { fill: var(--jj); opacity: .28; }
.kbars rect.on { opacity: 1; }
.td-foot { margin-top: 6px; font-size: var(--fs-tag); color: var(--muted); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.td-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.td-bt { position: relative; height: 6px; border-radius: 999px; background: var(--plane); }
.td-bt i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--up); }
.td-bt i.down { background: var(--down-bar, var(--down)); }
.td-bt s { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--muted); border-radius: 1px; }
.td-bar b { font-size: var(--fs-tag); white-space: nowrap; }
.td-ch { margin-top: 18px; }
/* 이번 주(달력 주) 칸 막대: 회색 = 지난주 같은 요일, 진한 = 오늘 · 요일 글자 */
.kbars.wk rect { fill: var(--jj); opacity: .45; }
.kbars.wk rect.pv { fill: var(--muted); opacity: .22; }
.kbars.wk rect.on { opacity: 1; }
.kbars.pm rect.up { fill: var(--up); opacity: .8; }
.kbars.pm rect.dn { fill: var(--down); opacity: .8; }
.kbars .zl { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.kpi-t .kbars { margin-top: auto; padding-top: 10px; }
.kb-l { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 4px; font-size: 11px; color: var(--muted); text-align: center; }
.kb-l .on { color: var(--fg); font-weight: 700; }
.kpi-t:first-child .kbars.wk rect, .kpi-t:first-child .kbars.wk rect.on { fill: #fff; }
.kpi-t:first-child .kbars.wk rect.pv { fill: #fff; opacity: .25; }
.kpi-t:first-child .kb-l, .kpi-t:first-child .kb-l .on { color: rgba(255, 255, 255, .85); }
.td-sec .kpi-t:first-child .kbars rect { fill: var(--jj); }
.tdots { margin-top: auto; padding-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.tdots i.tier { width: 14px; height: 14px; padding: 0; margin: 0; border-radius: 50%; display: block; }
/* 지금 볼 것 */
.wa { margin-top: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px 8px; }
.wa-r { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; padding: 11px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font: inherit; color: inherit; }
.wa-r:first-of-type { border-top: 0; }
button.wa-r { cursor: pointer; }
.wa-d { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.wa-r.good .wa-d { background: var(--up); }
.wa-r.bad .wa-d { background: var(--down); }
.wa-t { font-size: var(--fs-sm); line-height: 1.6; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.wa-r b { font-size: var(--fs-sm); white-space: nowrap; }
.wa-r.good b { color: var(--up); }
.wa-r.bad b { color: var(--down); }
@media (hover: hover) { button.wa-r:hover .wa-t { text-decoration: underline; text-underline-offset: 3px; } }
.co-x { align-self: flex-start; margin-top: 4px; font-size: var(--fs-tag); font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--tile); }
/* 공동작업 표시(2026-10-21): 학과·기관 협업(p-col)과 구분되게 테두리만 */
.tag.p-co { background: transparent; color: var(--ch-ig, var(--sub)); box-shadow: inset 0 0 0 1px currentColor; }
/* 숫자 칸이 2개뿐인 줄(예: 오늘 칸 유튜브, 2026-10-21): 반폭 정사각형이 너무 커서, 4칸 줄과 같은 높이가 되게 가로로 긴 칸 */
@media (min-width: 561px) { .kpi-row.n2 .kpi-t { aspect-ratio: 2 / 1; } }
/* 첫날 평소까지 진행률(2026-10-21): 아직 덜 모인 게시물은 회색 막대 */
.td-bt i.pg { background: var(--muted); opacity: .55; }

/* 오늘 칸: 칸에 못 들어간 팔로워·구독자 작은 칸, 오늘 게시물 없을 때 마지막 게시·게시 예정(2026-10-22) */
.td-acct { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.td-acct > div { background: var(--plane); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ta-l { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ta-l::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--c); margin-right: 5px; vertical-align: 2px; }
.td-acct b { font-size: 17px; color: var(--fg); font-weight: 700; letter-spacing: -0.01em; }
.td-acct b small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 1px; }
.td-acct em { font-style: normal; font-size: 12px; white-space: nowrap; }
.td-acct em i { font-style: normal; color: var(--muted); }
.td-last { margin: 14px 2px 0; font-size: var(--fs-tag); color: var(--sub); line-height: 1.6; }
.td-last em { font-style: normal; font-weight: 700; }
.td-plan { margin-top: 12px; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 6px; }
.tp-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.tp-h h3 { font-size: 15px; color: var(--fg); font-weight: 700; margin: 0; }
.tp-h span { font-size: 12px; color: var(--muted); }
.td-plan ol { list-style: none; margin: 0; padding: 0; }
.td-plan li { border-top: 1px solid var(--line); }
.td-plan li > a, .td-plan li > div { display: grid; grid-template-columns: 4.2em auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 0; font-size: 14px; color: var(--fg); text-decoration: none; }
.td-plan li > a:active { opacity: .6; }
.tp-go { color: var(--muted); font-size: 18px; line-height: 1; }
.td-plan li > a, .td-plan li > div { grid-template-columns: 4.2em auto minmax(0, 1fr) auto auto; }
.tp-k i.ok { color: #fff; background: var(--c); box-shadow: none; }
.tp-ok { font-size: 12px; font-weight: 700; color: var(--up); background: var(--plane); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.td-plan li.done .tp-t { color: var(--muted); }
.td-plan li:first-child { border-top: 0; }
.tp-d { color: var(--muted); font-size: 13px; white-space: nowrap; }
.td-plan li.now .tp-d { color: var(--up); font-weight: 700; }
.tp-k { display: flex; gap: 4px; }
.tp-k i { font-style: normal; font-size: 11px; font-weight: 700; color: var(--c); box-shadow: inset 0 0 0 1px var(--c); border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
.tp-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 오늘 시간별 조회: 채널별 그래프 머리(2026-10-22) */
.td-chh { margin: 10px 0 2px; }
.td-chh + .chart { margin-top: 0; }

/* 이번 주 게시물: 볼 값 고르기(2026-10-22) */
.race-m { display: inline-flex; align-items: center; position: relative; }
.race-m select { appearance: none; -webkit-appearance: none; font: inherit; font-weight: 700; color: var(--fg); background: var(--plane); border: 0; border-radius: 999px; padding: 4px 24px 4px 11px; cursor: pointer; }
.race-m::after { content: "\25BE"; position: absolute; right: 9px; pointer-events: none; color: var(--muted); font-size: 11px; }
.race-m select:focus-visible { outline: 2px solid var(--up); outline-offset: 2px; }
.race-h .race-m { align-self: center; }
.race-d { margin: 0 0 4px; font-size: var(--fs-tag); color: var(--muted); }
.race-m select { padding-right: 22px; }
.race-m select { font-size: 14px; padding: 5px 22px 5px 12px; }

/* 점검 B(2026-10-22): 홈 아래 구역 접기 · 값 없는 첫 칸은 강조 안 함 · 홀수 칸은 마지막 칸을 넓게 */
.home-more { margin-top: 16px; }
.home-more > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 10px; padding: 16px 18px; background: var(--tile); border: 1px solid var(--line); border-radius: 16px; }
.home-more > summary::-webkit-details-marker { display: none; }
.home-more > summary b { font-size: var(--fs-md); color: var(--fg); }
.home-more > summary span { font-size: var(--fs-tag); color: var(--muted); flex: 1; min-width: 0; }
.home-more > summary::after { content: "\25BE"; color: var(--muted); }
.home-more[open] > summary::after { content: "\25B4"; }
.kpi-t.kpi-none:first-child { background: var(--tile); color: inherit; box-shadow: none; border-color: var(--line); }
.kpi-t.kpi-none:first-child .kpi-l { color: var(--sub); }
.kpi-t.kpi-none:first-child .kpi-s { color: var(--muted); }
