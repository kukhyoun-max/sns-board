<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>전주대 SNS 성과 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* 구성: 브리핑 → 콘텐츠 전략 → 제작·홍보대사 → 입시 시즌 → 타 대학 → 콘텐츠 탐색 → 데이터 추출 (상단 텍스트 탭) · 콘텐츠 상세는 전체 화면 패널 · 색은 전주대 UI 컬러 */
:root {
  --bg: #ffffff;
  --plane: #f2f4f6;
  --tile: #f9fafb;
  --fg: #191f28;
  --sub: #4e5968;
  --muted: #8b95a1;
  --line: #e5e8eb;
  /* 전주대학교 UI 컬러 — 메인 JJ 블루 #0078AD, 서브 골드 #CAAE65 · 퍼플 #8F7EAB · 그린 #83B093 · 코랄 #D1906A */
  --jj: #0078ad;
  --navy: #005494;
  --up: #0078ad;
  --up-soft: #e4f1f8;
  --down: #a5822a;
  --down-soft: #f6f0de;
  --ok: #3f8a5e;
  --ok-soft: #e8f3ec;
  --ai: #6f5f9e;
  --ai-soft: #efecf6;
  --coral: #c0673b;
  --coral-soft: #fbeee6;
  --ch-ig: #c0673b;
  --ch-yt: #005494;
  --ch-hong: #3f8a5e;
  --ch-b1: #8f7eab;
  --ch-b2: #a5822a;
  --ch-b3: #6b7684;
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17171c; --plane: #101013; --tile: #202027; --fg: #f2f3f5; --sub: #c3c8cf; --muted: #8b929c; --line: #2c2c35;
    --up: #4fb0dd; --up-soft: #12293a; --down: #d8b55a; --down-soft: #2f2915; --ok: #6fbf8d; --ok-soft: #15301f; --ai: #ab9dd6; --ai-soft: #252036; --coral: #e39a72; --coral-soft: #35221a; --jj: #4fb0dd; --navy: #6fa3d6;
    --ch-ig: #e39a72; --ch-yt: #6fa3d6; --ch-hong: #6fbf8d; --ch-b1: #ab9dd6; --ch-b2: #d8b55a; --ch-b3: #9aa4b1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17171c; --plane: #101013; --tile: #202027; --fg: #f2f3f5; --sub: #c3c8cf; --muted: #8b929c; --line: #2c2c35;
  --up: #4fb0dd; --up-soft: #12293a; --down: #d8b55a; --down-soft: #2f2915; --ok: #6fbf8d; --ok-soft: #15301f; --ai: #ab9dd6; --ai-soft: #252036; --coral: #e39a72; --coral-soft: #35221a; --jj: #4fb0dd; --navy: #6fa3d6;
  --ch-ig: #e39a72; --ch-yt: #6fa3d6; --ch-hong: #6fbf8d; --ch-b1: #ab9dd6; --ch-b2: #d8b55a; --ch-b3: #9aa4b1;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--plane); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--jj); outline-offset: 2px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }

.app { max-width: 1080px; margin: 0 auto; background: var(--bg); min-height: 100vh; }
.sec { background: var(--bg); padding: 24px clamp(16px, 4vw, 32px); }
.gap { height: 12px; background: var(--plane); }

/* 상단 탭 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); padding: 14px clamp(16px, 4vw, 32px) 0; display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.top::-webkit-scrollbar { display: none; }
.tt { background: none; border: 0; padding: 4px 0 12px; font-size: 22px; font-weight: 800; color: #b0b8c1; cursor: pointer; white-space: nowrap; letter-spacing: -0.02em; }
.tt[aria-selected="true"] { color: var(--fg); }
.status { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 16px clamp(16px, 4vw, 32px) 4px; background: var(--bg); }
.status .st { display: flex; gap: 16px; color: var(--sub); font-size: 14px; }
.status .st span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 2px; }
.status .st span.live::before { background: var(--ok); }
.seg { display: inline-flex; background: var(--plane); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 14px; color: var(--muted); cursor: pointer; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* 지수 카드 */
.idx { display: flex; gap: 12px; overflow-x: auto; padding: 14px clamp(16px, 4vw, 32px) 20px; background: var(--bg); scroll-snap-type: x mandatory; scrollbar-width: none; }
.idx::-webkit-scrollbar { display: none; }
.ic { flex: 0 0 240px; scroll-snap-align: start; background: var(--tile); border-radius: 20px; padding: 18px 18px 16px; border: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.ic:hover { background: var(--plane); }
.ic .nm { font-size: 17px; font-weight: 700; }
.ic .cp { font-size: 13px; color: var(--muted); }
.ic canvas { width: 100% !important; height: 64px !important; margin: 8px 0 6px; }
.ic .v { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.ic .d { font-size: 15px; font-weight: 600; }

/* 한 줄 요약 */
.brief { padding: 4px clamp(16px, 4vw, 32px) 24px; background: var(--bg); }
.brief .lb { font-size: 15px; font-weight: 700; color: var(--ai); }
.brief .lb small { color: var(--muted); font-weight: 500; margin-left: 6px; font-size: 14px; }
.brief button { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; background: none; border: 0; padding: 6px 0 0; text-align: left; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; cursor: pointer; }
.brief ul { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.brief li { font-size: 15px; color: var(--sub); padding-left: 14px; position: relative; }
.brief li::before { content: ""; position: absolute; left: 0; top: 10px; width: 5px; height: 5px; border-radius: 50%; background: var(--ai); }
.chev { color: var(--muted); font-size: 20px; flex: none; transition: transform .15s; }

/* 섹션 머리 */
.sh { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.sh h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.sh p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }

/* 분류 칩 */
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: none; padding: 9px 14px; border-radius: 12px; font-size: 15px; font-weight: 600; color: var(--sub); cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--plane); color: var(--fg); }
.chip b { font-weight: 600; margin-left: 4px; }

/* 트리맵 */
.tree { position: relative; height: 380px; border-radius: 8px; overflow: hidden; }
.tm { position: absolute; border: 2px solid var(--bg); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4px 6px; color: #fff; cursor: pointer; overflow: hidden; }
.tm:hover { filter: brightness(1.08); }
.tm .a { font-size: 15px; font-weight: 700; line-height: 1.3; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tm .b { font-size: 14px; font-weight: 500; opacity: .95; }
.tm.s .a { font-size: 12.5px; }
.tm.s .b { font-size: 12px; }
.tm.xs .b { display: none; }
.legend { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); gap: 10px; flex-wrap: wrap; }
.scale { display: flex; gap: 2px; align-items: center; }
.scale i { width: 22px; height: 10px; border-radius: 2px; display: inline-block; }
.more { display: block; width: 100%; margin-top: 14px; border: 0; background: none; color: var(--sub); font-size: 15px; padding: 10px; cursor: pointer; }

/* 순위 목록 */
.rank { list-style: none; margin: 0; padding: 0; }
.rk { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 12px 0; cursor: pointer; border-radius: 12px; }
.rk:hover { background: var(--tile); }
.rk .no { font-size: 17px; font-weight: 700; color: var(--sub); text-align: center; }
.av { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 13px; letter-spacing: -0.02em; flex: none; }
.rk .t { min-width: 0; }
.rk .t b { display: block; font-size: 16px; font-weight: 600; margin-bottom: 2px; }
.rk .t span { font-size: 14px; color: var(--muted); }
.rk .t span em { font-style: normal; font-weight: 600; }
.rk .tg { display: flex; gap: 4px; justify-content: flex-end; }

/* 태그 */
.tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--plane); color: var(--sub); white-space: nowrap; }
.tag.p-amb { background: var(--ok-soft); color: var(--ok); }
.tag.p-ad { background: var(--coral-soft); color: var(--coral); }
.tag.p-own { background: var(--up-soft); color: var(--navy); }
.tag.p-ugc { background: var(--ai-soft); color: var(--ai); }
.tag.p-col { background: var(--down-soft); color: var(--down); }
/* 채널 배너 */
.chb { display: inline-flex; align-items: center; flex: none; font-size: 11.5px; font-weight: 800; letter-spacing: -0.01em; line-height: 1; padding: 4px 7px; border-radius: 5px; color: #fff; background: var(--c); margin-right: 7px; vertical-align: 2px; }
.ln { display: flex; align-items: center; min-width: 0; }
.ln > .tx { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rk .t .ln .chb { color: #fff; font-size: 11.5px; }
.rk .t .ln .tx { color: var(--fg); font-size: 16px; }

/* 분석 표 */
.ana { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; }
@media (max-width: 860px) { .ana { grid-template-columns: minmax(0, 1fr); } }
.ana h3 { margin: 0 0 10px; font-size: 17px; font-weight: 700; }
.bars { display: flex; flex-direction: column; gap: 4px; }
.br { display: grid; grid-template-columns: 150px minmax(0, 1fr) 64px; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 8px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.br:hover { background: var(--tile); }
.br .l { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.br .l small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.br .tr { height: 22px; background: var(--tile); border-radius: 6px; position: relative; overflow: hidden; }
.br .tr i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
.br .tr .mid { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); opacity: .35; }
.br .v { font-size: 14px; font-weight: 700; text-align: right; }
.note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }

/* 표 */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 14px; }
th, td { padding: 11px 8px; border-bottom: 1px solid var(--line); text-align: left; }
th { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
th button { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font-weight: 600; }
th button[data-dir]::after { content: " ↓"; color: var(--jj); }
th button[data-dir="asc"]::after { content: " ↑"; }
td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--tile); }
td.tt2 { max-width: 420px; }

/* 상세 패널 */
.detail { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; }
.dwrap { max-width: 760px; margin: 0 auto; padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.dh { position: sticky; top: 0; z-index: 2; background: var(--bg); display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; }
.dh button { width: 44px; height: 44px; border: 0; background: none; font-size: 26px; cursor: pointer; border-radius: 12px; }
.dh button:hover { background: var(--tile); }
.dh .ctr { text-align: center; min-width: 0; }
.dh .ctr small { display: block; font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dh .ctr b { font-size: 16px; font-weight: 700; }
.dtabs { display: flex; gap: 22px; padding: 0 20px; border-bottom: 1px solid var(--line); position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); background: var(--bg); z-index: 2; }
.dtabs button { border: 0; background: none; padding: 10px 0 12px; font-size: 17px; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; }
.dtabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }
.dsec { padding: 22px 20px; }
.dtitle { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.4; margin: 0 0 10px; }
.dtitle .chb { font-size: 12.5px; padding: 5px 8px; }
.dbig { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
.dbig small { font-size: 17px; font-weight: 700; margin-left: 8px; }
.dtags { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
.cmp { position: relative; height: 230px; margin-top: 16px; }
.dper { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
.dper span { font-size: 14px; color: var(--muted); padding: 6px 12px; border-radius: 10px; }
.dper span.on { background: var(--plane); color: var(--fg); font-weight: 700; }
.why .lb { color: var(--ai); font-weight: 700; font-size: 16px; display: flex; justify-content: space-between; }
.why .lb small { color: var(--muted); font-weight: 500; font-size: 14px; }
.why p { margin: 8px 0 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.5; }
.sig h3 { margin: 0 0 4px; font-size: 22px; font-weight: 800; }
.sig .h { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
.sg { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 0; }
.sg .k { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
.sg .k.good { background: var(--up-soft); color: var(--up); }
.sg .k.bad { background: var(--coral-soft); color: var(--coral); }
.sg .k.info { background: var(--plane); color: var(--sub); }
.sg b { font-size: 17px; font-weight: 600; display: block; letter-spacing: -0.01em; color: var(--fg); }
.sg span span { display: block; }
.sg span { font-size: 14px; color: var(--muted); }
.mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; }
.mgrid div { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 16px; gap: 10px; }
.mgrid div:nth-child(odd) { margin-right: 14px; }
.mgrid span { color: var(--sub); }
.mgrid b { font-weight: 700; font-variant-numeric: tabular-nums; }
.caption { white-space: pre-wrap; font-size: 15px; color: var(--sub); background: var(--tile); border-radius: 14px; padding: 14px 16px; margin: 0; }
.cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.cta a, .cta span { display: block; max-width: 720px; margin: 0 auto; text-align: center; padding: 16px; border-radius: 16px; font-size: 17px; font-weight: 700; text-decoration: none; }
.cta a { background: var(--jj); color: #fff; }
.cta span { background: var(--plane); color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 15px; }
@media (max-width: 560px) {
  .tt { font-size: 20px; }
  .tree { height: 320px; }
  .rk { grid-template-columns: 22px minmax(0, 1fr); gap: 10px; }
  .av { width: 42px; height: 42px; }
  .rk .tg { display: none; }
  .mgrid { grid-template-columns: minmax(0, 1fr); }
  .mgrid div:nth-child(odd) { margin-right: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ───── v4 추가 ───── */
.tag.p-ws { background: var(--down-soft); color: var(--down); }
.tag.p-col { background: var(--plane); color: var(--sub); }
.ctl { display: flex; gap: 8px; flex-wrap: wrap; }
.view-sub { padding: 2px clamp(16px, 4vw, 32px) 0; background: var(--bg); color: var(--muted); font-size: 14px; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .kpis { grid-template-columns: minmax(0, 1fr); } }
.kpi { background: var(--tile); border-radius: 18px; padding: 18px 18px 16px; min-width: 0; }
.kpi .l { font-size: 14px; color: var(--sub); font-weight: 600; }
.kpi .v { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 14px; color: var(--muted); margin-top: 2px; }
.kpi .s b { font-weight: 700; }

/* 두 칸 */
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; }
@media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }
.two h3, .sec h3.sub { margin: 0 0 6px; font-size: 17px; font-weight: 700; }
.two p.d, .sec p.d { margin: 0 0 8px; font-size: 13px; color: var(--muted); }

/* 일반 표 */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
.tbl th, .tbl td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.tbl td.w { white-space: normal; min-width: 160px; max-width: 320px; }
.tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover { background: var(--tile); }
.tbl tr.on { background: var(--up-soft); }
.tbl .spark { width: 110px; height: 30px; }
.tbl.compact { min-width: 0; }
.tbl .ellip { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }

/* 매트릭스 */
.mx { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 520px; font-size: 14px; }
.mx th { font-size: 13px; color: var(--sub); font-weight: 700; padding: 6px 8px; text-align: center; white-space: nowrap; }
.mx th.r { text-align: left; width: 120px; }
.mx td { min-width: 76px; }
.mx td { border-radius: 10px; text-align: center; padding: 10px 6px; cursor: pointer; font-variant-numeric: tabular-nums; border: 2px solid transparent; }
.mx td b { display: block; font-size: 16px; font-weight: 800; }
.mx td small { font-size: 12px; opacity: .85; }
.mx td.few { background: var(--tile); color: var(--muted); }
.mx td.none { background: transparent; cursor: default; color: var(--line); }
.mx td.sel { border-color: var(--fg); }
.mx td.tot { background: var(--plane); color: var(--sub); cursor: default; }
.mxleg { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 8px; }
.mxleg i { display: inline-block; width: 18px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

.role { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
.role.reach { background: var(--up-soft); color: var(--navy); }
.role.save { background: var(--down-soft); color: var(--down); }
.role.share { background: var(--ok-soft); color: var(--ok); }
.role.talk { background: var(--ai-soft); color: var(--ai); }
.role.avg { background: var(--plane); color: var(--muted); }

.chart { position: relative; height: 240px; }

/* 입시 시즌 선택 */

@media (max-width: 640px) { .fx { grid-template-columns: minmax(0, 1fr); gap: 4px 0; } .fx > .k { margin-top: 10px; } }

.inp.wide { flex: 1 1 220px; }

.xsum { font-size: 15px; font-weight: 600; margin: 4px 0 12px; line-height: 1.6; }

.xbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.xbar .sp { flex: 1; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 80; }
.preset { display: flex; gap: 6px; flex-wrap: wrap; }
.hint { font-size: 13px; color: var(--muted); }
.cb { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--sub); cursor: pointer; }

/* 하단 내비 (토스형) */
.app { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
.bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bnav .in { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.bnav button { border: 0; background: none; padding: 9px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font: inherit; font-size: 12px; font-weight: 600; color: #b0b8c1; cursor: pointer; }
.bnav button svg { width: 25px; height: 25px; }
.bnav button[aria-current="page"] { color: var(--fg); }
.bnav button[aria-current="page"] svg { stroke-width: 2.4; }
.bnav button:focus-visible { outline-offset: -4px; }

/* 채널 현황 차트 (토스형) */
.cs-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.cs-t { font-size: 15px; font-weight: 700; color: var(--sub); }
.cs-big { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; margin-top: 2px; }

.cs-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

.cs-chart { position: relative; height: 270px; margin-top: 6px; }
@media (max-width: 560px) { .cs-chart { height: 230px; } .cs-big { font-size: 28px; } }
.cs-per { display: flex; justify-content: space-between; align-items: center; gap: 6px 12px; flex-wrap: wrap; margin-top: 8px; }
.cs-per .pp { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.cs-per .pp button { border: 0; background: none; padding: 7px 11px; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer; }

.cs-per .sep { width: 1px; height: 16px; background: var(--line); margin: 0 6px; }

.cpick { background: var(--tile); border-radius: 14px; padding: 12px 14px; margin-top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 15px; }
.cpick .btn { padding: 8px 14px; font-size: 14px; }
.btn.sm { padding: 8px 13px; font-size: 14px; white-space: nowrap; flex: none; }

/* 광고 포함 토글 */
.adtg { font: inherit; font-size: 14px; font-weight: 700; border: 1px solid var(--line); background: var(--bg); color: var(--sub); border-radius: 10px; padding: 6px 12px 6px 30px; cursor: pointer; position: relative; }
.adtg::before { content: ""; position: absolute; left: 10px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 4px; border: 2px solid var(--muted); box-sizing: border-box; }
.adtg[aria-pressed="true"] { border-color: var(--coral); color: var(--coral); background: var(--coral-soft); }

.ctl { align-items: center; }

/* 가로 스크롤 표: 첫 열(제목) 고정 */

.tw.scrolled table th:first-child::after, .tw.scrolled table td:first-child::after { opacity: 1; }
.tw table tr:hover td:first-child, .tw table tr.click:hover td:first-child { background: var(--tile); }

@media (max-width: 640px) {
  .tw table td:first-child, .tw table th:first-child { max-width: 46vw; }

}
#tbody td { white-space: nowrap; }
#tbody td.tt2 { max-width: 300px; }
.tw .mx th.r { box-shadow: 4px 0 0 var(--bg); }

<body>
<div class="app" id="app">
  <nav class="top" role="tablist" id="tabs" aria-label="채널"></nav>
  <div class="status">
    <div class="st"><span id="st1">데이터 불러오는 중</span><span id="st2"></span></div>
    <div class="ctl"><button type="button" class="adtg" id="adTg" aria-pressed="false" hidden>광고 제외</button><div class="seg" id="rangeSeg" aria-label="게시 기간" hidden></div></div>
  </div>
  <main id="view"></main>
  <div class="gap"></div>
</div>

<nav class="bnav" id="bnav" aria-label="화면"></nav>

<div class="detail" id="detail" hidden role="dialog" aria-modal="true" aria-label="콘텐츠 상세"></div>

<script>window.SNS_API_URL = "https://script.google.com/macros/s/AKfycbyGL0h1nmGMIMiG0KsZksAyOUaxcdwKiXLysmB2ExGLEhVX3eUiwmRbv7uTPhsWf6Q6/exec";</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
(function () {
  // ───────── 기본값 ─────────
  const OWN = ['인스타그램', '유튜브', 'hong._.video'];
  const CH_VAR = { '인스타그램': '--ch-ig', '유튜브': '--ch-yt', 'hong._.video': '--ch-hong' };
  const CH_BADGE = { '인스타그램': '인스타', '유튜브': '유튜브', 'hong._.video': 'hong', 'jbnu1947': '전북대', 'wonkwang_univ': '원광대', 'woosukuni': '우석대' };
  const PROD_CLASS = { '홍보대사': 'p-amb', '광고': 'p-ad', '자체 제작': 'p-own', '학생 크리에이터': 'p-ugc', '학과·기관 협업': 'p-col', '근로장학생': 'p-ws' };
  const PRODS = ['자체 제작', '홍보대사', '근로장학생', '학생 크리에이터', '학과·기관 협업'];
  const RANGES = [['30', '1달'], ['90', '3달'], ['365', '1년'], ['all', '전체']];
  const MN = ['조회수', '좋아요', '댓글', '공유', '저장'];
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  const HIT = 1.5; // 히트 = 채널 평소(최근 1년 중앙값)의 1.5배 이상
  const VIEWS = [['brief', '홈'], ['strategy', '전략'], ['maker', '제작·사람'], ['season', '입시'], ['explore', '탐색'], ['export', '추출']];
  const TABS = ['전체', '인스타그램', '유튜브', 'hong._.video', '타 대학'];
  const ICONS = {
    brief: '<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/>',
    strategy: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
    maker: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6c2.4.1 4 1.7 4.5 4.4"/>',
    season: '<path d="M2.5 9 12 4.5 21.5 9 12 13.5z"/><path d="M6.5 11v4.5c1.5 1.6 3.4 2.5 5.5 2.5s4-.9 5.5-2.5V11"/><path d="M21.5 9v5"/>',
    explore: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',
    export: '<path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4.5 19.5h15"/>',
  };
  const STORE = 'jj-sns-board-v6';
  const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  let D = null, charts = {};
  const S = { ads: false, view: 'brief', ch: '전체', range: '365', trendCh: '인스타그램', g: null, rankBy: 'views', sort: null, rankShown: 10, tblShown: 30, mx: null, person: null, roleF: '전체', season: null, psort: 'n' };

  const $ = id => document.getElementById(id);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const fmt = n => (n == null || isNaN(n)) ? '–' : Math.round(n).toLocaleString('ko-KR');
  const fmtK = n => {
    if (n == null || isNaN(n)) return '–';
    const a = Math.abs(n);
    if (a >= 1e8) return (n / 1e8).toFixed(1).replace(/\.0$/, '') + '억';
    if (a >= 1e4) return (n / 1e4).toFixed(a >= 1e5 ? 0 : 1).replace(/\.0$/, '') + '만';
    return Math.round(n).toLocaleString('ko-KR');
  };
  const pct = v => (v == null || isNaN(v)) ? '–' : (v * 100).toFixed(1) + '%';
  const pctA = v => (v == null || isNaN(v)) ? '–' : (v * 100).toFixed(Math.abs(v) < 0.01 ? 2 : 1) + '%';
  const pct0 = v => (v == null || isNaN(v)) ? '–' : Math.round(v * 100) + '%';
  const xf = v => (v == null || isNaN(v)) ? '–' : v.toFixed(1) + '배';
  const sgn = v => (v > 0 ? '+' : '');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5);
  const median = a => { const s = a.filter(v => v != null && !isNaN(v)).sort((x, y) => x - y); if (!s.length) return null; const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const sum = a => a.reduce((s, v) => s + (v == null || isNaN(v) ? 0 : v), 0);
  const mean = a => { const f = a.filter(v => v != null && !isNaN(v)); return f.length ? sum(f) / f.length : null; };
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify({ view: S.view, ch: S.ch, range: S.range, trendCh: S.trendCh, ads: S.ads })); } catch (e) {} };
  const load = () => { try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; } };
  const mdLabel = d => (+d.slice(5, 7)) + '월 ' + (+d.slice(8, 10)) + '일';
  const dot = d => d.slice(2).replace(/-/g, '.');
  const toast = msg => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); };

  // ───────── 값 ─────────
  const last = it => { for (let i = it.h.length - 1; i >= 0; i--) if (it.h[i]) return it.h[i]; return null; };
  const val = (it, m) => { const v = last(it); return v ? v[m] : null; };
  const weekly = () => D.dates.length > 1;
  const incAt = (it, i, m) => {
    if (i <= 0 || !it.h[i]) return null;
    const cur = it.h[i][m]; if (cur == null) return null;
    const prev = it.h[i - 1];
    if (!prev) return it.d > D.dates[i - 1] ? cur : null;
    return prev[m] == null ? null : cur - prev[m];
  };
  const inc = (it, m) => incAt(it, D.dates.length - 1, m);
  const engagement = it => { const v = last(it); if (!v || !(it.r > 0)) return null; return ((v[1] || 0) + (v[2] || 0) + (v[3] || 0) + (v[4] || 0)) / it.r; };
  const completion = it => (it.a > 0 && it.l > 0) ? Math.min(it.a / it.l, 1) : null;
  const likeRate = it => { const v = last(it); return v && v[0] > 0 ? (v[1] || 0) / v[0] : null; };
  const quality = it => it.c === '인스타그램' ? engagement(it) : it.c === '유튜브' ? completion(it) : likeRate(it);
  const qName = ch => ch === '인스타그램' ? '참여율' : ch === '유튜브' ? '시청 완료율' : '좋아요율';
  const mainM = ch => OWN.includes(ch) ? 0 : 1;
  const mainVal = it => val(it, mainM(it.c));
  const isBench = ch => !OWN.includes(ch);
  const chColor = ch => {
    if (CH_VAR[ch]) return css(CH_VAR[ch]);
    const b = benchNames();
    return css(['--ch-b1', '--ch-b2', '--ch-b3'][Math.max(0, b.indexOf(ch)) % 3]);
  };
  const benchNames = () => D.channels.filter(c => c.bench).map(c => c.name);
  const chName = ch => CH_BADGE[ch] || ch;
  const fmtType = t => t === '1분 이하' ? '쇼츠(1분 이하)' : t;

  // 채널 기준값(최근 1년 중앙값, 광고·스토리 제외) — 성과 지수 = 콘텐츠 값 ÷ 기준값
  const BASE = {};
  function baseOf(ch, m) {
    m = m == null ? mainM(ch) : m;
    const k = ch + '|' + m;
    if (BASE[k]) return BASE[k];
    const its = D.items.filter(it => it.c === ch && it.t !== '스토리' && !it.ad && it.d >= addDays(D.updated, -365));
    BASE[k] = { v: median(its.map(it => val(it, m))) || 1, q: median(its.map(quality)) };
    return BASE[k];
  }
  const ratio = it => { const v = mainVal(it); return v == null ? null : v / baseOf(it.c).v; };
  const likeRatio = it => { const v = val(it, 1); return v == null ? null : v / baseOf(it.c, 1).v; };
  const isHit = it => { const r = ratio(it); return r != null && r >= HIT; };
  const hitRate = L => { const f = L.filter(it => ratio(it) != null); return f.length ? f.filter(isHit).length / f.length : null; };

  // ───────── 제목·배너 ─────────
  function title(s) {
    const lines = String(s || '').split(/[⠀ㅤᅟ]|\n+|\s{3,}| - - /).map(x => x.replace(/[|｜【】\[\]#]/g, ' ').replace(/\s+/g, ' ').trim().replace(/^[^\p{L}\p{N}]+/u, '')).filter(Boolean);
    return lines[0] || '(캡션 없음)';
  }
  function badge(ch) { return '<span class="chb" style="--c:' + chColor(ch) + '">' + esc(chName(ch)) + '</span>'; }
  function line(it) { return '<span class="ln">' + badge(it.c) + '<span class="tx">' + esc(title(it.n)) + '</span></span>'; }
  const ptag = p => '<span class="tag ' + (PROD_CLASS[p] || '') + '">' + esc(p) + '</span>';
  const adtag = it => it.ad ? '<span class="tag p-ad" title="' + esc(it.ad.s === '패턴' ? '광고 리포트 이후 영상 · 조회 패턴으로 추정' : '구글애즈 캠페인 연결(' + it.ad.s + '): ' + it.ad.k.join(', ')) + '">광고' + (it.ad.s === '확인' ? '' : '?') + '</span>' : '';

  // ───────── 필터 ─────────
  const since = () => S.range === 'all' ? '' : addDays(D.updated, -Number(S.range));
  function pool(o) {
    o = o || {};
    const f = o.since !== undefined ? o.since : since();
    const u = o.until || '9999';
    const chs = o.channels || OWN;
    return D.items.filter(it => chs.includes(it.c) && it.t !== '스토리' && (!f || it.d >= f) && it.d <= u && (o.ads || S.ads || !it.ad) && (!o.g || it.g === o.g));
  }
  function groupBy(L, key) {
    const g = {};
    L.forEach(it => { const k = typeof key === 'function' ? key(it) : it[key]; (g[k] = g[k] || []).push(it); });
    return Object.entries(g).map(([k, arr]) => ({ k, n: arr.length, idx: median(arr.map(ratio)) || 0, v: median(arr.map(mainVal)), q: median(arr.map(quality)), hit: hitRate(arr), arr }));
  }

  // ───────── 공통 조각 ─────────
  const secOpen = (h, p, right) => '<div class="gap"></div><section class="sec"><div class="sh"><div><h2>' + h + '</h2>' + (p ? '<p>' + p + '</p>' : '') + '</div>' + (right || '') + '</div>';
  const secClose = '</section>';
  function rankRows(L, opt) {
    opt = opt || {};
    return L.map((it, i) => {
      const r = it.ad ? null : ratio(it), d = r == null ? null : r - 1;
      const right = opt.right ? opt.right(it) : '<span class="num">' + fmtK(mainVal(it)) + '</span> <em class="' + (it.ad ? 'flat' : d >= 0 ? 'up' : 'down') + '">' + (it.ad ? '광고' : d == null ? '' : sgn(d) + Math.round(d * 100) + '%') + '</em>';
      return '<li class="rk" tabindex="0" data-i="' + i + '"><span class="no">' + (i + 1) + '</span>' +
        '<span class="t"><b>' + line(it) + '</b><span>' + right + ' · ' + esc(dot(it.d)) + '</span></span>' +
        '<span class="tg"><span class="tag">' + esc(it.g) + '</span>' + ptag(it.p) + adtag(it) + '</span></li>';
    }).join('') || '<li class="empty">조건에 맞는 콘텐츠가 없어요.</li>';
  }
  function wireRank(el, L) {
    if (!el) return;
    el.querySelectorAll('.rk').forEach(li => {
      const go = () => openDetail(L[+li.dataset.i]);
      li.addEventListener('click', go); li.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    });
  }
  function bars(el, rows, fmtSub, onClick) {

  function drawLife(chs) {

  // ═════════ 4. 입시 시즌 ═════════
  function seasons() {

    for (let y = Math.max(y0, y1 - 3); y <= y1; y++) {
      out.push({ id: y + '수시', label: (y + 1) + '학년도 수시 (' + y + '.8~9월)', from: y + '-08-01', to: y + '-09-30' });

    }

  }

  function viewExplore() {

  const exploreList = (o) => pool(Object.assign({ channels: viewChannels() }, o || {}));

    box.innerHTML = rects.map((r, i) => {
      const d = (ratio(r.it) || 0) - 1, area = r.w * r.h;

      return '<button type="button" class="' + cls + '" data-i="' + i + '" style="left:' + r.x + 'px;top:' + r.y + 'px;width:' + r.w + 'px;height:' + r.h + 'px;background:' + heat(d) + '">' +
        '<span class="a">' + esc(title(r.it.n)) + '</span><span class="b num">' + fmtK(mainVal(r.it)) + ' · ' + sgn(d) + Math.round(d * 100) + '%</span></button>';
    }).join('');

    $('scale').innerHTML = '<span>평소보다 낮음</span>' + [-0.75, -0.4, 0, 1, 3].map(d => '<i style="background:' + heat(d) + '"></i>').join('') + '<span>높음</span>';
  }
  function heat(d) {
    const up = [[120, 182, 214], [52, 148, 196], [0, 120, 173], [0, 84, 148]];
    const dn = [[206, 184, 120], [190, 162, 88], [170, 138, 58], [140, 110, 36]];
    if (d >= 0) { const k = d < 0.3 ? 0 : d < 1 ? 1 : d < 3 ? 2 : 3; return 'rgb(' + up[k].join(',') + ')'; }
    const k = d > -0.25 ? 0 : d > -0.5 ? 1 : d > -0.75 ? 2 : 3; return 'rgb(' + dn[k].join(',') + ')';
  }
  function squarify(nodes, x, y, w, h) {
    const total = nodes.reduce((s, n) => s + n.w, 0), scale = (w * h) / total;
    const items = nodes.map(n => ({ it: n.it, a: n.w * scale }));
    const out = []; let rect = { x, y, w, h }, row = [];
    const worst = (r, side) => { const s = r.reduce((t, n) => t + n.a, 0); const mx = Math.max(...r.map(n => n.a)), mn = Math.min(...r.map(n => n.a)); return Math.max(side * side * mx / (s * s), (s * s) / (side * side * mn)); };
    const layout = r => {
      const s = r.reduce((t, n) => t + n.a, 0);
      if (rect.w >= rect.h) { const cw = s / rect.h; let cy = rect.y; r.forEach(n => { const ch = n.a / cw; out.push({ it: n.it, x: Math.round(rect.x), y: Math.round(cy), w: Math.round(cw), h: Math.round(ch) }); cy += ch; }); rect = { x: rect.x + cw, y: rect.y, w: rect.w - cw, h: rect.h }; }
      else { const ch = s / rect.w; let cx = rect.x; r.forEach(n => { const cw = n.a / ch; out.push({ it: n.it, x: Math.round(cx), y: Math.round(rect.y), w: Math.round(cw), h: Math.round(ch) }); cx += cw; }); rect = { x: rect.x, y: rect.y + ch, w: rect.w, h: rect.h - ch }; }
    };
    items.forEach(n => { const side = Math.min(rect.w, rect.h); if (!row.length || worst(row.concat(n), side) <= worst(row, side)) row.push(n); else { layout(row); row = [n]; } });
    if (row.length) layout(row);
    return out;
  }
  function renderRank() {
    const tabs = [['views', '많이 본'], ['hot', '평소보다 잘 된'], ['quality', '반응 좋은']];

    $('rankTabs').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { S.rankBy = b.dataset.k; S.rankShown = 10; renderRank(); }));
    const L = exploreList({ g: S.g || undefined });
    const score = { views: mainVal, hot: ratio, quality, week: it => inc(it, mainM(it.c)) }[S.rankBy] || mainVal;
    $('rankSub').textContent = { views: '게시물 1개의 누적 ' + (S.ch === '타 대학' ? '좋아요' : '조회수') + ' 순', hot: '채널 평소 대비 배수 순 — 채널 규모 차이를 지운 비교', quality: '인스타 참여율 · 유튜브 시청 완료율 · hong 좋아요율', week: '직전 기록 대비 증가량 순' }[S.rankBy] + (S.g ? ' · ' + S.g : '');
    const sorted = L.filter(it => score(it) != null).sort((a, b) => score(b) - score(a));
    const shown = sorted.slice(0, S.rankShown);
    $('rank').innerHTML = rankRows(shown, S.rankBy === 'quality' ? { right: it => qName(it.c) + ' <em>' + pct(quality(it)) + '</em>' } : S.rankBy === 'week' ? { right: it => '<em class="up">+' + fmtK(inc(it, mainM(it.c))) + '</em> 이번 주' } : null);
    wireRank($('rank'), shown);
    $('rankMore').hidden = S.rankShown >= sorted.length;
  }
  function tcols() {
    const own = S.ch !== '타 대학';
    const c = [
      { k: 'n', l: '콘텐츠', v: it => title(it.n) },
      { k: 'd', l: '게시일', v: it => it.d },
      { k: 't', l: '형식', v: it => fmtType(it.t) },
      { k: 'g', l: '분류', v: it => it.g },
      { k: 'p', l: '제작', v: it => it.p },
      { k: 'm', l: own ? '조회수' : '좋아요', v: mainVal, n: 1 },
      { k: 'r', l: '평소 대비', v: it => !!it.ad ? null : ratio(it), n: 1, f: xf },
      { k: 'q', l: '반응', v: quality, n: 1, f: pct },
    ];
    if (weekly()) c.push({ k: 'w', l: '주간 증가', v: it => inc(it, mainM(it.c)), n: 1, f: v => v == null ? '–' : sgn(v) + fmt(v) });
    return c;
  }

    const r = ratio(it), g = groupBy(D.items.filter(x => x.c === it.c && !x.ad && x.t !== '스토리'), 'g').find(x => x.k === it.g);
    const parts = [];
    if (r != null) parts.push(r >= 1 ? '채널 평소보다 ' + r.toFixed(1) + '배 잘 된 콘텐츠예요.' : '채널 평소의 ' + Math.round(r * 100) + '% 수준이에요.');
    if (g) parts.push('같은 「' + it.g + '」 분류는 보통 평소의 ' + g.idx.toFixed(1) + '배를 내는데, 이 콘텐츠는 ' + (r != null && r > g.idx ? '그보다 높아요.' : '그보다 낮아요.'));
    if (it.c === '인스타그램' && it.r > 0) parts.push('리치 ' + fmtK(it.r) + ' 중 ' + pct(engagement(it)) + '가 반응했어요.');
    if (it.w && it.w.length) parts.push(it.p + ' ' + it.w.join(', ') + ' 제작이에요.');
    return parts.join(' ');
  }
  function openDetail(it) {
    if (!it) return;
    lastFocus = document.activeElement;
    const v = last(it) || [], m = mainM(it.c), r = it.ad ? null : ratio(it), d = r == null ? null : r - 1;
    const cls = d == null ? 'flat' : d >= 0 ? 'up' : 'down';
    const wk = weekly() ? inc(it, m) : null;
    const metrics = [['조회수', fmt(v[0])], ['좋아요', fmt(v[1])], ['댓글', fmt(v[2])]];
    if (it.c === '인스타그램') metrics.push(['공유', fmt(v[3])], ['저장', fmt(v[4])], ['리치', fmt(it.r)], ['참여율', pct(engagement(it))], ['저장률', it.r ? pct((v[4] || 0) / it.r) : '–']);
    if (it.c === '유튜브') metrics.push(['영상 길이', it.l ? Math.floor(it.l / 60) + '분 ' + (it.l % 60) + '초' : '–'], ['평균 시청', it.a ? fmt(it.a) + '초' : '–'], ['시청 완료율', pct(completion(it))], ['참여한 조회', fmt(it.e)]);
    if (isBench(it.c) || it.c === 'hong._.video') metrics.push(['좋아요율', pct(likeRate(it))]);
    metrics.push(['게시일', it.d], ['형식', fmtType(it.t)]);
    if (it.w && it.w.length) metrics.push(['참여자', it.w.join(', ')]);
    if (it.ad && it.ad.k.length && D.ads) { const cs = D.ads.camps.filter(c => it.ad.k.includes(c.n)); metrics.push(['광고 캠페인', cs.length + '개 · ' + dot(cs.map(c => c.from).sort()[0]) + '~' + dot(cs.map(c => c.to).sort().pop())], ['캠페인 광고비', fmt(sum(cs.map(c => c.cost))) + '원' + (cs.some(c => c.videos.length > 1) ? ' (여러 영상 공동)' : '')], ['캠페인 노출', fmt(sum(cs.map(c => c.imp)))]); }
    const sim = D.items.filter(x => x !== it && x.c === it.c && x.g === it.g && x.t !== '스토리').sort((a, b) => (mainVal(b) || 0) - (mainVal(a) || 0)).slice(0, 5);
    const el = $('detail');
    el.innerHTML = '<div class="dwrap">' +
      '<div class="dh"><button type="button" id="dClose" aria-label="뒤로">‹</button><div class="ctr"><small>' + esc(it.c) + ' · ' + esc(it.g) + '</small><b class="num ' + cls + '">' + fmtK(mainVal(it)) + ' ' + (d == null ? '' : sgn(d) + Math.round(d * 100) + '%') + '</b></div><span></span></div>' +
      '<div class="dtabs" role="tablist"><button type="button" role="tab" aria-selected="true" data-s="dChart">성과</button><button type="button" role="tab" aria-selected="false" data-s="dSig">성과 진단</button><button type="button" role="tab" aria-selected="false" data-s="dMet">지표</button><button type="button" role="tab" aria-selected="false" data-s="dSim">비슷한 콘텐츠</button></div>' +
      '<section class="dsec" id="dChart"><h1 class="dtitle">' + line(it) + '</h1>' +
        '<div class="dbig num">' + fmt(mainVal(it)) + '<small class="' + cls + '">' + (it.ad ? '광고 영상이라 평소 대비는 계산하지 않아요' : d == null ? '' : '평소 대비 ' + sgn(d) + Math.round(d * 100) + '%') + '</small></div>' +
        (wk != null ? '<div class="num ' + (wk >= 0 ? 'up' : 'down') + '" style="font-weight:700;margin-top:2px">이번 주 ' + sgn(wk) + fmt(wk) + '</div>' : '') +
        '<div class="dtags"><span class="tag">' + esc(it.g) + '</span>' + ptag(it.p) + adtag(it) + '<span class="tag">' + esc(fmtType(it.t)) + '</span>' + (it.w || []).map(n => '<span class="tag">' + esc(n) + '</span>').join('') + '</div>' +
        '<div class="cmp"><canvas id="dCanvas"></canvas></div>' +
        '<div class="dper"><span class="' + (D.dates.length > 1 ? '' : 'on') + '">비교</span><span class="' + (D.dates.length > 1 ? 'on' : '') + '">주간 추이</span></div></section>' +
      '<div class="gap"></div><section class="dsec why"><div class="lb">✦ ' + (it.ad ? '광고 집행 정보' : d == null || d >= 0 ? '왜 잘 됐을까?' : '왜 아쉬웠을까?') + '<small>' + mdLabel(D.updated) + ' 기준</small></div><p>' + esc(whyText(it)) + '</p></section>' +
      '<div class="gap"></div><section class="dsec sig" id="dSig"><h3>성과 진단</h3><div class="h">같은 채널 게시물과 비교한 강점 · 보완할 점</div>' +
        signals(it).map(s => '<div class="sg"><span class="k ' + s[0] + '">' + s[1] + '</span><span><b>' + esc(s[2]) + '</b><span>' + esc(s[3]) + '</span></span></div>').join('') + '</section>' +
      '<div class="gap"></div><section class="dsec" id="dMet"><h3 style="margin:0 0 6px;font-size:22px;font-weight:800">지표</h3><div class="mgrid">' + metrics.map(m2 => '<div><span>' + esc(m2[0]) + '</span><b>' + esc(m2[1]) + '</b></div>').join('') + '</div>' +
        '<h3 style="margin:22px 0 10px;font-size:17px;font-weight:700">캡션</h3><p class="caption">' + esc(String(it.n || '').trim()) + '</p></section>' +
      '<div class="gap"></div><section class="dsec" id="dSim"><h3 style="margin:0 0 6px;font-size:22px;font-weight:800">같은 분류의 다른 콘텐츠</h3><ol class="rank" id="dSimList">' + rankRows(sim) + '</ol></section>' +
      '</div><div class="cta">' + (it.u ? '<a href="' + esc(it.u) + '" target="_blank" rel="noopener">원본 보기</a>' : '<span>원본 링크는 인스타그램 앱에서 확인해 주세요</span>') + '</div>';
    el.hidden = false; el.scrollTop = 0; document.body.style.overflow = 'hidden';
    $('dClose').focus();
    $('dClose').addEventListener('click', closeDetail);
    el.querySelectorAll('.dtabs button').forEach(b => b.addEventListener('click', () => {
      el.querySelectorAll('.dtabs button').forEach(x => x.setAttribute('aria-selected', x === b));
      el.scrollTo({ top: $(b.dataset.s).offsetTop - 120, behavior: 'smooth' });
    }));
    wireRank($('dSimList'), sim);
    drawDetailChart(it);
  }
  function drawDetailChart(it) {
    const m = mainM(it.c), col = chColor(it.c);
    if (D.dates.length > 1) {
      draw('dCanvas', { type: 'line', data: { labels: D.dates.map(mdLabel), datasets: [{ data: D.dates.map((d, i) => it.h[i] ? it.h[i][m] : null), borderColor: col, borderWidth: 2.5, pointRadius: 3, tension: 0.25, spanGaps: true }] }, options: chartOpts({ scales: { y: { beginAtZero: false } } }) });
      return;
    }
    const base = baseOf(it.c);
    const g = groupBy(D.items.filter(x => x.c === it.c && !x.ad && x.t !== '스토리'), 'g').find(x => x.k === it.g);
    const rows = [['이 콘텐츠', mainVal(it), col], ['「' + it.g + '」 중앙값', g ? g.v : null, css('--muted')], ['채널 중앙값', base.v, css('--line')]];
    draw('dCanvas', {
      type: 'bar', data: { labels: rows.map(r => r[0]), datasets: [{ data: rows.map(r => r[1]), backgroundColor: rows.map(r => r[2]), borderRadius: 8, maxBarThickness: 64 }] },
      options: chartOpts({ plugins: { tooltip: { callbacks: { label: c => fmt(c.raw) } } } }),
      plugins: [{ id: 'vl', afterDatasetsDraw(ch) { const x = ch.ctx; x.save(); x.font = '700 14px ' + css('--font'); x.fillStyle = css('--fg'); x.textAlign = 'center'; ch.getDatasetMeta(0).data.forEach((b, i) => x.fillText(fmtK(rows[i][1]), b.x, b.y - 8)); x.restore(); } }],
    });
  }
  function closeDetail() {
    $('detail').hidden = true; document.body.style.overflow = '';
    if (charts.dCanvas) { charts.dCanvas.destroy(); delete charts.dCanvas; }
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('detail').hidden) closeDetail(); });

  // ───────── 차트 공통 ─────────
  function chartOpts(extra) {
    Chart.defaults.font.family = css('--font'); Chart.defaults.color = css('--muted'); Chart.defaults.font.size = 13;
    const o = { responsive: true, maintainAspectRatio: false, animation: false, layout: { padding: { top: 24 } },
      plugins: { legend: { display: false, labels: { boxWidth: 12, boxHeight: 12, color: css('--sub') } }, tooltip: { backgroundColor: css('--fg'), titleColor: css('--bg'), bodyColor: css('--bg'), padding: 10, displayColors: false } },
      scales: { x: { grid: { display: false }, border: { display: false }, ticks: { color: css('--sub'), font: { size: 13, weight: '600' } } }, y: { display: false, beginAtZero: true, border: { display: false } } } };
    return merge(o, extra || {});
  }
  function merge(a, b) { Object.keys(b).forEach(k => { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && typeof b[k] !== 'function' && a[k] && typeof a[k] === 'object') merge(a[k], b[k]); else a[k] = b[k]; }); return a; }
  function draw(id, cfg) { if (charts[id]) charts[id].destroy(); const el = $(id); if (!el) return; charts[id] = new Chart(el, cfg); }

  // ───────── 렌더 ─────────
  function wireScroll() { document.querySelectorAll('.tw').forEach(w => { if (w.__sc) return; w.__sc = 1; const f = () => w.classList.toggle('scrolled', w.scrollLeft > 2); w.addEventListener('scroll', f, { passive: true }); f(); }); }
  new MutationObserver(() => wireScroll()).observe(document.body, { childList: true, subtree: true });
  function render() {
    Object.keys(charts).forEach(k => { if (k !== 'dCanvas') { charts[k].destroy(); delete charts[k]; } });
    save(); syncChrome();
    ({ brief: viewBrief, strategy: viewStrategy, maker: viewMaker, season: viewSeason, explore: viewExplore, export: viewExport }[S.view] || viewBrief)();
  }
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (S.view === 'explore') renderTrend(); }, 150); });

  function boot(data) {
    D = data;
    const sv = load(); if (sv) Object.assign(S, sv);
    if (!VIEWS.some(v => v[0] === S.view)) S.view = 'brief';
    buildChrome(); render();
    const rer = () => { render(); };
    try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rer); } catch (e) {}
    new MutationObserver(rer).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  }
  const fail = () => { $('st1').textContent = '데이터를 불러오지 못했어요. 잠시 후 새로고침해 주세요.'; };
  if (window.SNS_API_URL) {
    window.__sbData = d => { try { boot(d); } catch (e) { console.error(e); fail(); } };
    const sc = document.createElement('script'); sc.src = window.SNS_API_URL + '?callback=__sbData&t=' + Date.now(); sc.onerror = fail; document.body.appendChild(sc);
  } else {
    fetch('./data.json', { cache: 'no-store' }).then(r => r.json()).then(boot).catch(e => { console.error(e); fail(); });
  }
})();
</script>
